<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Økonomiinterview HimmerLand</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style id="css">
/* Layout: arbejdsdokument til venstre, redigeringschat fast til højre (under på mobil) */
:root{
  --bg:#f6f3ef; --paper:#ffffff; --ink:#2b2119; --muted:#6b5f55; --line:#e4dcd2;
  --brown:#3c2c1c; --slate:#7794a8; --blue:#1f5f8b; --accent:#b5651d; --accent-soft:#f6e7d8;
  --ok:#2e7d4f; --warn:#a33; --chip:#efe9e2;
  --f-display:"Exo 2", "Segoe UI", system-ui, sans-serif;
  --f-body:"Inter", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1714; --paper:#25201b; --ink:#efe7de; --muted:#b3a597; --line:#3a322b;
  --brown:#e8d7c2; --slate:#9db6c8; --blue:#8cbfe3; --accent:#e39a55; --accent-soft:#3a2a1c;
  --ok:#7fc79a; --warn:#f08a8a; --chip:#332b24; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b1714; --paper:#25201b; --ink:#efe7de; --muted:#b3a597; --line:#3a322b;
  --brown:#e8d7c2; --slate:#9db6c8; --blue:#8cbfe3; --accent:#e39a55; --accent-soft:#3a2a1c;
  --ok:#7fc79a; --warn:#f08a8a; --chip:#332b24; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;max-width:1800px;margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px}
@media (max-width:960px){.wrap{grid-template-columns:minmax(0,1fr)}}
.wrap.nochat{grid-template-columns:minmax(0,1fr)}
.wrap.nochat aside.chat{display:none}
.wrap:fullscreen{max-width:none;width:100%;height:100%;overflow:auto;background:var(--bg);box-sizing:border-box}
.wrap:fullscreen .viewer{height:calc(100vh - 190px)}
.wrap:fullscreen aside.chat{height:calc(100vh - 40px);max-height:none}
.hdr-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.savest{font-size:.82rem;color:var(--muted)}
.savest.dirty{color:var(--warn);font-weight:600}
.vt .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding-left:8px;border-left:1px solid var(--line)}
.vt select,.vt input[type=text]{font:inherit;font-size:.85rem;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.vt input[type=text]{width:13em}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.viewer.mode-arrow,.viewer.mode-del{cursor:crosshair}
.drawbar{position:absolute;left:10px;bottom:10px;z-index:4;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:.82rem;box-shadow:0 4px 14px rgba(0,0,0,.15)}
header.top{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px}
header.top h1{font-family:var(--f-display);font-weight:700;font-size:1.35rem;color:var(--brown);margin:0;text-wrap:balance}
header.top .meta{color:var(--muted);font-size:.85rem}
.tabs{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line)}
.tabs .sp{flex:1}
.tabs button.tg{font-weight:500;font-size:.82rem;border:1px solid var(--line);border-radius:6px;padding:5px 10px;margin-bottom:6px;color:var(--ink);background:var(--chip)}
.tabs button{font:600 .9rem var(--f-body);background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:8px 12px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--brown);border-bottom-color:var(--accent)}
.tabs button:focus-visible,.btn:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main.doc{min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:28px clamp(16px,4vw,44px)}
.doc h2.title{font-family:var(--f-display);font-weight:700;font-size:1.7rem;line-height:1.2;color:var(--brown);margin:0 0 6px;text-wrap:balance}
.doc .sub{color:var(--slate);font-family:var(--f-display);font-size:.92rem;margin:0 0 22px}
.doc h3{font-family:var(--f-display);font-weight:600;font-size:1.12rem;color:var(--brown);margin:26px 0 10px;padding-bottom:4px;border-bottom:1px solid var(--line);text-wrap:balance}
.doc p{margin:0 0 10px;max-width:72ch}
.doc ul.bul{margin:0 0 10px;padding-left:20px;max-width:72ch}
.doc ul.bul li{margin-bottom:6px}
.doc ul.bul b{color:var(--brown)}
.q{display:grid;grid-template-columns:2.2em minmax(0,1fr);gap:0 8px;padding:10px 0;border-bottom:1px dashed var(--line);max-width:80ch}
.q .n{font-family:var(--f-display);font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;text-align:right}
.q .qt{font-family:var(--f-display);font-weight:600;color:var(--brown)}
.q .bg{color:var(--slate);font-size:.86rem;margin-top:4px}
.q .bt{color:var(--blue);font-size:.86rem;margin-top:2px}
.q .bg b,.q .bt b{font-weight:600}
.flash{animation:flash 2.4s ease-out}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}
.vt{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.vt .zl{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums;min-width:4em}
.vt .hint{font-size:.8rem;color:var(--muted);flex:1;min-width:200px;text-align:right}
.viewer{position:relative;height:calc(100vh - 220px);min-height:440px;overflow:hidden;border:1px solid var(--line);border-radius:4px;background:#fff;cursor:grab;touch-action:none;user-select:none}
.viewer.drag{cursor:grabbing}
.viewer svg{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none}
.viewer svg .mk{cursor:pointer}
.viewer svg circle.mk:hover{stroke:#7a3e00;stroke-width:3}
.viewer svg circle.mk.on{stroke:#7a3e00;stroke-width:4;animation:pulse 1.1s ease-in-out 3}
@keyframes pulse{50%{stroke-width:9;stroke-opacity:.5}}
@media (prefers-reduced-motion:reduce){.viewer svg circle.mk.on{animation:none}}
.pop{position:absolute;z-index:5;width:min(400px,calc(100% - 24px));background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px 14px;font-size:.9rem;cursor:default;user-select:text}
.pop .ph{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.pop .pn{font-family:var(--f-display);font-weight:700;color:var(--accent);font-size:1.1rem}
.pop .px{margin-left:auto;background:none;border:0;font-size:1.2rem;line-height:1;color:var(--muted);cursor:pointer}
.pop .qt{font-family:var(--f-display);font-weight:600;color:var(--brown)}
.pop .bg{color:var(--slate);font-size:.84rem;margin-top:6px}
.pop .bt{color:var(--blue);font-size:.84rem;margin-top:3px}
.pop .row{margin-top:10px}
.q .n button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.q{scroll-margin-top:16px}
.note{color:var(--muted);font-size:.85rem;margin-top:10px}
aside.chat{min-width:0;position:sticky;top:max(12px, env(safe-area-inset-top, 0px));align-self:start;height:calc(100vh - 40px);max-height:900px;
  display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:6px;overflow:hidden}
@media (max-width:960px){aside.chat{position:static;height:auto;max-height:none}}
.chat .hd{padding:12px 14px;border-bottom:1px solid var(--line)}
.chat .hd h2{font-family:var(--f-display);font-size:1rem;margin:0;color:var(--brown)}
.chat .hd p{margin:2px 0 0;color:var(--muted);font-size:.8rem}
.msgs{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-height:160px}
.m{max-width:92%;padding:8px 10px;border-radius:8px;font-size:.88rem;white-space:pre-wrap;overflow-wrap:anywhere}
.m.u{align-self:flex-end;background:var(--accent-soft);color:var(--ink)}
.m.a{align-self:flex-start;background:var(--chip);color:var(--ink)}
.m .t{display:block;font-size:.72rem;color:var(--muted);margin-top:4px}
.m .chg{display:inline-block;margin-top:4px;font-size:.75rem;color:var(--ok)}
.m.err{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.empty{color:var(--muted);font-size:.85rem}
.ex{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ex button{font:500 .78rem var(--f-body);background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer;text-align:left}
.compose{border-top:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:8px}
.compose textarea{font:inherit;font-size:.9rem;width:100%;box-sizing:border-box;min-height:70px;resize:vertical;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{font:600 .85rem var(--f-body);border-radius:6px;padding:7px 14px;cursor:pointer;border:1px solid var(--line);background:var(--chip);color:var(--ink)}
.btn.primary{background:var(--brown);color:var(--paper);border-color:var(--brown)}
.btn:disabled{opacity:.5;cursor:default}
.status{font-size:.78rem;color:var(--muted);flex:1;min-width:120px}
</style>

<script id="state" type="application/json">{"version": 10, "guide": {"title": "Interviewguide til økonomi om Business Central", "sub": "HimmerLand Fase 0 | Løsningsarkitektur og design | Kvadrant | v0.2 02/11/2026 (90 min)", "sections": [{"heading": "Om interviewet", "items": [{"type": "bullet", "label": "Hvem.", "text": "Palle Hollensen (Director of Finance og IT), Emma Kronborg og Tinna Taasti Jensen fra økonomi. Lønassistenten er på standby."}, {"type": "bullet", "label": "Formål.", "text": "Forstå hvordan Business Central hænger sammen med de andre systemer i dag, og hvad der mangler."}, {"type": "bullet", "label": "Sådan.", "text": "Vis tegningen og tal ud fra den. De skal kun fortælle, ikke vise eller sende noget. Nr. 3, 6 og 9 er de vigtigste."}]}, {"heading": "A. Roller og tegningen (ca. 15 min)", "items": [{"type": "question", "n": 1, "q": "Hvem gør hvad i Business Central? Tænk på debitorer, kreditorer, bank, løn, lager og månedsafslutning.", "baggrund": "Emma og Tinna dækker ifølge Workshop I begge Spectra til Business Central, afstemninger, kasserapporter og depositum, men er primus motor på hvert sit. Titlerne kender vi ikke."}, {"type": "question", "n": 2, "q": "Se på tegningen. Hvad er forkert, og hvad mangler?", "baggrund": "Tegningen bygger på René og netIP og interviewet med Martin 28/10. Martin trækker kun tal ud af Business Central og lægger ingen ind."}]}, {"heading": "B. Sådan hænger det sammen (ca. 40 min)", "items": [{"type": "question", "n": 3, "q": "Hvordan ender en krone fra en booking i Spectra i Business Central, og hvem tjekker, at det er rigtigt?", "baggrund": "Omsætningen bogføres automatisk hver morgen via Fabric. Konto og afdeling ligger i kode hos netIP. Før tog det 2 til 3 timer om dagen i hånden."}, {"type": "question", "n": 4, "q": "Hvordan kommer salget fra kasserne i restauranterne (Spectra POS) og i købmand, golfshop og spashop (FlexPos) over i Business Central, og hvordan afstemmer I kassen?", "baggrund": "Spectra POS går gennem Spectra. FlexPos ligger oven på Business Central og henter varer og lager derfra."}, {"type": "question", "n": 5, "q": "Hvordan kommer aktiviteter fra HalBooking og gavekort fra Life Peaks ind i Business Central?", "baggrund": "Level 2 siger, at Globus sender til Business Central, men netIP var i tvivl om hvordan. Workshop II siger, at Life Peaks er koblet til Spectra og FlexPos, men Level 2 siger ingen integration. Der står mange penge på gavekortene, og momsen afregnes, når kortet købes."}, {"type": "question", "n": 6, "q": "Hvordan kommer pengene ind fra Nordea, Betalingsservice, Nets terminalerne og MobilePay? Hvad går automatisk, og hvad gør I i hånden?", "baggrund": "Filen fra Nordea læses ind i både Spectra og Business Central hver dag. Filen til Betalingsservice sendes fra Business Central omkring den 20. Nets terminalerne er koblet til Spectra. MobilePay kender vi ikke."}, {"type": "question", "n": 7, "q": "Hvor laves fakturaer til firmaer og agenter, og hvordan følger depositum og forudbetalinger med fra Spectra til Business Central?", "baggrund": "Fakturaerne sendes fra Spectra og betales med FIK kode. Depositum føres med i flowet fra Spectra."}, {"type": "question", "n": 8, "q": "Hvad går ud af Business Central til Fabric og Power BI, og hvad kommer ind fra Continia, LessorLøn og budgettet?", "baggrund": "Finansdata synkroniseres fuldt til Fabric. Continia er et app i Business Central. Koblingen til LessorLøn kender vi ikke. Budgettet laves i Excel."}]}, {"heading": "C. Mangler i dag (ca. 30 min)", "items": [{"type": "question", "n": 9, "q": "Hvor taster I det samme flere steder, eller flytter data i hånden mellem systemer?", "baggrund": "Filen fra Nordea læses ind to steder (pain 86). Køb i købmanden til en konference viderefaktureres i hånden (pain 78). Husejere og Business Club oprettes først som debitor i Business Central og bagefter i hånden i Spectra, HalBooking og Salto (Anettes arbejdsopgaver)."}, {"type": "question", "n": 10, "q": "Hvor opstår der fejl, og hvordan opdager I dem?", "baggrund": "Fakturaen gennemgås linje for linje (pain 82). Kun netIP kan rette kontomappingen. Rettes kundekortet i Spectra, glipper Betalingsservice. Business Club rabat konteres forskelligt, alt efter hvordan den tastes (pain 87)."}, {"type": "question", "n": 11, "q": "Hvad tager mest tid i en almindelig uge og ved månedsafslutning?", "baggrund": "Vi kender ikke trinene i månedsafslutningen."}, {"type": "question", "n": 12, "q": "Hvilke tal eller hvilket overblik mangler I i dag?", "baggrund": "Omsætning pr. firmaaftale findes i to systemer (pain 91). Data skal graves ud af Spectra (pain 139)."}]}, {"heading": "D. Afrunding (ca. 5 min)", "items": [{"type": "question", "n": 13, "q": "Er der noget, vi ikke har spurgt om? Er der andre, vi bør tale med?", "baggrund": "Lønassistenten er på standby."}]}]}, "tegning": {"title": "ASIS tegning: Business Central og økonomi", "svg": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"2000\" height=\"1250\" viewBox=\"0 0 2000 1250\" font-family=\"Arial, Helvetica, sans-serif\">\u003crect width=\"2000\" height=\"1250\" fill=\"#fff\"/>\u003cdefs>\u003cmarker id=\"a_auto\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#333\"/>\u003c/marker>\u003cmarker id=\"a_autos\" markerWidth=\"10\" markerHeight=\"10\" refX=\"1\" refY=\"5\" orient=\"auto\">\u003cpath d=\"M10,0 L0,5 L10,10 z\" fill=\"#333\"/>\u003c/marker>\u003cmarker id=\"a_man\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#c62828\"/>\u003c/marker>\u003cmarker id=\"a_mans\" markerWidth=\"10\" markerHeight=\"10\" refX=\"1\" refY=\"5\" orient=\"auto\">\u003cpath d=\"M10,0 L0,5 L10,10 z\" fill=\"#c62828\"/>\u003c/marker>\u003cmarker id=\"a_unk\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\">\u003cpath d=\"M0,0 L10,5 L0,10 z\" fill=\"#8a8a8a\"/>\u003c/mark 52\" y=\"699\" font-size=\"15\" font-weight=\"bold\" fill=\"#222\">Firmaer og agenter\u003c/text>\n\u003ctext x=\"1552\" y=\"721\" font-size=\"14\" fill=\"#333\">faktura fra Spectra, betaler med FIK\u003c/text>\n\u003ctext x=\"1552\" y=\"740\" font-size=\"14\" fill=\"#333\">agentkommission og firmaaftaler\u003c/text>\n\u003ccircle cx=\"1922\" cy=\"690\" r=\"15\" fill=\"#f39c12\" stroke=\"#d68910\" stroke-width=\"1.5\"/>\n\u003ctext x=\"1922\" y=\"695\" font-size=\"14\" font-weight=\"bold\" fill=\"#fff\" text-anchor=\"middle\">7\u003c/text>\n\u003crect x=\"1540\" y=\"785\" width=\"400\" height=\"100\" rx=\"8\" fill=\"#ffffff\" stroke=\"#a07a12\" stroke-width=\"1.8\"/>\n\u003ctext x=\"1552\" y=\"809\" font-size=\"15\" font-weight=\"bold\" fill=\"#222\">Business Club og husejere\u003c/text>\n\u003ctext x=\"1552\" y=\"831\" font-size=\"14\" fill=\"#333\">kort, rabat skrives på varen\u003c/text>\n\u003ctext x=\"1552\" y=\"850\" font-size=\"14\" fill=\"#333\">opkræves via PBS, fejler hvis kundekort rettes\u003c/text>\n\u003ctext x=\"1552\" y=\"869\" font-size=\"14\" fill=\"#333\">debitor oprettes i BC, så i hånden i Spectra\u003c/text>\n\u003ccircle cx=\"1922\" cy=\"800\" r=\"15\" fill=\"#f39c12\" stroke=\"#d68910\" stroke-width=\"1.5\"/>\n\u003ctext x=\"1922\" y=\"805\" font-size=\"14\" font-weight=\"bold\" fill=\"#fff\" text-anchor=\"middle\">9\u003c/text>\n\u003ccircle cx=\"1888\" cy=\"800\" r=\"15\" fill=\"#f39c12\" stroke=\"#d68910\" stroke-width=\"1.5\"/>\n\u003ctext x=\"1888\" y=\"805\" font-size=\"14\" font-weight=\"bold\" fill=\"#fff\" text-anchor=\"middle\">6\u003c/text>\n\u003cpolyline points=\"1540,240 1490,240 1490,595 1162,595\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\" stroke-dasharray=\"9,6\" marker-end=\"url(#a_man)\"/>\n\u003crect x=\"1230.0\" y=\"572.5\" width=\"200\" height=\"61\" rx=\"3\" fill=\"#fff\" stroke=\"#e0a0a0\"/>\n\u003ctext x=\"1330\" y=\"591.5\" font-size=\"13\" fill=\"#c62828\" text-anchor=\"middle\">Manuel indtastning\u003c/text>\n\u003ctext x=\"1330\" y=\"608.5\" font-size=\"13\" fill=\"#c62828\" text-anchor=\"middle\">fil fra Nordea hver dag\u003c/text>\n\u003ctext x=\"1330\" y=\"625.5\" font-size=\"13\" fill=\"#c62828\" text-anchor=\"middle\">læses ind i BC og Spectra\u003c/text>\n\u003cpolyline points=\"1540,200 1500,200 1500,105 330,105 330,173\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\" stroke-dasharray=\"9,6\" marker-end=\"url(#a_man)\"/>\n\u003crect x=\"472.59999999999997\" y=\"91.5\" width=\"774.8000000000001\" height=\"27\" rx=\"3\" fill=\"#fff\" stroke=\"#e0a0a0\"/>\n\u003ctext x=\"860\" y=\"110.5\" font-size=\"13\" fill=\"#c62828\" text-anchor=\"middle\">Manuel indtastning, samme fil læses også ind i Spectra, ellers kan receptionen ikke se forudbetalinger\u003c/text>\n\u003cpolyline points=\"1162,655 1510,655 1510,365 1538,365\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\" stroke-dasharray=\"9,6\" marker-end=\"url(#a_man)\"/>\n\u003crect x=\"1170.0\" y=\"648.5\" width=\"320\" height=\"27\" rx=\"3\" fill=\"#fff\" stroke=\"#e0a0a0\"/>\n\u003ctext x=\"1330\" y=\"667.5\" font-size=\"13\" fill=\"#c62828\" text-anchor=\"middle\">Manuel indtastning, PBS fil fra BC ca. den 20.\u003c/text>\n\u003crect x=\"40\" y=\"920\" width=\"1920\" height=\"100\" rx=\"10\" fill=\"#f4f4f4\" stroke=\"#bdbdbd\" stroke-dasharray=\"7,5\" stroke-width=\"1.5\"/>\n\u003ctext x=\"56\" y=\"950\" font-size=\"17\" font-weight=\"bold\" fill=\"#666\">Ikke koblet til Business Central, så vidt vi ved\u003c/text>\n\u003ctext x=\"56\" y=\"978\" font-size=\"15\" fill=\"#333\">GolfBox og GolfNext (greenfee betales i shoppen), DinnerBooking, GetAccept (tilbud, intet med Continia at gøre), AeroGuest (check in og check ud),\u003c/text>\n\u003ctext x=\"56\" y=\"1000\" font-size=\"15\" fill=\"#333\">Quinyx (timer, API til Fabric), Emply (HR, master for medarbejdere), RateTiger og OTA kanaler (bookinger går til Spectra)\u003c/text>\n\u003ctext x=\"40\" y=\"1065\" font-size=\"16\" font-weight=\"bold\" fill=\"#222\">Signatur\u003c/text>\n\u003cpolyline points=\"40,1100 130,1100\" fill=\"none\" stroke=\"#333\" stroke-width=\"2\" marker-end=\"url(#a_auto)\"/>\n\u003ctext x=\"145\" y=\"1105\" font-size=\"15\" fill=\"#333\">Automatisk overførsel\u003c/text>\n\u003cpolyline points=\"400,1100 490,1100\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\" stroke-dasharray=\"9,6\" marker-end=\"url(#a_man)\"/>\n\u003ctext x=\"505\" y=\"1105\" font-size=\"15\" fill=\"#333\">Manuel indtastning (fil eller tastning)\u003c/text>\n\u003cpolyline points=\"820,1100 910,1100\" fill=\"none\" stroke=\"#8a8a8a\" stroke-width=\"2\" stroke-dasharray=\"3,5\" marker-end=\"url(#a_unk)\"/>\n\u003ctext x=\"925\" y=\"1105\" font-size=\"15\" fill=\"#333\">Uklart, skal bekræftes\u003c/text>\n\u003ccircle cx=\"1200\" cy=\"1100\" r=\"15\" fill=\"#f39c12\" stroke=\"#d68910\" stroke-width=\"1.5\"/>\n\u003ctext x=\"1200\" y=\"1105\" font-size=\"14\" font-weight=\"bold\" fill=\"#fff\" text-anchor=\"middle\">nr\u003c/text>\n\u003ctext x=\"1225\" y=\"1105\" font-size=\"15\" fill=\"#333\">Spørgsmål nr. i interviewguiden til økonomi. Tryk på et tal for at se spørgsmålet\u003c/text>\n\u003ctext x=\"40\" y=\"1145\" font-size=\"14\" fill=\"#444\">Flow er automatik i Fabric. Leverandørintegration er leverandørens egen kobling. Manuel indtastning er en fil eller tastning i hånden. Kilder. René og netIP (Level 2, Data Systemer v3.0, møde 19/10), interview med Martin Lund 28/10, Anettes arbejdsopgaver,\u003c/text>\n\u003ctext x=\"40\" y=\"1165\" font-size=\"14\" fill=\"#444\">Workshop I og II, interviews om K01, K03 og K08 og opfølgningen 8/10. Tegningen viser det, vi har hørt, og skal rettes af økonomi.\u003c/text>\u003c/svg>"}, "log": []}</script>
<script id="app-js">
(function(){

</div>`;
const RESET=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}';

let __restored=false;

const $=id=>document.getElementById(id);

function setTab(t){tab=t;try{sessionStorage.setItem('tab',tab)}catch(e){};render()}
document.querySelectorAll('.tabs button[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
$('togglechat').onclick=()=>{chatHidden=!chatHidden;try{sessionStorage.setItem('nochat',chatHidden?'1':'0')}catch(e){};render()};
function questions(){const out={};state.guide.sections.forEach(s=>s.items.forEach(it=>{if(it.type==='question')out[String(it.n)]=it}));return out}
let view={z:1,x:0,y:0,user:false};
function setupViewer(){
  const vw=$('viewer'), svg=vw.querySelector('svg'); if(!svg) return;

function getAt(obj,path){let o=obj;for(const p of path){if(o==null)throw new Error('Stien findes ikke: '+JSON.stringify(path));o=o[p]}return o}
function applyOps(ops){
  const undo=[]; const touched=new Set();
  for(const op of ops){
    if(op.op==='svg_replace'){
      const svg=state.tegning.svg; const i=svg.indexOf(op.find);
      if(i<0) throw new Error('Fandt ikke teksten i tegningen: '+String(op.find).slice(0,60));
      state.tegning.svg=svg.slice(0,i)+op.replace+svg.slice(i+op.find.length);
      undo.unshift({op:'svg_replace',find:op.replace,replace:op.find}); continue;
    }
    const path=op.path; if(!Array.isArray(path)||!path.length) throw new Error('Mangler sti i en ændring');
    if(path[0]!=='guide'&&path[0]!=='tegning') throw new Error('Loggen kan ikke ændres');
    const parent=getAt(state,path.slice(0,-1)), key=path[path.length-1];
    if(op.op==='set'){
      const had=Object.prototype.hasOwnProperty.call(parent,key);
      undo.unshift(had?{op:'set',path,value:structuredClone(parent[key])}:{op:'remove',path});
      parent[key]=op.value;
    }else if(op.op==='insert'){
      const arr=getAt(state,path); if(!Array.isArray(arr)) throw new Error('Kan kun indsætte i en liste');
      const idx=Math.max(0,Math.min(Number(op.index??arr.length),arr.length));
      arr.splice(idx,0,op.value); undo.unshift({op:'remove',path:[...path,idx]});
      touched.add(path.concat(idx).join('.'));
    }else if(op.op==='remove'){
      if(Array.isArray(parent)){const old=parent.splice(Number(key),1)[0];undo.unshift({op:'insert',path:path.slice(0,-1),index:Number(key),value:old})}
      else{undo.unshift({op:'set',path,value:parent[key]});delete parent[key]}
    }else throw new Error('Ukendt ændring: '+op.op);
    touched.add(path.join('.'));
  }
  return {undo,touched};
}

  const keys=[];touched.forEach(p=>{const s=p.split('.');if(s[0]==='guide'||s[0]==='profiler'){if(s[1]==='sections'){keys.push([s[0],s[2],s[4]].filter(x=>x!==undefined).join('.'))}}if(s[0]==='tegning'){}});

}

const RULES=`Du redigerer et internt arbejdsdokument for Kvadrant i projektet HimmerLand Fase 0. Dokumentet består af to dele i JSON: "guide" (interviewguide til økonomiafdelingen om Business Central) og "tegning" (en ASIS tegning som SVG, med orange markører der har samme numre som spørgsmålene i guiden; en markør er en circle med fill #f39c12 efterfulgt af en text med nummeret).

Mulige ops:
{"op":"set","path":[nøgler og indeks],"value":ny værdi} sætter en værdi, fx ["guide","sections",3,"items",2,"q"].
{"op":"insert","path":[sti til en liste],"index":n,"value":{...}} indsætter et element i en liste.
{"op":"remove","path":[sti til elementet]} fjerner et element.
{"op":"svg_replace","find":"nøjagtig tekst fra SVG","replace":"ny tekst"} retter tegningen. Kun når SVG koden er med i beskeden. find skal forekomme præcis én gang.
Elementer i items har type "bullet" (label, text), "text" (text) eller "question" (n, q, baggrund).
Ops udføres i rækkefølge, så indeks efter en remove eller insert skal passe til listen, som den ser ud på det tidspunkt. Ret aldrig "log" eller "version".
Guiden handler om, hvordan systemerne hænger sammen i dag, og hvad der mangler. Tilføj ikke spørgsmål om fremtiden eller beløb som 4,5 mio. kr.
Skrivestil: dansk, korte klare sætninger, ingen tankestreger, ingen midterprik, undgå kolon i brødtekst, labels slutter med punktum (fx "Baggrund."). Opfind ikke fakta om HimmerLand. Mangler du viden, så skriv det i reply.
Hvis du omnummererer spørgsmål, så husk at markørerne på tegningen bruger de samme numre, og nævn det i reply, hvis SVG ikke var med.
Er beskeden kun et spørgsmål, så giv "ops": [].`;

  ctl=new AbortController();
  try{
    const res=await sample.json(prompt,{cache:false,signal:ctl.signal,model:'claude-sonnet-5-5',modelTier:'quick',effort:'low'});
    if(!res||typeof res!=='object') throw {code:'invalid_json'};
    const ops=Array.isArray(res.ops)?res.ops:[];
    let r={undo:[],touched:new Set()}; const backup=JSON.stringify(state);
    try{ r=applyOps(ops) }catch(err){ state=JSON.parse(backup); throw {code:'apply',message:err.message} }
    state.log.push({t:new Date().toISOString(),msg,reply:String(res.reply||'Rettet.'),count:ops.length,undo:r.undo});
    if(state.log.length>200) state.log=state.log.slice(-200);
    pending=null; try{sessionStorage.removeItem('draft')}catch(e){}
    if(ops.length) await save(r.touched);
    else{ render(); await save(new Set()) }
  }catch(e){
    const m={cancelled:'Stoppet.',not_granted:'Claude er ikke tilladt for denne side.',sampling_disabled:'Claude er ikke tilgængelig for din konto.',rate_limited:'For mange forespørgsler. Prøv igen om lidt.',invalid_json:'Svaret kunne ikke læses. Prøv at formulere det lidt anderledes.',refused:'Claude afviste beskeden.',apply:'Ændringen kunne ikke udføres: '+(e.message||'')+'. Intet er ændret.',prompt_too_large:'Dokumentet er for stort til én besked.'}[e.code]||'Noget gik galt ('+(e.code||'fejl')+'). Prøv igen.';
    pending={msg,text:m,err:true}; $('input').value=msg; renderMsgs();
    if(e.code==='not_granted'||e.code==='sampling_disabled'){$('send').disabled=true}
    setTimeout(()=>{if(pending&&pending.err){pending=null;renderMsgs()}},6000);
  }finally{
    $('stop').hidden=true; if(sample&&!(pending&&pending.err&&/ikke tilladt|ikke tilgængelig/.test(pending.text)))$('send').disabled=false; ctl=null;
  }
}
async function undoLast(){
  const last=undoTarget(); if(!last) return;
  const backup=JSON.stringify(state);
  try{const r=applyOps(last.undo);last.undo=[];last.undone=true;state.log.push({t:new Date().toISOString(),msg:'Fortryd: '+last.msg,reply:'Rettelsen er fortrudt.',count:r.undo.length,isUndo:true});await save(r.touched)}
  catch(err){state=JSON.parse(backup);$('status').textContent='Kunne ikke fortryde: '+err.message}
}
$('send').onclick=send; $('stop').onclick=()=>ctl?.abort(); $('undo').onclick=undoLast;
$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();send()}});
try{const d=sessionStorage.getItem('draft');if(d&&!$('input').value)$('input').value=d}catch(e){}
baseVersion=__restored?JSON.parse(sessionStorage.getItem('unsaved')).base:state.version;
dirty=__restored;
render();updateSaveUi();
if(__restored)$('status').textContent='Dine ændringer fra før er hentet tilbage. Tryk Gem.';
})();
</script>

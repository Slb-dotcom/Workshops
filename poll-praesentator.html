<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kvadrant Poll Præsentatør v1</title>
<style>
:root{--bg:#F3EFE9;--ink:#3C2C1C;--ink2:#5D4B3D;--tan:#8A6A4C;--line:#E3DBD0;--red:#BF574E;--green:#4F9461;--gold:#E6B840}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,"Segoe UI",sans-serif}
[hidden]{display:none!important}
.bar{display:flex;align-items:center;gap:10px;padding:12px 20px;background:#fff;border-bottom:1px solid var(--line);font-weight:700}
.ver{background:var(--gold);color:var(--ink);font-size:12px;padding:2px 9px;border-radius:99px}
.wrap{max-width:820px;margin:0 auto;padding:26px 18px 60px}
h1{font-size:26px;margin:0 0 4px}
p.lead{margin:0 0 18px;color:var(--ink2)}
label{display:block;font-weight:600;margin:12px 0 5px;font-size:14px}
input[type=text],input[type=password],textarea,select{width:100%;padding:10px 12px;border:1px solid #CFC4B6;border-radius:9px;font:15px system-ui;background:#fff;color:var(--ink)}
textarea{min-height:84px;resize:vertical}
small{color:var(--ink2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.btn{border:0;border-radius:9px;background:var(--tan);color:#fff;font:600 15px system-ui;padding:11px 16px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid #CFC4B6}
.btn.red{background:var(--red)}
.btn:disabled{opacity:.45;cursor:default}
.big{width:100%;margin-top:20px;padding:15px;font-size:17px}
.qc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.qh b{color:var(--tan)}
.qh .sp{flex:1}
.mini{border:1px solid #CFC4B6;background:#fff;border-radius:7px;padding:5px 9px;cursor:pointer;font:600 13px system-ui;color:var(--ink)}
.add{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.msg{margin-top:12px;min-height:20px;font-size:14px}
.msg.err{color:var(--red)}.msg.ok{color:var(--green)}

/* live */
#live{min-height:100vh;display:flex;flex-direction:column}
.ltop{display:flex;align-items:center;gap:16px;padding:12px 24px;background:#fff;border-bottom:1px solid var(--line)}
.ltop .brand{font-weight:800}
.join{flex:1;font-size:15px;color:var(--ink2)}
.join b{color:var(--ink)}
#cnt{font-size:22px;font-weight:800;color:var(--tan);transition:transform .2s}
#cnt.bump{transform:scale(1.25)}
.lmain{flex:1;padding:34px 6vw 20px;max-width:1200px;width:100%;margin:0 auto}
.prog{font-size:14px;font-weight:700;color:var(--tan);letter-spacing:.06em;text-transform:uppercase}
#qtext{font-size:clamp(28px,4.2vw,52px);line-height:1.15;margin:8px 0 28px}
.lctl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:14px;background:#fff;border-top:1px solid var(--line);position:sticky;bottom:0}
.bar2{display:grid;grid-template-columns:minmax(120px,26%) 1fr 110px;gap:16px;align-items:center;margin:14px 0}
.bl{font-size:clamp(18px,2.2vw,28px);font-weight:700}
.bt{height:46px;background:#E8E0D5;border-radius:12px;overflow:hidden}
.bf{height:100%;width:0;border-radius:12px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bn{font-size:clamp(18px,2.2vw,28px);text-align:right}
.bn span{display:block;font-size:14px;color:var(--ink2)}
.lead1 .bl{color:var(--ink)}
.cols{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;align-items:end;height:300px}
.col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.col .cf{width:100%;border-radius:12px 12px 0 0;background:var(--tan);height:0;transition:height .6s cubic-bezier(.2,.8,.2,1);min-height:0}
.col .cn{font-weight:800;font-size:22px;margin-bottom:6px}
.col .cl{font-size:26px;font-weight:800;margin-top:8px}
.avg{display:flex;align-items:baseline;gap:12px;margin-top:20px}
.avg b{font-size:64px;color:var(--tan)}
.endsr{display:flex;justify-content:space-between;color:var(--ink2);margin-top:4px}
.tools{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tools .on{background:var(--ink);color:#fff}
.cloud{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;justify-content:center;padding:10px 0;min-height:220px}
.cloud span{font-weight:800;line-height:1.05;animation:pop .4s ease}
.list{columns:2 280px;column-gap:14px}
.card{break-inside:avoid;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px;font-size:clamp(17px,1.8vw,24px)}
.card.new{animation:pop .5s ease}
.card small{display:block;margin-top:6px;font-size:13px}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.qrm{position:fixed;inset:0;background:rgba(60,44,28,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:50;color:#fff;text-align:center;padding:20px;cursor:pointer}
.qrm .qrbox{background:#fff;padding:22px;border-radius:18px;width:min(70vmin,460px)}
.qrm svg{width:100%;height:auto;display:block}
.qrm .u{font-size:clamp(18px,2.6vw,30px);font-weight:700;word-break:break-all}
@media(max-width:640px){.grid2{grid-template-columns:1fr}.bar2{grid-template-columns:1fr 80px}.bl{grid-column:1/-1}}
</style>
</head>
<body>

<div id="setup">
  <div class="bar">Kvadrant Poll <span class="ver">v1</span></div>
  <div class="wrap">
    <h1>Opsæt din afstemning</h1>
    <p class="lead">Skriv spørgsmålene, start, og vis siden på skærmen. Deltagerne følger med på deres telefon.</p>
    <div class="grid2">
      <div><label for="room">Rumkode</label><input type="text" id="room" placeholder="fx kunde-kickoff" autocomplete="off"><small>Bruges i linket til deltagerne. Små bogstaver, tal og bindestreg.</small></div>
      <div><label for="pw">Kode</label><input type="password" id="pw" autocomplete="off"><small>Samme kode som til facilitatorsider og upload.</small></div>
    </div>
    <div style="margin-top:12px"><button class="btn ghost" id="load">Hent gemte spørgsmål</button></div>
    <div id="qs"></div>
    <div class="add">
      <button class="btn ghost" data-add="yesno">Ja eller nej</button>
      <button class="btn ghost" data-add="choice">Flervalg</button>
      <button class="btn ghost" data-add="scale">Skala 1 til 5</button>
      <button class="btn ghost" data-add="text">Fritekst</button>
    </div>
    <button class="btn big" id="start">Gem og start præsentation</button>
    <div class="msg" id="smsg"></div>
  </div>
</div>

<div id="live" hidden>
  <div class="ltop">
    <div class="brand">Kvadrant Poll</div>
    <div class="join" id="joininfo"></div>
    <button class="btn ghost" id="qrbtn">Vis QR kode</button>
    <div id="cnt">0 svar</div>
  </div>
  <div class="lmain">
    <div class="prog" id="prog"></div>
    <div id="qtext"></div>
    <div id="res"></div>
  </div>
  <div class="lctl">
    <button class="btn ghost" id="prev">Forrige</button>
    <button class="btn" id="next">Næste spørgsmål</button>
    <button class="btn ghost" id="tog">Luk for svar</button>
    <button class="btn ghost" id="clr">Nulstil svar</button>
    <button class="btn ghost" id="edit">Redigér</button>
  </div>
</div>

<div class="qrm" id="qrm" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" async></script>
<script>
const CONFIG = {
  url: 'https://hdffpdighiblwabimelg.supabase.co',
  key: 'sb_publishable_vbwoHt0dhHIFhwSM0d_R-A_LfZC52pS'
};
const H = { 'Content-Type': 'application/json', apikey: CONFIG.key };
const rpc = (fn, b) => fetch(CONFIG.url + '/rest/v1/rpc/' + fn, { method: 'POST', headers: H, body: JSON.stringify(b) })
  .then(async r => { if (!r.ok) { let m = 'HTTP ' + r.status; try { m = (await r.json()).message || m; } catch (e) {} throw new Error(m); } return r.json(); });
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ss = (k, v) => { try { if (v === undefined) return sessionStorage.getItem(k); sessionStorage.setItem(k, v); } catch (e) {} return null; };
const uid = () => 'q' + Math.random().toString(36).slice(2, 8);
const cleanRoom = s => (s || '').toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/^-+|-+$/g, '');
const errTxt = e => /adgangskode/.test(e.message) ? 'Forkert kode' : 'Fejl. ' + e.message;

let Q = [], active = -1, open = true, room = '', pw = '', live = false;
let rows = [], seen = new Set(), view = 'cloud', showNames = true, lastCount = 0;

$('#room').value = ss('kvp_room') || ''; $('#pw').value = ss('kvp_pw') || '';

function smsg(t, c) { $('#smsg').textContent = t || ''; $('#smsg').className = 'msg ' + (c || ''); }

/* ---------- opsætning ---------- */
function mk(kind) {
  if (kind === 'yesno') return { id: uid(), type: 'choice', text: '', multi: false, optionsText: 'Ja\nNej', min: '', max: '' };
  if (kind === 'choice') return { id: uid(), type: 'choice', text: '', multi: false, optionsText: 'Valg 1\nValg 2\nValg 3', min: '', max: '' };
  if (kind === 'scale') return { id: uid(), type: 'scale', text: '', multi: false, optionsText: '', min: 'Slet ikke enig', max: 'Helt enig' };
  return { id: uid(), type: 'text', text: '', multi: false, optionsText: '', min: '', max: '' };
}
const TYPES = { choice: 'Flervalg eller ja og nej', scale: 'Skala 1 til 5', text: 'Fritekst' };

function drawQs() {
  $('#qs').innerHTML = Q.map((q, i) => `<div class="qc" data-i="${i}">
    <div class="qh"><b>Spørgsmål ${i + 1}</b><span class="sp"></span>
      <button class="mini" data-a="up" ${i === 0 ? 'disabled' : ''}>Op</button><button class="mini" data-a="down" ${i === Q.length - 1 ? 'disabled' : ''}>Ned</button><button class="mini" data-a="del">Slet</button></div>
    <label>Spørgsmål</label><input type="text" data-f="text" value="${esc(q.text)}" placeholder="Hvad tænker du, når ...">
    <label>Type</label><select data-f="type">${Object.entries(TYPES).map(([k, v]) => `<option value="${k}" ${q.type === k ? 'selected' : ''}>${v}</option>`).join('')}</select>
    ${q.type === 'choice' ? `<label>Svarmuligheder, en pr. linje</label><textarea data-f="optionsText">${esc(q.optionsText)}</textarea>
      <label style="font-weight:400"><input type="checkbox" data-f="multi" ${q.multi ? 'checked' : ''}> Man må vælge flere</label>` : ''}
    ${q.type === 'scale' ? `<div class="grid2"><div><label>Tekst ved 1</label><input type="text" data-f="min" value="${esc(q.min)}"></div><div><label>Tekst ved 5</label><input type="text" data-f="max" value="${esc(q.max)}"></div></div>` : ''}
  </div>`).join('');
}
$('#qs').addEventListener('input', e => { const c = e.target.closest('.qc'); if (!c || !e.target.dataset.f) return; const q = Q[+c.dataset.i], f = e.target.dataset.f; q[f] = e.target.type === 'checkbox' ? e.target.checked : e.target.value; });
$('#qs').addEventListener('change', e => { if (e.target.dataset.f === 'type') drawQs(); });
$('#qs').addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return; const i = +b.closest('.qc').dataset.i;
  if (b.dataset.a === 'del') Q.splice(i, 1);
  if (b.dataset.a === 'up' && i > 0) [Q[i - 1], Q[i]] = [Q[i], Q[i - 1]];
  if (b.dataset.a === 'down' && i < Q.length - 1) [Q[i + 1], Q[i]] = [Q[i], Q[i + 1]];
  drawQs();
});
document.querySelectorAll('[data-add]').forEach(b => b.onclick = () => { Q.push(mk(b.dataset.add)); drawQs(); });

function creds() { room = cleanRoom($('#room').value); pw = $('#pw').value; $('#room').value = room; ss('kvp_room', room); ss('kvp_pw', pw); return room && pw; }

$('#load').onclick = async () => {
  if (!creds()) return smsg('Skriv rumkode og kode', 'err');
  try {
    const a = await rpc('poll_admin_get', { p_room: room, p_password: pw });
    if (a) { Q = a.questions.map(q => ({ ...q, optionsText: (q.options || []).join('\n'), min: q.min || '', max: q.max || '' })); active = a.active; open = a.open; smsg('Hentede ' + Q.length + ' spørgsmål', 'ok'); }
    else smsg('Rummet findes ikke endnu. Lav spørgsmål herunder.');
    drawQs();
  } catch (e) { smsg(errTxt(e), 'err'); }
};

function normalized() {
  return Q.map(q => ({ id: q.id, type: q.type, text: q.text.trim(), multi: !!q.multi,
    options: q.type === 'choice' ? q.optionsText.split('\n').map(s => s.trim()).filter(Boolean) : [], min: q.min || '', max: q.max || '' }));
}
async function save() { return rpc('poll_set', { p_room: room, p_password: pw, p_questions: normalized(), p_active: active, p_open: open }); }

$('#start').onclick = async () => {
  if (!creds()) return smsg('Skriv rumkode og kode', 'err');
  if (!Q.length) return smsg('Tilføj mindst ét spørgsmål', 'err');
  const n = normalized();
  for (let i = 0; i < n.length; i++) {
    if (!n[i].text) return smsg('Spørgsmål ' + (i + 1) + ' mangler tekst', 'err');
    if (n[i].type === 'choice' && n[i].options.length < 2) return smsg('Spørgsmål ' + (i + 1) + ' skal have mindst to svarmuligheder', 'err');
  }
  Q = n.map(q => ({ ...q, optionsText: q.options.join('\n') }));
  if (active < 0 || active >= Q.length) active = 0;
  open = true;
  try { await save(); } catch (e) { return smsg(errTxt(e), 'err'); }
  smsg(''); enterLive();
};

/* ---------- live ---------- */
const base = () => location.href.split('#')[0].split('?')[0].replace(/[^/]*$/, '');
const link = () => base() + 'poll.html?r=' + room;

function enterLive() {
  live = true; $('#setup').hidden = true; $('#live').hidden = false;
  $('#joininfo').innerHTML = 'Deltag på <b>' + esc(link().replace(/^https?:\/\//, '')) + '</b>';
  showQuestion(); pull();
}
$('#edit').onclick = () => { live = false; $('#live').hidden = true; $('#setup').hidden = false; drawQs(); };

function controls() {
  $('#prev').disabled = active <= 0;
  $('#next').disabled = active >= Q.length;
  $('#next').textContent = active === Q.length - 1 ? 'Afslut' : (active < 0 ? 'Start' : 'Næste spørgsmål');
  $('#tog').textContent = open ? 'Luk for svar' : 'Åbn for svar';
  $('#tog').disabled = active < 0 || active >= Q.length;
  $('#clr').disabled = active < 0 || active >= Q.length;
}

const PAL = ['#8A6A4C', '#4F9461', '#BF574E', '#E6B840', '#5A7FA6', '#9A6FA8', '#6E6A62'];
function colFor(q, i) { const o = q.options[i].toLowerCase(); if (q.options.length === 2 && /^ja/.test(q.options[0].toLowerCase()) && /^nej/.test(q.options[1].toLowerCase())) return i === 0 ? '#4F9461' : '#BF574E'; return PAL[i % PAL.length]; }

function showQuestion() {
  const q = Q[active]; rows = []; seen = new Set(); lastCount = 0; controls();
  const res = $('#res');
  if (!q) { $('#prog').textContent = ''; $('#qtext').textContent = active >= Q.length ? 'Tak for i dag' : 'Klar til at starte'; res.innerHTML = ''; $('#cnt').textContent = ''; return; }
  $('#prog').textContent = 'Spørgsmål ' + (active + 1) + ' af ' + Q.length + (open ? '' : '  Lukket for svar');
  $('#qtext').textContent = q.text;
  if (q.type === 'choice') {
    res.innerHTML = q.options.map((o, i) => `<div class="bar2" data-i="${i}"><div class="bl">${esc(o)}</div><div class="bt"><div class="bf" style="background:${colFor(q, i)}"></div></div><div class="bn"><b>0</b><span>0 %</span></div></div>`).join('');
  } else if (q.type === 'scale') {
    res.innerHTML = '<div class="cols">' + [1, 2, 3, 4, 5].map(n => `<div class="col"><div class="cn">0</div><div class="cf"></div><div class="cl">${n}</div></div>`).join('') +
      `</div><div class="endsr"><span>${esc(q.min)}</span><span>${esc(q.max)}</span></div><div class="avg"><b id="avg">0</b><span>i gennemsnit</span></div>`;
  } else {
    res.innerHTML = `<div class="tools"><button class="mini ${view === 'cloud' ? 'on' : ''}" data-v="cloud">Ordsky</button><button class="mini ${view === 'list' ? 'on' : ''}" data-v="list">Alle svar</button><button class="mini ${showNames ? 'on' : ''}" data-v="names">Vis navne</button></div><div id="txt"></div>`;
    res.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { const v = b.dataset.v; if (v === 'names') showNames = !showNames; else view = v; seen = new Set(); showQuestion2(); });
  }
  updateResults();
}
function showQuestion2() { const keep = rows; showQuestion(); rows = keep; updateResults(); }

const STOP = new Set('og i at det en er til af på for med som den de et har ikke jeg vi du der om man men så kan fra eller også var bliver blive ved hvis mit min dit din vores deres os dem sig hvad hvor når bare lidt mere meget the and'.split(' '));
const WC = ['#8A6A4C', '#4F9461', '#BF574E', '#3C2C1C', '#5A7FA6', '#9A6FA8'];

function updateResults() {
  const q = Q[active]; if (!q) return;
  const n = rows.length;
  const cnt = $('#cnt'); cnt.textContent = n + (n === 1 ? ' svar' : ' svar');
  if (n !== lastCount) { cnt.classList.add('bump'); setTimeout(() => cnt.classList.remove('bump'), 220); lastCount = n; }
  if (q.type === 'choice') {
    const c = q.options.map(() => 0);
    rows.forEach(r => { const v = r.value && r.value.v; (Array.isArray(v) ? v : [v]).forEach(x => { const k = q.options.indexOf(x); if (k >= 0) c[k]++; }); });
    const mx = Math.max(0, ...c);
    document.querySelectorAll('.bar2').forEach(el => { const i = +el.dataset.i, p = n ? Math.round(c[i] / n * 100) : 0;
      el.querySelector('.bf').style.width = p + '%'; el.querySelector('.bn b').textContent = c[i]; el.querySelector('.bn span').textContent = p + ' %';
      el.classList.toggle('lead1', mx > 0 && c[i] === mx); });
  } else if (q.type === 'scale') {
    const c = [0, 0, 0, 0, 0]; let sum = 0;
    rows.forEach(r => { const v = +(r.value && r.value.v); if (v >= 1 && v <= 5) { c[v - 1]++; sum += v; } });
    const mx = Math.max(1, ...c);
    document.querySelectorAll('.col').forEach((el, i) => { el.querySelector('.cf').style.height = (c[i] / mx * 240) + 'px'; el.querySelector('.cn').textContent = c[i]; });
    $('#avg').textContent = n ? (sum / n).toFixed(1).replace('.', ',') : '0';
  } else {
    const t = $('#txt'); if (!t) return;
    if (view === 'list') {
      t.className = 'list';
      t.innerHTML = rows.slice().reverse().map(r => { const id = r.voter + '|' + (r.value && r.value.v); const nw = !seen.has(id); seen.add(id);
        return `<div class="card ${nw ? 'new' : ''}">${esc(r.value && r.value.v)}${showNames && r.name ? `<small>${esc(r.name)}</small>` : ''}</div>`; }).join('');
    } else {
      t.className = 'cloud'; const f = {};
      rows.forEach(r => String(r.value && r.value.v || '').toLowerCase().match(/[\p{L}\p{N}']{2,}/gu)?.forEach(w => { if (!STOP.has(w)) f[w] = (f[w] || 0) + 1; }));
      const e = Object.entries(f).sort((a, b) => b[1] - a[1]).slice(0, 60), m = e.length ? e[0][1] : 1;
      t.innerHTML = e.map(([w, k], i) => `<span style="font-size:${22 + Math.round(60 * k / m)}px;color:${WC[i % WC.length]}">${esc(w)}</span>`).join('') || '<small>Svarene dukker op her.</small>';
    }
  }
}

async function pull() {
  if (!live) return; const q = Q[active]; if (!q) return;
  try { const r = await rpc('poll_results', { p_room: room, p_password: pw, p_qid: q.id });
    if (live && Q[active] && Q[active].id === q.id) { rows = r || []; updateResults(); } } catch (e) {}
}
setInterval(pull, 1500);

async function go(n) {
  const old = active; active = Math.max(0, Math.min(Q.length, n)); open = true;
  try { await save(); } catch (e) { active = old; alert(errTxt(e)); return; }
  showQuestion(); pull();
}
$('#prev').onclick = () => go(active - 1);
$('#next').onclick = () => go(active + 1);
$('#tog').onclick = async () => { open = !open; try { await save(); } catch (e) { open = !open; alert(errTxt(e)); } controls(); const p = $('#prog'); if (Q[active]) p.textContent = 'Spørgsmål ' + (active + 1) + ' af ' + Q.length + (open ? '' : '  Lukket for svar'); };
$('#clr').onclick = async () => { const q = Q[active]; if (!q || !confirm('Slet alle svar til dette spørgsmål?')) return;
  try { await rpc('poll_clear', { p_room: room, p_password: pw, p_qid: q.id }); rows = []; seen = new Set(); updateResults(); } catch (e) { alert(errTxt(e)); } };
document.addEventListener('keydown', e => { if (!live || /INPUT|TEXTAREA|SELECT/.test((e.target.tagName || ''))) return;
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); if (active < Q.length) go(active + 1); }
  if (e.key === 'ArrowLeft') go(active - 1); });

$('#qrbtn').onclick = () => {
  const m = $('#qrm'); let svg = '';
  try { const qr = qrcode(0, 'M'); qr.addData(link()); qr.make(); svg = qr.createSvgTag({ cellSize: 6, margin: 0, scalable: true }); } catch (e) {}
  m.innerHTML = (svg ? '<div class="qrbox">' + svg + '</div>' : '') + '<div class="u">' + esc(link().replace(/^https?:\/\//, '')) + '</div><div>Klik for at lukke</div>';
  m.hidden = false; m.onclick = () => m.hidden = true;
};

  Object.assign(mk('scale'), { text: 'Hvor klar er jeres organisation til forandringen?', min: 'Slet ikke klar', max: 'Helt klar' })
];
drawQs();

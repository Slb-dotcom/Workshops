 \"syn\": \"Navneliste, rooming list.\", \"ikke\": \"Arrangementskøreplan.\"}, \"BG-120\": {\"navn\": \"Takeaway-ordre\", \"omr\": \"Booking og levering\", \"niv\": 3, \"type\": \"Ting eller aftale\", \"def\": \"En bestilling af mad til afhentning.\", \"syn\": \"Takeaway.\", \"ikke\": \"Bordreservation.\"}, \"BG-121\": {\"navn\": \"DGU-nummer\", \"omr\": \"Golf\", \"niv\": 2, \"type\": \"Egenskab\", \"def\": \"Golfspillerens medlemsnummer i Dansk Golf Union, som bruges til at finde spillerens handicap og pris.\", \"syn\": \"DGU.\", \"ikke\": \"Reservationsnummer.\"}, \"BG-122\": {\"navn\": \"Golfkørekort\", \"omr\": \"Golf\", \"niv\": 2, \"type\": \"Egenskab\", \"def\": \"Et bevis på, at golfspilleren må spille på de store baner.\", \"syn\": \"Banetilladelse.\", \"ikke\": \"Handicap.\"}, \"BG-123\": {\"navn\": \"Golfrejse\", \"omr\": \"Golf\", \"niv\": 2, \"type\": \"Ting eller aftale\", \"def\": \"En booking af ophold og golf, der sælges via en agent.\", \"syn\": \"Agentrejse.\", \"ikke\": \"Golfgruppe og Golfophold.\"}, \"BG-124\": {\"navn\": \"Golfgruppe\", \"omr\": \"Golf\", \"niv\": 2, \"type\": \"Part eller rolle\", \"def\": \"En gruppe, der selv henvender sig for at spille golf og evt. bo på resortet, uden en agent som mellemled.\", \"syn\": \"Golfvenner.\", \"ikke\": \"Golfrejse.\"}, \"BG-125\": {\"navn\": \"Turnering\", \"omr\": \"Golf\", \"niv\": 2, \"type\": \"Hændelse\", \"def\": \"Et golfarrangement med fælles program, hvor deltagerne selv tilmelder sig med DGU-nummer.\", \"syn\": \"Company day, ProAm, gunstart.\", \"ikke\": \"Starttid.\"}, \"BG-126\": {\"navn\": \"Bekræftelse af starttid\", \"omr\": \"Golf\", \"niv\": 2, \"type\": \"Hændelse\", \"def\": \"Golfspillerens fremmøde i golfshoppen eller ved automaten før runden, hvor starttiden bekræftes og scorekortet udstedes.\", \"syn\": \"Check-in på starttid, scorekort.\", \"ikke\": \"Bekræftelse (HimmerLands besked).\"}, \"BG-127\": {\"navn\": \"Fribillet\", \"omr\": \"Golf\", \"niv\": 3, \"type\": \"Ting eller aftale\", \"def\": \"En ret til en gratis runde eller ydelse, som tælles ned ved brug.\", \"syn\": \"Voucher.\", \"ikke\": \"Gavekort.\"}, \"BG-128\": {\"navn\": \"Rangekort\", \"omr\": \"Golf\", \"niv\": 3, \"type\": \"Ting eller aftale\", \"def\": \"Adgang til bolde på drivingrangen via automaten.\", \"syn\": \"Boldkort.\", \"ikke\": \"Adgangsmedie.\"}, \"BG-129\": {\"navn\": \"Scorekort\", \"omr\": \"Golf\", \"niv\": 3, \"type\": \"Ting eller aftale\", \"def\": \"Kortet, der udstedes ved bekræftelse af starttid.\", \"syn\": \"Scorekort.\", \"ikke\": \"\"}, \"BG-130\": {\"navn\": \"Arrangement\", \"omr\": \"Arrangement\", \"niv\": 1, \"type\": \"Ting eller aftale\", \"def\": \"Et planlagt forløb for en gruppe med program, fx et møde, en konference, en fest, en turnering eller et medlemsarrangement.\", \"syn\": \"Konference, møde, event, selskab, fest.\", \"ikke\": \"Booking (købet) og Pakke (produktet).\"}, \"BG-131\": {\"navn\": \"Arrangementstype\", \"omr\": \"Arrangement\", \"niv\": 2, \"type\": \"Egenskab\", \"def\": \"En inddeling af arrangementer efter formål, fx møde og konference, firmafest, privatfest, golfarrangement og medlemsarrangement.\", \"syn\": \"Arrangementsform.\", \"ikke\": \"Pakke.\"}, \"BG-132\": {\"navn\": \"Privatfest\", \"omr\": \"Arrangement\", \"niv\": 2, \"type\": \"Ting eller aftale\", \"def\": \"Et privat arrangement, fx bryllup, fødselsdag eller konfirmation.\", \"syn\": \"Selskab, fest, bryllup.\", \"ikke\": \"Firmafest.\"}, \"BG-133\": {\"navn\": \"Arrangementskøreplan\", \"omr\": \"Arrangement\", \"niv\": 2, \"type\": \"Ting eller aftale\", \"def\": \"Det samlede program for et arrangement med tider, lokaler, forplejning, aktiviteter og særlige aftaler.\", \"syn\": \"Køreplan, program.\", \"ikke\": \"Deltagerliste.\"}, \"BG-134\": {\"navn\": \"Overdragelse til drift\", \"omr\": \"Arrangement\", \"niv\": 2, \"type\": \"Hændelse\", \"def\": \"Det tidspunkt, hvor ansvaret for et arrangement går fra salg til driften.\", \"syn\": \"'Huset tager over'.\", \"ikke\": \"Koordineringsmøde.\"}, \"BG-135\": {\"navn\": \"Koordineringsmøde\", \"omr\": \"Arrangement\", \"niv\": 3, \"type\": \"Hændelse\", \"def\": \"Det ugentlige møde, hvor salg overdrager den kommende uges arrangementer til driften.\", \"syn\": \"Torsdagsmødet.\", \"ikke\": \"Overdragelse til drift.\"}, \"BG-136\": {\"navn\": \"Bordopstilling\", \"omr\": \"Arrangement\", \"niv\": 3, \"type\": \"Ting eller aftale\", \"def\": \"Den fysiske opstilling af borde, scene og udsmykning til et arrangement.\", \"syn\": \"Opstilling.\", \"ikke\": \"Seating.\"}, \"BG-137\": {\"navn\": \"Regning\", \"omr\": \"Afregning og betaling\", \"niv\": 1, \"type\": \"Ting eller aftale\", \"def\": \"En løbende opgørelse, hvor køb og bookinglinjer samles og afsluttes med betaling eller faktura.\", \"syn\": \"Konto (i systemerne), folio.\", \"ikke\": \"Faktura (kravet om betaling).\"}, \"BG-138\": {\"navn\": \"Hovedregning\", \"omr\": \"Afregning og betaling\", \"niv\": 2, \"type\": \"Ting eller aftale\", \"def\": \"Firmaets eller gruppens samlede regning for et arrangement.\", \"syn\": \"Konferenceregning, fællesregning.\", \"ikke\": \"Værelsesregning.\"}, \"BG-139\": {\"navn\": \"Værelsesregning\", \"omr\": \"Afregning og betaling\", \"niv\": 2, \"type\": \"Ting eller aftale\", \"def\": \"Gæstens egen regning knyttet til opholdet.\", \"syn\": \"Regning på værelset.\", \"ikke\": \"Hovedregning.\"}, \"BG-140\": {\"navn\": \"Betalingsansvar\", \"omr\": \"Afregning og betaling\", \"niv\": 1, \"type\": \"Egenskab\", \"def\": \"Fordelingen af, hvem der betaler hvilke ydelser, fx at firmaet betaler maden og gæsten selv drikkevarerne.\", \"syn\": \"Fællesregning, egen regning, drikkevarer for egen regning.\", \"ikke\": \"Inkluderet ydelse.\"}, \"BG-141\": {\"navn\": \"Køb\", \"omr\": \"Afregning og betaling\", \"niv\": 1, \"type\": \"Hændelse\", \"def\": \"Et registreret salg på et salgssted, som betales med det samme eller lægges på en regning.\", \"syn\": \"Salgstransaktion, bon, bonning.\", \"ikke\": \"Bookinglinje (det, der er booket på forhånd).\"}, \"BG-142\": {\"navn\": \"Overførsel til værelset\", \"omr\": \"Afregning og betaling\", \"niv\": 2, \"type\": \"Hændelse\", \"def\": \"Et køb på et salgssted, der lægges på gæstens værelsesregning i stedet for at blive betalt der.\", \"syn\": \"'På værelset', overføre.\", \"ikke\": \"Viderefakturering.\"}, \"BG-143\": {\"navn\": \"Kvittering\", \"omr\": \"Afregning og betaling\", \"niv\": 2, \"type\": \"Ting eller aftale\", \"def\": \"Den specificerede kvittering for et køb, som gæsten underskriver, når købet lægges på værelset.\", \"syn\": \"Bon, værelseskvittering, restaurantbilag.\", \"ikke\": \"Faktura.\"}, \"BG-144\": {\"navn\": \"Faktura\", \"omr\": \"Afregning og betaling\", \"niv\": 1, \"type\": \"Ting eller aftale\", \"def\": \"Et krav om betaling til en kunde for en eller flere regninger.\", \"syn\": \"Regning (frarådes).\", \"ikke\": \"Regning (opgørelsen) og Tilbud.\"}, \"BG-145\": {\"navn\": \"Betaling\", \"omr\": \"Afregning og betaling\", \"niv\": 1, \"type\": \"Hændelse\", \"def\": \"En indbetaling, der udligner en regning eller faktura, fx med kort, overførsel, MobilePay eller gavekort.\", \"syn\": \"Indbetaling.\", \"ikke\": \"Faktura.\"}, \"BG-146\": {\"navn\": \"Forudbetaling\", \"omr\": \"Afregning og betaling\", \"niv\": 2, \"type\": \"Hændelse\", \"def\": \"En betaling før ankomst, fx et depositum eller en rate efter en betalingsplan.\", \"syn\": \"Depositum, rate.\", \"ikke\": \"Betalingslink.\"}, \"BG-147\": {\"navn\": \"Betalingsservice\", \"omr\": \"Afregning og betaling\", \"niv\": 2, \"type\": \"Ting eller aftale\", \"def\": \"Automatisk månedlig opkrævning af kontingent og køb for medlemmer og husejere.\", \"syn\": \"PBS, opkrævning.\", \"ikke\": \"Faktura.\"}, \"BG-148\": {\"navn\": \"Kreditering\", \"omr\": \"Afregning og betaling\", \"niv\": 2, \"type\": \"Hændelse\", \"def\": \"En hel eller delvis tilbageførsel af et beløb på en regning eller faktura.\", \"syn\": \"Modpostering, kreditnota.\", \"ikke\": \"Rabat.\"}, \"BG-149\": {\"navn\": \"Intern afregning\", \"omr\": \"Afregning og betaling\", \"niv\": 2, \"type\": \"Hændelse\", \"def\": \"Afregning mellem HimmerLands egne afdelinger, fx når et Business Club-arrangement fordeler omsætning på golf og restaurant.\", \"syn\": \"Intern faktura, intern omsætning.\", \"ikke\": \"Faktura til kunde.\"}, \"BG-150\": {\"navn\": \"Viderefakturering\", \"omr\": \"Afregning og betaling\", \"niv\": 3, \"type\": \"Hændelse\", \"def\": \"Manuel overførsel af et køb fra én kasse til en regning i et andet system.\", \"syn\": \"Videre fakturering.\", \"ikke\": \"Overførsel til værelset.\"}, \"BG-151\": {\"navn\": \"Betalingslink\", \"omr\": \"Afregning og betaling\", \"niv\": 3, \"type\": \"Ting eller aftale\", \"def\": \"Et link, gæsten får tilsendt for at betale en telefon- eller mailbooking.\", \"syn\": \"Betalingslink.\", \"ikke\": \"Faktura.\"}, \"BG-152\": {\"navn\": \"Kasseafstemning\", \"omr\": \"Afregning og betaling\", \"niv\": 3, \"type\": \"Hændelse\", \"def\": \"Den daglige afstemning og afslutning af et salgssteds kasse.\", \"syn\": \"Lukke kassen, kasserapport.\", \"ikke\": \"Kontering.\"}, \"BG-153\": {\"navn\": \"Adgang\", \"omr\": \"Adgang og drift\", \"niv\": 2, \"type\": \"Ting eller aftale\", \"def\": \"Gæstens ret til at komme ind på et værelse, en bane eller en facilitet i et tidsrum.\", \"syn\": \"Adgangstildeling.\", \"ikke\": \"Brugerkonto (login).\"}, \"BG-154\": {\"navn\": \"Adgangsmedie\", \"omr\": \"Adgang og drift\", \"niv\": 2, \"type\": \"Ting eller aftale\", \"def\": \"Det, gæsten bruger til at åbne en dør eller starte en facilitet, fx nøglekort, QR-kode eller 6-cifret kode.\", \"syn\": \"Nøglekort, værelseskort, kode.\", \"ikke\": \"Medlemskort.\"}, \"BG-155\": {\"navn\": \"Værelsesstatus\", \"omr\": \"Adgang og drift\", \"niv\": 2, \"type\": \"Egenskab\", \"def\": \"Et værelses tilstand i dag, fx ledigt, optaget eller klar til rengøring.\", \"syn\": \"Rengøringsstatus.\", \"ikke\": \"Bookingstatus.\"}, \"BG-156\": {\"navn\": \"Vagt\", \"omr\": \"Adgang og drift\", \"niv\": 2, \"type\": \"Ting eller aftale\", \"def\": \"En medarbejders planlagte arbejdstid på en dag, evt. med rolle og position.\", \"syn\": \"Vagtplan, fordeling.\", \"ikke\": \"Bemandingsbehov.\"}, \"BG-157\": {\"navn\": \"Bemandingsbehov\", \"omr\": \"Adgang og drift\", \"niv\": 2, \"type\": \"Egenskab\", \"def\": \"Det antal medarbejdere, der er brug for pr. afdeling og dag ud fra bookinger og belægning.\", \"syn\": \"Bemanding.\", \"ikke\": \"Vagt.\"}, \"BG-158\": {\"navn\": \"Fejlmelding\", \"omr\": \"Adgang og drift\", \"niv\": 3, \"type\": \"Hændelse\", \"def\": \"En besked om noget, der skal repareres på et værelse eller en facilitet.\", \"syn\": \"Teknikopgave.\", \"ikke\": \"Afvigelse.\"}, \"BG-159\": {\"navn\": \"Glemt genstand\", \"omr\": \"Adgang og drift\", \"niv\": 3, \"type\": \"Ting eller aftale\", \"def\": \"En ting, en gæst har efterladt på resortet.\", \"syn\": \"Glemt gods.\", \"ikke\": \"\"}, \"BG-160\": {\"navn\": \"Gæsteprofil\", \"omr\": \"Gæsteindsigt og opfølgning\", \"niv\": 1, \"type\": \"Ting eller aftale\", \"def\": \"Det samlede billede af en gæst på tværs af resortet: stamdata, samtykker, ønsker, bookinger og køb.\", \"syn\": \"Kundeprofil, golden record.\", \"ikke\": \"Brugerkonto (login).\"}, \"BG-161\": {\"navn\": \"Forbrug pr. gæst\", \"omr\": \"Gæsteindsigt og opfølgning\", \"niv\": 2, \"type\": \"Egenskab\", \"def\": \"Gæstens samlede køb på tværs af ophold, restauranter, aktiviteter og golf.\", \"syn\": \"Omsætning pr. gæst.\", \"ikke\": \"Belægning.\"}, \"BG-162\": {\"navn\": \"Feedback\", \"omr\": \"Gæsteindsigt og opfølgning\", \"niv\": 2, \"type\": \"Hændelse\", \"def\": \"En gæsts, gruppes eller agents tilbagemelding efter besøget.\", \"syn\": \"Gæstefeedback, tak for sidst.\", \"ikke\": \"Afvigelse.\"}, \"BG-163\": {\"navn\": \"Anmeldelse\", \"omr\": \"Gæsteindsigt og opfølgning\", \"niv\": 3, \"type\": \"Hændelse\", \"def\": \"En offentlig vurdering på en ekstern portal, fx TripAdvisor eller Trustpilot.\", \"syn\": \"Review.\", \"ikke\": \"Feedback.\"}, \"BG-164\": {\"navn\": \"Brugerkonto\", \"omr\": \"Gæsteindsigt og opfølgning\", \"niv\": 2, \"type\": \"Ting eller aftale\", \"def\": \"Gæstens login til selvbetjening, fx til at se og ændre sin booking.\", \"syn\": \"Login, profil, bruger.\", \"ikke\": \"Gæsteprofil.\"}, \"BG-165\": {\"navn\": \"Afvigelse\", \"omr\": \"Gæsteindsigt og opfølgning\", \"niv\": 3, \"type\": \"Hændelse\", \"def\": \"En fejl i leverancen til gæsten, fx en forkert faktura eller en gruppe, der ikke dukker op.\", \"syn\": \"Hændelse, fejl, reklamation.\", \"ikke\": \"Feedback.\"}, \"BG-166\": {\"navn\": \"Anonymisering\", \"omr\": \"Gæsteindsigt og opfølgning\", \"niv\": 3, \"type\": \"Hændelse\", \"def\": \"Fjernelse af persondata, så gæsten ikke længere kan genkendes.\", \"syn\": \"'Krydse' gæsten.\", \"ikke\": \"Sletning.\"}}, \"omr\": [{\"navn\": \"Gæster, kunder og roller\", \"fyld\": \"#DAE8FC\", \"kant\": \"#6C8EBF\", \"ids\": [\"BG-001\", \"BG-009\", \"BG-010\", \"BG-013\", \"BG-002\", \"BG-016\", \"BG-005\", \"BG-003\", \"BG-008\", \"BG-007\"]}, {\"navn\": \"Salg, dialog og aftaler\", \"fyld\": \"#E1D5E7\", \"kant\": \"#9673A6\", \"ids\": [\"BG-033\", \"BG-030\", \"BG-031\", \"BG-035\", \"BG-042\"]}, {\"navn\": \"Medlemskab og fordele\", \"fyld\": \"#FFE6CC\", \"kant\": \"#D79B00\", \"ids\": [\"BG-049\", \"BG-052\"]}, {\"navn\": \"Produkt, pakke og pris\", \"fyld\": \"#D5E8D4\", \"kant\": \"#82B366\", \"ids\": [\"BG-058\", \"BG-060\", \"BG-063\", \"BG-067\", \"BG-066\", \"BG-074\", \"BG-073\"]}, {\"navn\": \"Ressource og kapacitet\", \"fyld\": \"#F8CECC\", \"kant\": \"#B85450\", \"ids\": [\"BG-081\", \"BG-093\", \"BG-092\"]}, {\"navn\": \"Booking og levering\", \"fyld\": \"#FFF2CC\", \"kant\": \"#C9A227\", \"ids\": [\"BG-104\", \"BG-107\", \"BG-109\", \"BG-110\", \"BG-114\", \"BG-101\", \"BG-100\"]}, {\"navn\": \"Arrangement\", \"fyld\": \"#FCE4EC\", \"kant\": \"#C2185B\", \"ids\": [\"BG-130\"]}, {\"navn\": \"Afregning og betaling\", \"fyld\": \"#EDE7F6\", \"kant\": \"#5E35B1\", \"ids\": [\"BG-137\", \"BG-141\", \"BG-145\", \"BG-140\", \"BG-144\"]}, {\"navn\": \"Gæsteindsigt og opfølgning\", \"fyld\": \"#ECEFF1\", \"kant\": \"#607D8B\", \"ids\": [\"BG-160\"]}], \"rejser\": [{\"k\": \"K02\", \"navn\": \"Familieferie\", \"saer\": \"Ferieprogram med op til 200 aktiviteter, som gæsterne ikke kan finde ud af at booke. Der står en fysisk aktivitetsstand.\", \"v\": [\"BG-009\", \"BG-067\", \"BG-066\", \"BG-060\", \"BG-101\"], \"g\": [\"BG-068\", \"BG-069\", \"BG-079\", \"BG-080\"]}, {\"k\": \"K04\", \"navn\": \"Kursus og træning\", \"saer\": \"Padel og golfskole med faste pladser, eksterne instruktører og et program, der sendes ud.\", \"v\": [\"BG-067\", \"BG-007\", \"BG-008\", \"BG-093\", \"BG-101\"], \"g\": [\"BG-089\", \"BG-068\", \"BG-119\", \"BG-094\"]}, {\"k\": \"K06\", \"navn\": \"Lokal dagsgæst\", \"saer\": \"Kommer uden ophold. Husejere, medlemmer og lokale bruger restaurant, spa, padel, fitness og svømmehal.\", \"v\": [\"BG-010\", \"BG-052\", \"BG-049\", \"BG-067\", \"BG-100\"], \"g\": [\"BG-019\", \"BG-153\", \"BG-154\", \"BG-070\", \"BG-053\"]}, {\"k\": \"K07\", \"navn\": \"Restaurant og takeaway\", \"saer\": \"Fire indgange til et bord, walk ins, seating i tidsrum og takeaway i et andet system.\", \"v\": [\"BG-107\", \"BG-109\", \"BG-110\", \"BG-114\", \"BG-141\"], \"g\": [\"BG-012\", \"BG-086\", \"BG-011\", \"BG-111\", \"BG-120\"]}, {\"k\": \"K09\", \"navn\": \"Privat fest\", \"saer\": \"Bryllup og konfirmation med flere møder, menu, opdækning og køreplan. Værten betaler, gæsterne deltager.\", \"v\": [\"BG-130\", \"BG-003\", \"BG-005\", \"BG-007\", \"BG-140\"], \"g\": [\"BG-132\", \"BG-133\", \"BG-134\", \"BG-136\"]}, {\"k\": \"K10\", \"navn\": \"Gavekort\", \"saer\": \"Flere udbydere (LifePeaks, Truestory, FlexPos), kun ét pr. booking, 4,5 til 5 mio. kr. udestående og udløb.\", \"v\": [\"BG-058\", \"BG-141\", \"BG-145\", \"BG-144\"], \"g\": [\"BG-078\", \"BG-146\", \"BG-148\"]}], \"hjaelp\": {\"eks\": {\"Gæst\": \"Hr. og fru Jensen er to gæster, også når de bor på samme værelse. Kommer fru Jensen igen til spa næste år, er det den samme gæst.\", \"Organisation\": \"Et firma, der holder konference, er en organisation. Det er firmaet, der får fakturaen.\", \"Kunde\": \"Booker en privatperson en getaway, er personen både kunde og gæst. Booker et firma et møde, er firmaet kunde, og medarbejderne er gæster.\", \"Kontaktperson\": \"Den medarbejder i firmaet, som salg taler med før mødet og sender tilbuddet til, er kontaktperson.\", \"Deltager\": \"En person på deltagerlisten til en konference er deltager, også selv om vi kun kender navnet.\", \"Gruppe\": \"En golfgruppe på 12 personer, der rejser sammen på én booking, er en gruppe.\", \"Opholdsgæst\": \"En gæst, der overnatter på hotellet eller i et feriehus, er opholdsgæst og kan lægge køb på værelset.\", \"Dagsgæst\": \"En lokal, der kommer for at spille padel eller spise i restauranten uden at overnatte, er dagsgæst.\", \"Golfspiller\": \"En gæst med DGU-nummer, hjemmeklub og handicap, der skal have en starttid, er golfspiller.\", \"Agent\": \"Et golfrejsebureau i England, der sælger HimmerLands golfophold videre til egne kunder, er agent.\", \"Forespørgsel\": \"Et firma skriver via formularen, at de vil holde konference for 40 personer i marts. Det er en forespørgsel.\", \"Tilbud\": \"Den pris og det program, salg sender i GetAccept til firmaet, er et tilbud. Når firmaet accepterer, bliver det en booking.\", \"Salgskanal\": \"Om bookingen kommer via hjemmesiden, en OTA, en agent, telefon eller receptionen, er salgskanalen.\", \"Aftale\": \"En virksomhedsaftale med faste priser og rabatter for et år er en aftale.\", \"Opfølgning\": \"Mailen seks uger før en konference og opkaldet bagefter for at sige tak for sidst er opfølgninger.\", \"Medlemskab\": \"Et firmas medlemskab af Business Club for et år er et medlemskab.\", \"Medlem\": \"Hver person i firmaet, der har sit eget Business Club kort, er medlem.\", \"Produkt\": \"En overnatning, en massage, en greenfee eller en flaske vin er hver et produkt.\", \"Pakke\": \"En getaway med overnatning, spa og middag til én samlet pris er en pakke.\", \"Getaway\": \"En spa getaway for to med overnatning er en getaway.\", \"Tilkøb\": \"Bobler på værelset eller en golfbil, som gæsten køber oven i sin booking, er tilkøb.\", \"Aktivitet\": \"Padel, bowling, minigolf og quiz er aktiviteter.\", \"Inkluderet ydelse\": \"Spaen, der er betalt i getawayen, er en inkluderet ydelse. Gæsten skal ikke betale igen i spaen.\", \"Pris\": \"At en spatid koster mere en lørdag end en tirsdag, er to forskellige priser.\", \"Ressource\": \"Et værelse, et mødelokale, et bord, en golfbane og en golfbil er ressourcer. Man låner dem i tid.\", \"Lokation\": \"Hotellet, Hul 19, spaen og golfshoppen er hver en lokation.\", \"Kapacitet\": \"At spaen kan tage 8 personer pr. halve time, er spaens kapacitet.\", \"Booking\": \"Hr. og fru Jensens getaway med værelse, spatid og bord er én booking.\", \"Bookinglinje\": \"I Jensens booking er værelset, spatiden og bordet hver en bookinglinje.\", \"Ophold\": \"To nætter på et værelse fra fredag til søndag er et ophold.\", \"Bordreservation\": \"Et bord til fire personer kl. 19 i restauranten er en bordreservation.\", \"Starttid\": \"En tid på golfbanen kl. 9.10 for fire spillere er en starttid.\", \"Særligt ønske\": \"En glutenallergi eller et flag på bordet til en fødselsdag er et særligt ønske.\", \"Bekræftelse\": \"Den mail, gæsten får med alt det, der er booket, er en bekræftelse.\", \"Arrangement\": \"En konference med program for 40 personer eller et bryllup er et arrangement.\", \"Regning\": \"Firmaets regning for møde og mad og gæstens egen regning for drikkevarer er to regninger på samme booking.\", \"Betalingsansvar\": \"At firmaet betaler maden, og gæsten selv betaler drikkevarerne, er betalingsansvaret.\", \"Køb\": \"En øl i Hul 19, der bonges på kassen, er et køb.\", \"Faktura\": \"Den faktura, firmaet får efter konferencen, er en faktura.\", \"Betaling\": \"Når gæsten betaler med kort eller MobilePay, er det en betaling.\", \"Gæsteprofil\": \"Alt det, vi ved om fru Jensen på tværs af ophold, spa, restaurant og golf, er hendes gæsteprofil. Den findes ikke i dag.\"}, \"historier\": {\"K02\": \"En familie bor på hotellet i skoleferien som opholdsgæster, ofte på en pakke. Under opholdet vil de være med i ferieprogrammet, hvor der er op til 200 aktiviteter. I dag kan gæsterne ikke finde ud af at booke dem, så de går hen til den fysiske aktivitetsstand. Hver aktivitet, familien vælger, er et tilkøb og en bookinglinje på familiens booking.\", \"K04\": \"Gæsterne melder sig til padel eller golfskole. Hver skole har faste pladser, så kapaciteten er begrænset, og hver deltager kommer på en liste. Undervisningen gives af eksterne instruktører, og programmet sendes ud på forhånd. En gruppe kan melde sig til sammen, og hver plads er en bookinglinje.\", \"K06\": \"En husejer, et medlem eller en lokal gæst kommer uden ophold, altså som dagsgæst. De bruger restaurant, spa, padel, fitness og svømmehal. Medlemmer har et medlemskab, der giver fordele, og hver aktivitet, de bestiller, er en booking.\", \"K07\": \"En gæst vil spise i restauranten. Bordet kan bestilles ad fire forskellige indgange, eller gæsten kommer som walk-in uden bordreservation. Bordene sælges i tidsrum, så hver bordreservation har en starttid. Et særligt ønske som allergi skal følge med, gæsten får en bekræftelse, og takeaway registreres som køb i et andet system.\", \"K09\": \"Et brudepar eller en familie planlægger en fest. Der holdes flere møder om menu, opdækning og køreplan for arrangementet. Værten er kunde og kontaktperson og har betalingsansvaret, mens gæsterne er deltagere.\", \"K10\": \"En gæst køber et gavekort. Gavekort sælges i dag hos flere udbydere (LifePeaks, Truestory, FlexPos), og der kan kun bruges ét gavekort pr. booking. Når gavekortet bruges, er det en betaling. Der er 4,5 til 5 mio. kr. udestående, og gavekort kan udløbe.\"}, \"ejere\": [\"Palle\", \"Anette\", \"René\", \"Line\", \"Emma\", \"Tinna\", \"Martin\"]}}\u003c/script>\n\u003cscript type=\"application/json\" id=\"hl-state\">{}\u003c/script>\n\u003cscript>\n(function(){\n\"use strict\";\nconst TEMPLATE = \"\u003c!DOCTYPE html>\\n\" + document.documentElement.outerHTML;\nconst DATA = JSON.parse(document.getElementById(\"hl-data\").textContent);\nlet STATE = {};\ntry { STATE = JSON.parse(document.getElementById(\"hl-state\").textContent) || {}; } catch(e) { STATE = {}; }\nconst LSKEY = \"hl-ws2-samlet-o12-v6\";\ntry {\n  const ls = JSON.parse(localStorage.getItem(LSKEY) || \"null\");\n  if (ls && (ls.saved || 0) > (STATE.saved || 0)) STATE = ls;\n} catch(e) {}\nSTATE.p = STATE.p || {}; STATE.ny = STATE.ny || []; STATE.krav = STATE.krav || {};\nSTATE.navn = STATE.navn || \"\"; STATE.tab = STATE.tab || 1; STATE.rejse = STATE.rejse || DATA[0].rejse; STATE.fase = STATE.fase || null;\n\nconst REJSER = [...new Set(DATA.map(d => d.rejse))];\nconst FASER = [...new Set(DATA.map(d => d.fase))].sort();\nconst BYID = Object.fromEntries(DATA.map(d => [d.id, d]));\nconst FIELDS = [[\"titel\",\"Pain\"],[\"hvad\",\"Hvad sker der\"],[\"hvorfor\",\"Hvorfor er det et problem\"],[\"hvem\",\"Hvem mærker det\"]];\nconst PRI = [\"MUST\",\"SHOULD\",\"COULD\"];\n\nconst $ = (s, el=document) => el.querySelector(s);\nfunction h(tag, attrs, ...kids){\n  const el = document.createElement(tag);\n  for (const k in (attrs||{})) {\n    const v = attrs[k];\n    if (v == null || v === false) continue;\n    if (k.startsWith(\"on\")) el.addEventListener(k.slice(2), v);\n    else if (k === \"text\") el.textContent = v;\n    else el.setAttribute(k, v === true ? \"\" : v);\n  }\n  for (const c of kids.flat()) if (c != null) el.append(c.nodeType ? c : document.createTextNode(c));\n  return el;\n}\n\ncon son,application/json\" hidden>\n\u003c/div>\n\u003cdiv class=\"toast\" id=\"toast\">\u003c/div>\n\n\u003cscript>\n/* Data genereres fra begrebslisten i Excel med generer_begrebsdata.py.\n   Alt mellem de to markører udskiftes, når scriptet køres. */\n/*BEGREBSDATA-START*/\nconst BEGREBSDATA = {\n \"meta\": {\n  \"titel\": \"Begrebsmodel HimmerLand\",\n  \"kilde\": \"HimmerLand_Begrebsliste_V5.xlsx\",\n  \"genereret\": \"09-10-2026 14:30\"\n },\n \"begreber\": [\n  {\n   \"id\": \"BG-001\",\n   \"omraade\": \"Gæster, kunder og roller\",\n   \"navn\": \"Gæst\",\n   \"type\": \"Part eller rolle\",\n   \"vaesentlighed\": \"Væsentlig\",\n   \"definition\": \"En person, der bruger, booker eller betaler for HimmerLands ydelser, uanset om personen overnatter, kommer for en dag eller deltager i et arrangement.\",\n   \"uddybning\": \"Gæsten er personen, ikke besøget, og typisk én person, selv om en booking kan omfatte en familie. Samme gæst skal kunne genkendes på tværs af ophold, restaurant, aktiviteter og golf. Opholdsgæst, dagsgæst, golfspiller m.fl. er roller, gæsten har i en bestemt booking, ikke faste typer. Når en virksomhed booker, er virksomheden kunde, og de medarbejdere, der deltager, er gæster.\",\n   \"synonymer\": \"Opholdsgæst, dagsgæst, restaurantgæst; 'hr. og fru Jensen'. 'Bruger' frarådes (bruges om login).\",\n   \"ikkeForveksle\": \"Kunde (den der hæfter), Deltager (kan være et navn uden kendt person), Brugerkonto (login).\",\n   \"begrundelse\": \"Kernebegreb for alle gæster, uanset om de overnatter, spiser, spiller golf eller deltager i et arrangement.\",\n   \"v4id\": \"\",\n   \"kilder\": \"\",\n   \"aendring\": \"\",\n   \"vurdering\": \"\",\n   \"kommentar\": \"\"\n  },\n  {\n   \"id\": \"BG-002\",\n   \"omraade\": \"Gæster, kunder og roller\",\n   \"navn\": \"Organisation\",\n   \"type\": \"Part eller rolle\",\n   \"vaesentlighed\": \"Væsentlig\",\n   \"definition\": \"En virksomhed, forening, institution eller anden juridisk enhed, der køber hos HimmerLand eller formidler salg på vegne af andre.\",\n   \"uddybning\": \"Typisk den, der får fakturaen. Omfatter erhvervskunder, agenter, golfklubber og offentlige institutioner (som kræver EAN-nummer). Firmaet er kunde, medarbejderne er gæster.\",\n   \"synonymer\": \"Virksomhed, firma, erhvervskunde, B2B-kunde, selskab. Salg og IT siger ofte 'kunder' om virksomheder.\",\n   \"ikkeForveksle\": \"Kontaktperson (personen i virksomheden).\",\n   \"begrundelse\": \"Bærer alt salg til virksomheder, møder og konferencer.\",\n   \"v4id\": \"\",\n   \"kilder\": \"\",\n   \"aendring\": \"\",\n   \"vurdering\": \"\",\n   \"kommentar\": \"\"\n  },\n  {\n   \"id\": \"BG-003\",\n   \"omraade\": \"Gæster, kunder og roller\",\n   \"navn\": \"Kunde\",\n   \"type\": \"Part eller rolle\",\n   \"vaesentlighed\": \"Væsentlig\",\n   \"definition\": \"Den gæst eller organisation, der køber en booking eller et tilbud og hæfter for betalingen.\",\n   \"uddybning\": \"Kunde er en rolle i en konkret handel, ikke en gruppe af personer. Booker en privatperson, er personen både kunde og gæst. Booker en virksomhed, er virksomheden kunde, og de medarbejdere, der deltager, er gæster. I daglig tale siger salg og IT ofte 'kunder' om virksomheder og 'gæster' om private; brug Organisation eller erhvervskunde, når det er virksomheden, der menes.\",\n   \"synonymer\": \"Debitor (økonomi), bestiller, aftalepart.\",\n   \"ikkeForveksle\": \"Gæst (den der bruger ydelsen) og Organisation (en kunde kan også være en privatperson).\",\n   \"begrundelse\": \"Skiller den, der betaler, fra den, der bruger. Nødvendigt for faktura, hovedregning og fællesregning.\",\n   \"v4id\": \"\",\n   \"kilder\": \"\",\n   \"aendring\": \"\",\n   \"vurdering\": \"\",\n   \"kommentar\": \"\"\n  },\n  {\n   \"id\": \"BG-004\",\n   \"omraade\": \"Gæster, kunder og roller\",\n   \"navn\": \"Part\",\n   \"type\": \"Part eller rolle\",\n   \"vaesentlighed\": \"Mindre væsentlig\",\n   \"definition\": \"En person eller organisation, som HimmerLand har en relation til.\",\n   \"uddybning\": \"Fælles overbegreb for Gæst og Organisation, så begge kan være kunde. Bruges i modellen, ikke i daglig tale.\",\n   \"synonymer\": \"Bruges kun i modellen.\",\n   \"ikkeForveksle\": \"Kunde.\",\n   \"begrundelse\": \"Hjælper modellen, men bruges ikke i daglig tale. Kan udelades af diagrammet.\",\n   \"v4id\": \"\",\n   \"kilder\": \"\",\n   \"aendring\": \"\",\n   \"vurdering\": \"\",\n   \"kommentar\": \"\"\n  },\n  {\n   \"id\": \"BG-005\",\n   \"omraade\": \"Gæster, kunder og roller\",\n   \"navn\": \"Kontaktperson\",\n   \"type\": \"Part eller rolle\",\n   \"vaesentlighed\": \"Væsentlig\",\n   \"definition\": \"En gæst, der repræsenterer en organisation over for HimmerLand, fx som bestiller, fakturamodtager eller mødeleder.\",\n   \"uddybning\": \"Den, salg taler med før arrangementet og kontakter 8 eller 6 uger før. Modtager tilbuddet i GetAccept. På dagen er det ofte en anden person, mødelederen, der er HimmerLands modpart.\",\n   \"synonymer\": \"Arrangør, bestiller, tovholder, golfgruppens kaptajn.\",\n   \"ikkeForveksle\": \"Deltager (er med, men repræsenterer ikke organisationen).\",\n   \"begrundelse\": \"Al dialog med virksomheder og grupper går gennem kontaktpersonen.\",\n   \"v4id\": \"\",\n   \"kilder\": \"\",\n   \"aendring\": \"\",\n   \"vurdering\": \"\",\n   \"kommentar\": \"\"\n  },\n  {\n   \"id\": \"BG-006\",\n   \"omraade\": \"Gæster, kunder og roller\",\n   \"navn\": \"Mødeleder\",\n   \"type\": \"Part eller rolle\",\n   \"vaesentlighed\": \"Mindre væsentlig\",\n   \"definition\": \"En kontaktperson, der leder kundens arrangement på dagen og gennemgår programmet med konferenceværten.\",\n   \"uddybning\": \"Har ofte sit eget program med hjemmefra. Ændringer på dagen (sygdom, allergier, tider) aftales mellem mødeleder og vært.\",\n   \"synonymer\": \"Konferenceleder.\",\n   \"ikkeForveksle\": \"Bestiller (den der har købt arrangementet).\",\n   \"begrundelse\": \"Vigtig i afviklingen af møder og konferencer, men en underrolle af Kontaktperson.\",\n   \"v4id\": \"\",\n   \"kilder\": \"\",\n   \"aendring\": \"\",\n   \"vurdering\": \"\",\n   \"kommentar\": \"\"\n  },\n  {\n   \"id\": \"BG-007\",\n   \"omraade\": \"Gæster, kunder og roller\",\n   \"navn\": \"Deltager\",\n   \"type\": \"Part eller rolle\",\n   \"vaesentlighed\": \"Væsentlig\",\n   \"definition\": \"En person, der er med i en booking eller et arrangement uden nødvendigvis selv at have booket.\",\n   \"uddybning\": \"Kan være en kendt gæst eller kun et navn på deltagerlisten. Uden telefonnummer kan deltageren ikke tjekke online ind og få digital nøgle.\",\n   \"synonymer\": \"Medrejsende, spiller, konferencegæst, kursist.\",\n   \"ikkeForveksle\": \"Kontaktperson og Kunde.\",\n   \"begrundelse\": \"Grupper og arrangementer består af deltagere; deltagernes ønsker og allergier skal nå driften.\",\n   \"v4id\": \"\",\n   \"kilder\": \"\",\n   \"aendring\": \"\",\n   \"vurdering\": \"\",\n   \"kommentar\": \"\"\n  },\n  {\n   \"id\": \"BG-008\",\n   \"omraade\": \"Gæster, kunder og roller\",\n   \"navn\": \"Gruppe\",\n   \"type\": \"Part eller rolle\",\n   \"vaesentlighed\": \"Væsentlig\",\n   \"definition\": \"Flere gæster, der booker og rejser sammen under én booking, fx en firmagruppe, en golfgruppe eller et selskab.\",\n   \"uddybning\": \"Over en vis størrelse eller kompleksitet overtager salg håndteringen fra receptionen. Som tommelfingerregel er der tale om en gruppe fra ca. 5 værelser eller 10 personer, men grænsen er en forretningsregel (se Grupperegel) og ikke en del af definitionen.\",\n   \"synonymer\": \"Firmagruppe, golfgruppe, selskab, turgruppe.\",\n   \"ikkeForveksle\": \"Arrangement (indholdet) og Deltagerliste (navnene).\",\n   \"begrundelse\": \"Afgør, hvem der håndterer bookingen, og hvordan der betales.\",\n   \"v4id\": \"\",\n   \"kilder\": \"\",\n   \"aendring\": \"\",\n   \"vurdering\": \"\",\n   \"kommentar\": \"\"\n  },\n  {\n   \"id\": \"BG-009\",\n   \"omraade\": \"Gæster, kunder og roller\",\n   \"navn\": \"Opholdsgæst\",\n   \"type\": \"Part eller rolle\",\n   \"vaesentlighed\": \"Væsentlig\",\n   \"definition\": \"En gæst, der har en overnatning på et værelse eller i et feriehus i en periode.\",\n   \"uddybning\": \"Rollen følger af, at gæsten har et ophold i bookingen. Giver adgang til inkluderede faciliteter, opholdsgæstpris og køb på værelset. Firmagæster med overnatning er også opholdsgæster.\",\n   \"synonymer\": \"Boende gæst, hotelgæst, receptionsgæst.\",\n   \"ikkeForveksle\": \"Dagsgæst.\",\n   \"begrundelse\": \"Den største gruppe gæster og udgangspunkt for de fleste pakker.\",\n   \"v4id\": \"\",\n   \"kilder\": \"\",\n   \"aendring\": \"\",\n   \"vurdering\": \"\",\n   \"kommentar\": \"\"\n  },\n  {\n   \"id\": \"BG-010\",\n   \"omraade\": \"Gæster, kunder og roller\",\n   \"navn\": \"Dagsgæst\",\n   \"type\": \"Part eller rolle\",\n   \"vaesentlighed\": \"Væsentlig\",\n   \"definition\": \"En gæst, der bruger resortet uden at overnatte, fx til golf, padel, spa eller restaurant.\",\n   \"uddybning\": \"Betaler fuld pris og kan ikke lægge køb på et værelse. Processen er den samme som for opholdsgæsten, bortset fra overnatningen. Ikke-boende restaurantgæster med reservation er dagsgæster. Restauranten kalder dem ofte 'leisure'.\",\n   \"synonymer\": \"Lokal gæst, gæst udefra.\",\n   \"ikkeForveksle\": \"Walk-in (en dagsgæst kan sagtens have booket).\",\n   \"begrundelse\": \"Stor del af golf-, restaurant- og aktivitetsomsætningen.\",\n   \"v4id\": \"\",\n   \"kilder\": \"\",\n   \"aendring\": \"\",\n   \"vurdering\": \"\",\n   \"kommentar\": \"\"\n  },\n  {\n   \"id\": \"BG-011\",\n   \"omraade\": \"Gæster, kunder og roller\",\n   \"navn\": \"Walk-in\",\n   \"type\": \"Part eller rolle\",\n   \"vaesentlighed\": \"Mindre væsentlig\",\n   \"definition\": \"En gæst, der møder op og køber uden forudgående booking, typisk i en restaurant eller bar.\",\n   \"uddybning\": \"Walk-in betyder uden booking. Ca. 5 % af restaurantgæsterne kommer udefra uden booking. Ikke-boende gæster med reservation er dagsgæster, ikke walk-in.\",\n   \"synonymer\": \"Gæst fra gaden.\",\n   \"ikkeForveksle\": \"Dagsgæst.\",\n   \"begrundelse\": \"Relevant for restaurant og kasse, men lille andel.\",\n   \"v4id\": \"\",\n   \"kilder\": \"\",\n   \"aendring\": \"\",\n   \"vurdering\": \"\",\n   \"kommentar\": \"\"\n  },\n  {\n   \"id\": \"BG-012\",\n   \"omraade\": \"Gæster, kunder og roller\",\n   \"navn\": \"Restaurantgæst\",\n   \"type\": \"Part eller rolle\",\n   \"vaesentlighed\": \"Mindre væsentlig\",\n   \"definition\": \"En gæst, der spiser i en af resortets restauranter, uanset om gæsten overnatter.\",\n   \"uddybning\": \"En rolle i den enkelte bordreservation eller det enkelte restaurantbesøg. Kan være opholdsgæst, dagsgæst eller walk-in. Restaurant og takeaway er to forskellige måder at købe på.\",\n   \"synonymer\": \"À la carte-gæst.\",\n   \"ikkeForveksle\": \"Opholdsgæst og Dagsgæst.\",\n   \"begrundelse\": \"Ordet bruges om flere forskellige ting; begrebet gør det entydigt.\",\n   \"v4id\": \"\",\n   \"kilder\": \"\",\n   \"aendring\": \"\",\n   \"vurdering\": \"\",\n   \"kommentar\": \"\"\n  },\n  {\n   \"id\": \"BG-013\",\n   \"omraade\": \"Gæster, kunder og roller\",\n   \"navn\": \"Golfspiller\",\n   \"type\": \"Part eller rolle\",\n   \"vaesentlighed\": \"Væsentlig\",\n   \"definition\": \"En gæst, der spiller golf, kendt ved sit DGU-nummer, sin hjemmeklub og sit handicap.\",\n   \"uddybning\": \"Golfspillerens data (handicap, hjemmeklub, golfkørekort) ejes af DGU og ligger i GolfBox. Golfspillere kommer som dagsgæster, opholdsgæster, golfgrupper, via agent eller som medlemmer af HimmerLands egen golfklub.\",\n   \"synonymer\": \"Spiller, golfgæst, greenfee-gæst.\",\n   \"ikkeForveksle\": \"Golfklubmedlemskab.\",\n   \"begrundelse\": \"Golfspilleren er gæsten i alt golfsalg, fra greenfee til golfrejser.\",\n   \"v4id\": \"\",\n   \"kilder\": \"\",\n   \"aendring\": \"\",\n   \"vurdering\": \"\",\n   \"kommentar\": \"\"\n  },\n  {\n   \"id\": \"BG-014\",\n   \"omraade\": \"Gæster, kunder og roller\",\n   \"navn\": \"Leisure-gæst\",\n   \"type\": \"Part eller rolle\",\n   \"vaesentlighed\": \"Mindre væsentlig\",\n   \"definition\": \"En gæst, der besøger resortet privat og selv betaler.\",\n   \"uddybning\": \"Ordet har tre betydninger: i receptionen feriegæster, i salg private arrangementer og grupper, i restauranten gæster uden ophold. Systemerne skelner ikke; forskellen ligger i proces og kontaktpunkter. Brug hellere Opholdsgæst, Dagsgæst eller Organisation.\",\n   \"synonymer\": \"Læsergæst, privatgæst, 'hr. og fru Jensen'.\",\n   \"ikkeForveksle\": \"Dagsgæst.\",\n   \"begrundelse\": \"Bruges dagligt, men skaber forvirring. Kunde = privatperson dækker det samme.\",\n   \"v4id\": \"\",\n   \"kilder\": \"\",\n   \"aendring\": \"\",\n   \"vurdering\": \"\",\n   \"kommentar\": \"\"\n  },\n  {\n   \"id\": \"BG-015\",\n   \"omraade\": \"Gæster, kunder og roller\",\n   \"navn\": \"Business-gæst\",\n   \"type\": \"Part eller rolle\",\n   \"vaesentlighed\": \"Mindre væsentlig\",\n   \"definition\": \"En gæst, der deltager i et møde, en konference eller et firmaarrangement på en organisations regning.\",\n   \"uddybning\": \"Har ofte ikke selv booket og mangler derfor kontaktdata. Kan have drikkevarer for egen regning. Det er fakturaen, der viser, at gæsten er business.\",\n   \"synonymer\": \"Konferencegæst, mødegæst, firmagæst, B2B-gæst.\",\n   \"ikkeForveksle\": \"Kontaktperson.\",\n   \"begrundelse\": \"Bruges dagligt; dækkes også af Deltager + Organisation.\",\n   \"v4id\": \"\",\n   \"kilder\": \"\",\n   \"aendring\": \"\",\n   \"vurdering\": \"\",\n   \"kommentar\": \"\"\n  },\n  {\n   \"id\": \"BG-016\",\n   \"omraade\": \"Gæster, kunder og roller\",\n   \"navn\": \"Agent\",\n   \"type\": \"Part eller rolle\",\n   \"vaesentlighed\": \"Væsentlig\",\n   \"definition\": \"En organisation, der videresælger HimmerLands ophold og pakker til egne kunder, fx et golfrejsebureau i England eller Tyskland.\",\n   \"uddybning\": \"Agenten har en aftale med egne priskoder. Kontakten går via salg eller golfmanager, ikke direkte til gæsten. HimmerLand fakturerer agenten for hele rejsen, og agenten fakturerer selv provisionen.\",\n   \"synonymer\": \"Turoperatør, rejsearrangør, partner (fx Nordic Golfers).\",\n   \"ikkeForveksle\": \"OTA (sælger værelser online).\",\n   \"begrundelse\": \"Hele golfrejse-varianten går gennem agenter.\",\n   \"v4id\": \"\",\n   \"kilder\": \"\",\n   \"aendring\": \"\",\n   \"vurdering\": \"\",\n   \"kommentar\": \"\"\n  },\n  {\n   \"id\": \"BG-017\",\n   \"omraade\": \"Gæster, kunder og roller\",\n   \"navn\": \"OTA\",\n   \"type\": \"Part eller rolle\",\n   \"vaesentlighed\": \"Mindre væsentlig\",\n   \"definition\": \"En online bookingportal, fx Booking.com eller Expedia, der sælger HimmerLands værelser mod provision.\",\n   \"uddybning\": \"Sælger kun værelser, ikke pakker. HimmerLand har egen aftale med Booking.com og Expedia; øvrige kanaler går via channel manager.\",\n   \"synonymer\": \"Bookingportal, bookingpartner.\",\n   \"ikkeForveksle\": \"Agent (sælger pakker til egne kunder).\",\n   \"begrundelse\": \"Vigtig salgskanal for værelser, men uden for pakker og arrangementer.\",\n   \"v4id\": \"\",\n   \"kilder\": \"\",\n   \"aendring\": \"\",\n   \"vurdering\": \"\",\n   \"kommentar\": \"\"\n  },\n  {\n   \"id\": \"BG-018\",\n   \"omraade\": \"Gæster, kunder og roller\",\n   \"navn\": \"Golfklub\",\n   \"type\": \"Part eller rolle\",\n   \"vaesentlighed\": \"Mindre væsentlig\",\n   \"definition\": \"En organisation, som golfspillere er medlemmer af, enten HimmerLands egen golfklub eller en anden klub.\",\n   \"uddybning\": \"Spillerens hjemmeklub afgør greenfee. Fire klubber har en cross country-aftale med HimmerLand.\",\n   \"synonymer\": \"Hjemmeklub, klub.\",\n   \"ikkeForveksle\": \"Golfklubmedlemskab (HimmerLands egen ordning).\",\n   \"begrundelse\": \"Påvirker pris og fribilletter i golf.\",\n   \"v4id\": \"\",\n   \"kilder\": \"\",\n   \"aendring\": \"\",\n   \"vurdering\": \"\",\n   \"kommentar\": \"\"\n  },\n  {\n   \"id\": \"BG-019\",\n   \"omraade\": \"Gæster, kunder og roller\",\n   \"navn\": \"Husejer\",\n   \"type\": \"Part eller rolle\",\n   \"vaesentlighed\": \"Mindre væsentlig\",\n   \"definition\": \"En person, der ejer et feriehus på resortet og har et medlemskab hos HimmerLand som husejer.\",\n   \"uddybning\": \"Får ikke længere rabat, men kan lægge køb på husejerkortet, som opkræves via Betalingsservice. Husejerens egen udlejning af huset er Privat udlejning og ligger uden for HimmerLands salg.\",\n   \"synonymer\": \"Husejerkort.\",\n   \"ikkeForveksle\": \"Opholdsgæst, der lejer et feriehus.\",\n   \"begrundelse\": \"Lille gruppe, men en del af medlemskabsområdet.\",\n   \"v4id\": \"\",\n   \"kilder\": \"\",\n   \"aendring\": \"\",\n   \"vurdering\": \"\",\n   \"kommentar\": \"\"\n  },\n  {\n   \"id\": \"BG-167\",\n   \"omraade\": \"Gæster, kunder og roller\",\n   \"navn\": \"Privat udlejning\",\n   \"type\": \"Hændelse\",\n   \"vaesentlighed\": \"Mindre væsentlig\",\n   \"definition\": \"En husejers egen udlejning af sit feriehus uden om HimmerLand.\",\n   \"uddybning\": \"Ligger uden for HimmerLands salg, men er en del af husejernes og gæsternes verden på resortet, fx når lejere af private huse bruger restaurant, aktiviteter eller golf.\",\n   \"synonymer\": \"Husejerudlejning.\",\n   \"ikkeForveksle\": \"Ophold (HimmerLands egen udlejning).\",\n   \"begrundelse\": \"Uden for HimmerLands salg, men en del af husejernes univers.\",\n   \"v4id\": \"\",\n   \"kilder\": \"\",\n   \"aendring\": \"\",\n   \"vurdering\": \"\",\n   \"kommentar\": \"\"\n  },\n  {\n   \"id\": \"BG-020\",\n   \"omraade\": \"Gæster, kunder og roller\",\n   \"navn\": \"Koncernmedarbejder\",\n   \"type\": \"Part eller rolle\",\n   \"vaesentlighed\": \"Mindre væsentlig\",\n   \"definition\": \"En ansat i Lars Larsen Group, som har ret til medarbejderrabat hos HimmerLand.\",\n   \"uddybning\": \"Rabatten er 20 % og kræver, at medarbejderen selv er til stede og viser koncernens medarbejderapp. Online bookes til fuld pris, og rabatten tilbagebetales ved ankomst. Glemmes rabatten, trækkes den manuelt pr. varelinje ved check-ud.\",\n   \"synonymer\": \"JYSK-medarbejder, LLG-medarbejder.\",\n   \"ikkeForveksle\": \"Medarbejder (ansat hos HimmerLand).\",\n   \"begrundelse\": \"Giver manuelt arbejde, men er en afgrænset rabatordning.\",\n   \"v4id\": \"\",\n   \"kilder\": \"\",\n   \"aendring\": \"\",\n   \"vurdering\": \"\",\n   \"kommentar\": \"\"\n  },\n  {\n   \"id\": \"BG-021\",\n   \"omraade\": \"Gæster, kunder og roller\",\n   \"navn\": \"Stamgæst\",\n   \"type\": \"Part eller rolle\",\n   \"vaesentlighed\": \"Mindre væsentlig\",\n   \"definition\": \"En gæst, der kommer igen flere gange over en periode.\",\n   \"uddybning\": \"Der findes ingen fælles definition (fx antal overnatninger pr. år), og et udtræk kan ikke laves i dag. Udvalgte stamgæster ringes op efter besøget.\",\n   \"synonymer\": \"Stamkunde, faste gæster.\",\n   \"ikkeForveksle\": \"Medlem (har en ordning).\",\n   \"begrundelse\": \"Vigtig for loyalitet, men kræver en definition først.\",\n   \"v4id\": \"\",\n   \"kilder\": \"\",\n   \"aendring\": \"\",\n   \"vurdering\": \"\",\n   \"kommentar\": \"\"\n  },\n  {\n   \"id\": \"BG-022\",\n   \"omraade\": \"Gæster, kunder og roller\",\n   \"navn\": \"Medarbejder\",\n   \"type\": \"Part eller rolle\",\n   \"vaesentlighed\": \"Mindre væsentlig\",\n   \"definition\": \"En person, der er ansat hos HimmerLand.\",\n   \"uddybning\": \"Optræder i forretningen i roller som sælger, receptionist, konferencevært, tjener og instruktør. Ejerskab af opgaver bør ligge hos rollen og ikke hos personen.\",\n   \"synonymer\": \"Ansat, kollega.\",\n   \"ikkeForveksle\": \"Koncernmedarbejder, Instruktør (kan være ekstern).\",\n   \"begrundelse\": \"Nødvendig for roller, vagter og ansvar, men ikke i fokus i gæstens oplevelse.\",\n   \"v4id\": \"\",\n   \"kilder\": \"\",\n   \"aendring\": \"\",\n   \"vurdering\": \"\",\n   \"kommentar\": \"\"\n  },\n  {\n   \"id\": \"BG-023\",\n   \"omraade\": \"Gæster, kunder og roller\",\n   \"navn\": \"Rolle\",\n   \"type\": \"Part eller rolle\",\n   \"vaesentlighed\": \"Mindre væsentlig\",\n   \"definition\": \"En funktion, en medarbejder udfører, uafhængigt af hvilken afdeling medarbejderen hører til.\",\n   \"uddybning\": \"Eksempler: sælger, konferencevært, receptionist, revenue-ansvarlig, golfmanager. Samme person kan have flere roller samme dag.\",\n   \"synonymer\": \"Funktion, stilling.\",\n   \"ikkeForveksle\": \"Afdeling.\",\n   \"begrundelse\": \"Nødvendig for ansvar og bemanding.\",\n   \"v4id\": \"\",\n   \"kilder\": \"\",\n   \"aendring\": \"\",\n   \"vurdering\": \"\",\n   \"kommentar\": \"\"\n  },\n  {\n   \"id\": \"BG-024\",\n   \"omraade\": \"Gæster, kunder og roller\",\n   \"navn\": \"Konferencevært\",\n   \"type\": \"Part eller rolle\",\n   \"vaesentlighed\": \"Mindre væsentlig\",\n   \"definition\": \"En medarbejder i rollen som vært, der tager imod et arrangement på dagen, gennemgår programmet med mødelederen og giver ændringer videre til driften.\",\n   \"uddybning\": \"Byder velkommen hver dag ved flerdagskonferencer og 'fanger' gruppen ved afrejse. Grupper uden lokale kan også få en vært.\",\n   \"synonymer\": \"Vært, værtskabsrollen.\",\n   \"ikkeForveksle\": \"Mødeleder (kundens person).\",\n   \"begrundelse\": \"Central i afviklingen af møder og konferencer.\",\n   \"v4id\": \"\",\n   \"kilder\": \"\",\n   \"aendring\": \"\",\n   \"vurdering\": \"\",\n   \"kommentar\": \"\"\n  },\n  {\n   \"id\": \"BG-025\",\n   \"omraade\": \"Gæster, kunder og roller\",\n   \"navn\": \"Sælger\",\n   \"type\": \"Part eller rolle\",\n   \"vaesentlighed\": \"Mindre væsentlig\",\n   \"definition\": \"En medarbejder i salg, der håndterer forespørgsler, tilbud og opfølgning over for virksomheder, grupper og agenter.\",\n   \"uddybning\": \"Omfatter salgsmanagere, der plejer relationer til virksomheder, golfgrupper og agenter og overdrager til salgsafdelingen, når der skal laves tilbud, samt golfmanageren. Arbejder i dag ofte uden system ('blokken').\",\n   \"synonymer\": \"Salgsmanager, golfmanager, salgsafdelingen.\",\n   \"ikkeForveksle\": \"Kontaktperson (kundens person).\",\n   \"begrundelse\": \"Ejer hele dialogen med virksomheder og grupper.\",\n   \"v4id\": \"\",\n   \"kilder\": \"\",\n   \"aendring\": \"\",\n   \"vurdering\": \"\",\n   \"kommentar\": \"\"\n  },\n  {\n   \"id\": \"BG-026\",\n   \"omraade\": \"Gæster, kunder og roller\",\n   \"navn\": \"Afdeling\",\n   \"type\": \"Part eller rolle\",\n   \"vaesentlighed\": \"Mindre væsentlig\",\n   \"definition\": \"En organisatorisk enhed i HimmerLand, fx reception, salg, F&B, aktivitet, golf, housekeeping, teknik eller økonomi.\",\n   \"uddybning\": \"HimmerLand har 10 afdelinger. Overdragelser mellem afdelinger (salg til drift, reception til restaurant) er der, hvor information går tabt i dag.\",\n   \"synonymer\": \"Afd.\",\n   \"ikkeForveksle\": \"Rolle og Lokation.\",\n   \"begrundelse\": \"Nødvendig for ansvar og overdragelser.\",\n   \"v4id\": \"\",\n   \"kilder\": \"\",\n   \"aendring\": \"\",\n   \"vurdering\": \"\",\n   \"kommentar\": \"\"\n  },\n  {\n   \"id\": \"BG-027\",\n   \"omraade\": \"Gæster, kunder og roller\",\n   \"navn\": \"Leverandør\",\n   \"type\": \"Part eller rolle\",\n   \"vaesentlighed\": \"Mindre væsentlig\",\n   \"definition\": \"En ekstern organisation, der leverer en del af en ydelse til gæsten efter bestilling fra HimmerLand, fx blomster.\",\n   \"uddybning\": \"Bestilles i dag via mail med reservationsnummer, dato og navn.\",\n   \"synonymer\": \"Underleverandør.\",\n   \"ikkeForveksle\": \"Agent.\",\n   \"begrundelse\": \"Detalje i tilkøbsprocessen.\",\n   \"v4id\": \"\",\n   \"kilder\": \"\",\n   \"aendring\": \"\",\n   \"vurdering\": \"\",\n   \"kommentar\": \"\"\n  },\n  {\n   \"id\": \"BG-028\",\n   \"omraade\": \"Gæster, kunder og roller\",\n   \"navn\": \"Promotor\",\n   \"type\": \"Part eller rolle\",\n   \"vaesentlighed\": \"Ubetydelig\",\n   \"definition\": \"En organisation, der ejer et eksternt event, fx en turnering, som HimmerLand er vært for.\",\n   \"uddybning\": \"En sjælden særsag, som håndteres manuelt og ikke skal designes for.\",\n   \"synonymer\": \"Eventpartner.\",\n   \"ikkeForveksle\": \"Agent.\",\n   \"begrundelse\": \"Sjælden særsag.\",\n   \"v4id\": \"\",\n   \"kilder\": \"\",\n   \"aendring\": \"\",\n   \"vurdering\": \"\",\n   \"kommentar\": \"\"\n  },\n  {\n   \"id\": \"BG-029\",\n   \"omraade\": \"Salg, dialog og aftaler\",\n   \"navn\": \"Henvendelse\",\n   \"type\": \"Hændelse\",\n   \"vaesentlighed\": \"Mindre væsentlig\",\n   \"definition\": \"En kontakt mellem HimmerLand og en gæst eller organisation, fx et opkald, en mail, en formular eller en besked.\",\n   \"uddybning\": \"Registreres ikke som data i dag. Telefonen ligger hos salg i hverdagens dagtimer og hos receptionen aften og weekend. Gæster henvender sig ofte til en navngiven medarbejder, de har talt med før.\",\n   \"synonymer\": \"Kontakt, dialog, touchpoint.\",\n   \"ikkeForveksle\": \"Forespørgsel (har et konkret købsønske).\",\n   \"begrundelse\": \"Overbegreb, som gør det muligt at samle dialogen, men Forespørgsel og Bekræftelse er de vigtige.\",\n   \"v4id\": \"\",\n   \"kilder\": \"\",\n   \"aendring\": \"\",\n   \"vurdering\": \"\",\n   \"kommentar\": \"\"\n  },\n  {\n   \"id\": \"BG-030\",\n   \"omraade\": \"Salg, dialog og aftaler\",\n   \"navn\": \"Forespørgsel\",\n   \"type\": \"Hændelse\",\n   \"vaesentlighed\": \"Væsentlig\",\n   \"definition\": \"En henvendelse med et konkret købsønske, der kræver afklaring og et tilbud, fx en konference, en golfgruppe eller en fest.\",\n   \"uddybning\": \"Salg skal mindst kende dato, antal og formål for at kunne give en pris. Kommer via formular, telefon eller mail.\",\n   \"synonymer\": \"Lead, konferenceforespørgsel.\",\n   \"ikkeForveksle\": \"Booking.\",\n   \"begrundelse\": \"Starten på salget til virksomheder, grupper og golf.\",\n   \"v4id\": \"\",\n   \"kilder\": \"\",\n   \"aendring\": \"\",\n   \"vurdering\": \"\",\n   \"kommentar\": \"\"\n  },\n  {\n   \"id\": \"BG-031\",\n   \"omraade\": \"Salg, dialog og aftaler\",\n   \"navn\": \"Tilbud\",\n   \"type\": \"Ting eller aftale\",\n   \"vaesentlighed\": \"Væsentlig\",\n   \"definition\": \"HimmerLands skriftlige pristilbud til én kunde, som bliver til en bekræftet booking, når kunden accepterer det.\",\n   \"uddybning\": \"Dannes i dag i Spectra og sendes via GetAccept med en acceptfrist. Der kan være flere runder med rettelser. Hjemmesidens 'pakker og tilbud' er ikke tilbud, men kampagner.\",\n   \"synonymer\": \"Kontrakt, oplæg.\",\n   \"ikkeForveksle\": \"Kampagne (til alle) og Bekræftelse (efter booking).\",\n   \"begrundelse\": \"Overgangen fra dialog til booking for virksomheder og grupper.\",\n   \"v4id\": \"\",\n   \"kilder\": \"\",\n   \"aendring\": \"\",\n   \"vurdering\": \"\",\n   \"kommentar\": \"\"\n  },\n  {\n   \"id\": \"BG-032\",\n   \"omraade\": \"Salg, dialog og aftaler\",\n   \"navn\": \"Accept\",\n   \"type\": \"Hændelse\",\n   \"vaesentlighed\": \"Mindre væsentlig\",\n   \"definition\": \"Kundens bindende godkendelse af et tilbud.\",\n   \"uddybning\": \"Digital underskrift i GetAccept. Bruges også til at bekræfte større golfgrupper og Business Club-medlemskaber. Efter accept sættes bookingen manuelt til bekræftet.\",\n   \"synonymer\": \"Underskrift, kontraktgodkendelse.\",\n   \"ikkeForveksle\": \"Samtykke (GDPR) og Bekræftelse (HimmerLands besked).\",\n   \"begrundelse\": \"Vigtig hændelse, men kan vises som overgangen Tilbud til Booking.\",\n   \"v4id\": \"\",\n   \"kilder\": \"\",\n   \"aendring\": \"\",\n   \"vurdering\": \"\",\n   \"kommentar\": \"\"\n  },\n  {\n   \"id\": \"BG-033\",\n   \"omraade\": \"Salg, dialog og aftaler\",\n   \"navn\": \"Salgskanal\",\n   \"type\": \"Ting eller aftale\",\n   \"vaesentlighed\": \"Væsentlig\",\n   \"definition\": \"Den vej, en booking eller forespørgsel kommer ind ad, fx hjemmeside, OTA, agent, telefon, mail, reception eller aktivitetsstand.\",\n   \"uddybning\": \"Kanalen afgør, hvad der kan sælges (OTA sælger kun værelser) og hvilken pris der gælder.\",\n   \"synonymer\": \"Kanal, bookingkanal, indgang.\",\n   \"ikkeForveksle\": \"Lokation (hvor ydelsen leveres).\",\n   \"begrundelse\": \"Afgør pris, indhold og hvem der håndterer bookingen.\",\n   \"v4id\": \"\",\n   \"kilder\": \"\",\n   \"aendring\": \"\",\n   \"vurdering\": \"\",\n   \"kommentar\": \"\"\n  },\n  {\n   \"id\": \"BG-034\",\n   \"omraade\": \"Salg, dialog og aftaler\",\n   \"navn\": \"Kampagne\",\n   \"type\": \"Ting eller aftale\",\n   \"vaesentlighed\": \"Mindre væsentlig\",\n   \"definition\": \"Et tidsbegrænset salgstilbud til alle gæster, fx en julepakke eller 'to valgfrie aktiviteter', som vises på hjemmesiden.\",\n   \"uddybning\": \"Hjemmesiden kalder det 'pakker og tilbud'. Adskilles fra Tilbud, som er et pristilbud til én kunde.\",\n   \"synonymer\": \"Pakker og tilbud, sommerpakke.\",\n   \"ikkeForveksle\": \"Tilbud.\",\n   \"begrundelse\": \"Fjerner en sproglig forveksling.\",\n   \"v4id\": \"\",\n   \"kilder\": \"\",\n   \"aendring\": \"\",\n   \"vurdering\": \"\",\n   \"kommentar\": \"\"\n  },\n  {\n   \"id\": \"BG-035\",\n   \"omraade\": \"Salg, dialog og aftaler\",\n   \"navn\": \"Aftale\",\n   \"type\": \"Ting eller aftale\",\n   \"vaesentlighed\": \"Væsentlig\",\n   \"definition\": \"En kommerciel aftale mellem HimmerLand og en organisation om priser, rabatter, kapacitet eller provision i en periode.\",\n   \"uddybning\": \"Omfatter virksomhedsaftaler, agentaftaler, koncernaftalen og cross country-aftalen. Business Club er ikke en aftale, men et medlemskab (besluttet 9/10).\",\n   \"synonymer\": \"Firmaaftale, rammeaftale, samarbejdsaftale.\",\n   \"ikkeForveksle\": \"Tilbud (enkelt salg) og Medlemskab.\",\n   \"begrundelse\": \"Styrer pris og vilkår for virksomheder og agenter.\",\n   \"v4id\": \"\",\n   \"kilder\": \"\",\n   \"aendring\": \"\",\n   \"vurdering\": \"\",\n   \"kommentar\": \"\"\n  },\n  {\n   \"id\": \"BG-036\",\n   \"omraade\": \"Salg, dialog og aftaler\",\n   \"navn\": \"Virksomhedsaftale\",\n   \"type\": \"Ting eller aftale\",\n   \"vaesentlighed\": \"Mindre væsentlig\",\n   \"definition\": \"En aftale med en virksomhed om firmapris på ophold, møder og aktiviteter for virksomheden og dens medarbejdere.\",\n   \"uddybning\": \"Ofte lokale nordjyske virksomheder og en stor del af B2B-omsætningen. Udmøntes i dag som rabatkode og firmapris, som ikke kan spores tilbage til virksomheden.\",\n   \"synonymer\": \"Firmaaftale, rammeaftale, lokal aftale.\",\n   \"ikkeForveksle\": \"Business Club.\",\n   \"begrundelse\": \"Væsentlig omsætning, men en undertype af Aftale.\",\n   \"v4id\": \"\",\n   \"kilder\": \"\",\n   \"aendring\": \"\",\n   \"vurdering\": \"\",\n   \"kommentar\": \"\"\n  },\n  {\n   \"id\": \"BG-037\",\n   \"omraade\": \"Salg, dialog og aftaler\",\n   \"navn\": \"Agentaftale\",\n   \"type\": \"Ting eller aftale\",\n   \"vaesentlighed\": \"Mindre væsentlig\",\n   \"definition\": \"En aftale med en agent om priskoder, pakker, evt. kapacitet og provision.\",\n   \"uddybning\": \"Agentens gæster kan ikke booke online; agenten mailer indholdet til salg, som bygger pakken.\",\n   \"synonymer\": \"Firmaaftale med agent.\",\n   \"ikkeForveksle\": \"OTA-aftale.\",\n   \"begrundelse\": \"Undertype af Aftale, vigtig for golfrejser.\",\n   \"v4id\": \"\",\n   \"kilder\": \"\",\n   \"aendring\": \"\",\n   \"vurdering\": \"\",\n   \"kommentar\": \"\"\n  },\n  {\n   \"id\": \"BG-038\",\n   \"omraade\": \"Salg, dialog og aftaler\",\n   \"navn\": \"Cross country-aftale\",\n   \"type\": \"Ting eller aftale\",\n   \"vaesentlighed\": \"Mindre væsentlig\",\n   \"definition\": \"En aftale med fire andre golfklubber, der giver deres medlemmer to gratis runder hver på HimmerLands baner.\",\n   \"uddybning\": \"Golfautomaten trækker fribilletten; shoppen gør det manuelt, hvis automaten fejler.\",\n   \"synonymer\": \"Cross country.\",\n   \"ikkeForveksle\": \"Golfklubmedlemskab.\",\n   \"begrundelse\": \"Afgrænset golfordning.\",\n   \"v4id\": \"\",\n   \"kilder\": \"\",\n   \"aendring\": \"\",\n   \"vurdering\": \"\",\n   \"kommentar\": \"\"\n  },\n  {\n   \"id\": \"BG-039\",\n   \"omraade\": \"Salg, dialog og aftaler\",\n   \"navn\": \"Provision\",\n   \"type\": \"Egenskab\",\n   \"vaesentlighed\": \"Mindre væsentlig\",\n   \"definition\": \"Den andel af prisen, en agent eller OTA får for at formidle en booking.\",\n   \"uddybning\": \"Modregnes ikke på HimmerLands faktura: agenten fakturerer selv provisionen bagefter.\",\n   \"synonymer\": \"Kommission.\",\n   \"ikkeForveksle\": \"Rabat (prisnedslag til kunden).\",\n   \"begrundelse\": \"Vigtig for økonomi, men en egenskab ved aftalen.\",\n   \"v4id\": \"\",\n   \"kilder\": \"\",\n   \"aendring\": \"\",\n   \"vurdering\": \"\",\n   \"kommentar\": \"\"\n  },\n  {\n   \"id\": \"BG-040\",\n   \"omraade\": \"Salg, dialog og aftaler\",\n   \"navn\": \"Priskode\",\n   \"type\": \"Ting eller aftale\",\n   \"vaesentlighed\": \"Mindre væsentlig\",\n   \"definition\": \"En aftalt prisstruktur, der gælder for en kunde, agent, kanal eller periode.\",\n   \"uddybning\": \"Princippet er listepris plus en rabatsats, fx tre priskoder til agenters golfgrupper. Sælgere har interne bookingkoder.\",\n   \"synonymer\": \"Rate code, firmapris, bookingkode.\",\n   \"ikkeForveksle\": \"Rabatkode (indtastes af gæsten).\",\n   \"begrundelse\": \"Mekanismen bag aftalepriser.\",\n   \"v4id\": \"\",\n   \"kilder\": \"\",\n   \"aendring\": \"\",\n   \"vurdering\": \"\",\n   \"kommentar\": \"\"\n  },\n  {\n   \"id\": \"BG-041\",\n   \"omraade\": \"Salg, dialog og aftaler\",\n   \"navn\": \"Rabatkode\",\n   \"type\": \"Ting eller aftale\",\n   \"vaesentlighed\": \"Mindre væsentlig\",\n   \"definition\": \"En kode, som gæsten indtaster ved booking for at få en rabat eller indløse en inkluderet ydelse.\",\n   \"uddybning\": \"Bruges i dag både til rabat og til at indløse inkluderede aktiviteter, hvilket gæsterne ikke forstår. Inkluderede aktiviteter er Valgfrit pakkeelement, ikke rabat. Kan ikke spores til person eller virksomhed.\",\n   \"synonymer\": \"Kampagnekode, kode.\",\n   \"ikkeForveksle\": \"Priskode.\",\n   \"begrundelse\": \"Kendt smertepunkt, men et middel snarere end et kernebegreb.\",\n   \"v4id\": \"\",\n   \"kilder\": \"\",\n   \"aendring\": \"\",\n   \"vurdering\": \"\",\n   \"kommentar\": \"\"\n  },\n  {\n   \"id\": \"BG-042\",\n   \"omraade\": \"Salg, dialog og aftaler\",\n   \"navn\": \"Opfølgning\",\n   \"type\": \"Hændelse\",\n   \"vaesentlighed\": \"Væsentlig\",\n   \"definition\": \"En planlagt kontakt fra HimmerLand til en kunde før eller efter besøget for at afklare detaljer, sælge mere eller sige tak.\",\n   \"uddybning\": \"Faste kontaktpunkter: 8 uger før fester, 6 uger før møder og konferencer (seks-ugers-mailen) og 1 uge før alle. Efter besøget ringer salg 'tak for sidst', og ofte følger en genbooking. Registreres i dag på sælgerens notesblok.\",\n   \"synonymer\": \"Kontaktpunkt, seks-ugers-mail, tak for sidst.\",\n   \"ikkeForveksle\": \"Bekræftelse (HimmerLands besked om bookingen).\",\n   \"begrundelse\": \"Bærende for salg til virksomheder og for genbooking.\",\n   \"v4id\": \"\",\n   \"kilder\": \"\",\n   \"aendring\": \"\",\n   \"vurdering\": \"\",\n   \"kommentar\": \"\"\n  },\n  {\n   \"id\": \"BG-043\",\n   \"omraade\": \"Salg, dialog og aftaler\",\n   \"navn\": \"Genbooking\",\n   \"type\": \"Hændelse\",\n   \"vaesentlighed\": \"Mindre væsentlig\",\n   \"definition\": \"En kundes booking af samme eller et tilsvarende arrangement igen, typisk til næste år.\",\n   \"uddybning\": \"Salg kalder det den vigtigste opfølgning efter besøget.\",\n   \"synonymer\": \"Booke igen.\",\n   \"ikkeForveksle\": \"Stamgæst.\",\n   \"begrundelse\": \"Vigtig for

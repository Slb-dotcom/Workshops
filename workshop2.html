nlige begreber ---------- */\nfunction synlige(){\n  return D.begreber.filter(b=>!V.skjulteDom.has(b.omraade) && b.niv\u003c=V.filter).map(b=>b.id);\n}\n\n/* ---------- layout: overblik ---------- */\nconst layoutCache = {};\nfunction nodeDim(id, center, fokus){\n  const px = center?22:fokus?18:15;\n  return {w: Math.max(90, bredde(B[id].navn, px, center)+ (center?44:28)), h: center?56:fokus?44:38};\n}\nfunction overblikLayout(ids){\n  const fast = D.layout && D.layout[V.filter];\n  if(fast && ids.every(id=>fast[id])){\n    const pos={}; ids.forEach(id=>{ const d=nodeDim(id); pos[id]={x:fast[id][0]*0.95, y:fast[id][1]*0.72, w:d.w, h:d.h}; });\n    return pos;\n  }\n  const nøgle = V.filter+\":\"+Math.round(10*svg.clientWidth/(svg.clientHeight||1))+\":\"+ids.join(\",\");\n  if(layoutCache[nøgle]) return layoutCache[nøgle];\n  const rand = rng(42);\n  const set = new Set(ids);\n  const iDom = {}; ids.forEach(id=>{ (iDom[B[id].omraade]=iDom[B[id].omraade]||[]).push(id); });\n  const aktive = domaener.filter(d=>iDom[d]);\n  const radius = {}; aktive.forEach(d=>radius[d]=95*Math.sqrt(iDom[d].length)+70);\n  // domæner i to rækker (første halvdel øverst), bredde efter størrelse\n  const pr = Math.ceil(aktive.length/2), centre = {};\n  let y=0;\n  [aktive.slice(0,pr), aktive.slice(pr)].forEach(rk=>{\n    if(!rk.length) return;\n    const h = Math.max(...rk.map(d=>radius[d]));\n    let x=0;\n    rk.forEach(d=>{ x+=radius[d]; centre[d]={x, y:y+h}; x+=radius[d]+90; });\n    const off = x/2; rk.forEach(d=>centre[d].x-=off);\n    y+=2*h+90;\n  });\n  const N = ids.map(id=>{ const c=centre[B[id].omraade], d=nodeDim(id);\n    return {id, x:c.x+(rand()-.5)*radius[B[id].omraade], y:c.y+(rand()-.5)*radius[B[id].omraade], w:d.w, h:d.h, c}; });\n  const idx={}; N.forEach((n,i)=>idx[n.id]=i);\n  const E = R.filter(r=>set.has(r.fra)&&set.has(r.til)&&r.fra!==r.til&&r.niv\u003c=V.filter).map(r=>[idx[r.fra],idx[r.til], B[r.fra].omraade===B[r.til].omraade]);\n  const IT=420;\n  for(let it=0; it\u003cIT; it++){\n    const a = 1-it/IT;\n    for(let i=0;i\u003cN.length;i++) for(let j=i+1;j\u003cN.length;j++){\n      const p=N[i], q=N[j]; let dx=q.x-p.x, dy=q.y-p.y, d2=dx*dx+dy*dy+.01;\n      if(d2>250000) continue;\n      const f = 2600/d2*a, d=Math.sqrt(d2);\n      p.x-=dx/d*f; p.y-=dy/d*f; q.x+=dx/d*f; q.y+=dy/d*f;\n    }\n    E.forEach(([i,j,samme])=>{\n      const p=N[i], q=N[j]; const dx=q.x-p.x, dy=q.y-p.y, d=Math.sqrt(dx*dx+dy*dy)+.01;\n      const f=(d-(samme?150:260))*(samme?0.02:0.004)*a;\n      p.x+=dx/d*f; p.y+=dy/d*f; q.x-=dx/d*f; q.y-=dy/d*f;\n    });\n    N.forEach(n=>{ n.x+=(n.c.x-n.x)*0.03; n.y+=(n.c.y-n.y)*0.03; });\n    if(it>IT*0.45){\n      for(let i=0;i\u003cN.length;i++) for(let j=i+1;j\u003cN.length;j++){\n        const p=N[i], q=N[j]; const dx=q.x-p.x, dy=q.y-p.y;\n        const ox=(p.w+q.w)/2+22-Math.abs(dx), oy=(p.h+q.h)/2+18-Math.abs(dy);\n        if(ox>0&&oy>0){\n          if(ox/(p.w+q.w)\u003coy/(p.h+q.h)){ const s=(dx\u003c0?-1:1)*ox/2; p.x-=s; q.x+=s; }\n          else { const s=(dy\u003c0?-1:1)*oy/2; p.y-=s; q.y+=s; }\n        }\n      }\n    }\n  }\n  // ekstra runder, så ingen bokse overlapper\n  for(let it=0; it\u003c120; it++){ let flyt=0;\n    for(let i=0;i\u003cN.length;i++) for(let j=i+1;j\u003cN.length;j++){\n      const p=N[i], q=N[j]; const dx=q.x-p.x, dy=q.y-p.y;\n      const ox=(p.w+q.w)/2+16-Math.abs(dx), oy=(p.h+q.h)/2+14-Math.abs(dy);\n      if(ox>0&&oy>0){ flyt++;\n        if(ox\u003coy*1.6){ const s=(dx\u003c0?-1:1)*ox/2; p.x-=s; q.x+=s; } else { const s=(dy\u003c0?-1:1)*oy/2; p.y-=s; q.y+=s; } }\n    }\n    if(!flyt) break; }\n  // pak områderne tæt i rækker, så overblikket fylder skærmen\n  const bokse = aktive.map(d=>{ const ns=N.filter(n=>B[n.id].omraade===d);\n    const x0=Math.min(...ns.map(n=>n.x-n.w/2)), x1=Math.max(...ns.map(n=>n.x+n.w/2));\n    const y0=Math.min(...ns.map(n=>n.y-n.h/2)), y1=Math.max(...ns.map(n=>n.y+n.h/2));\n    return {d, ns, x0, y0, w:x1-x0+52, h:y1-y0+52+34}; });\n  const areal = bokse.reduce((a,b)=>a+b.w*b.h,0);\n  const aspekt = Math.max(1, Math.min(2.4, (svg.clientWidth||1600)/(svg.clientHeight||900)));\n  const maxB = Math.max(Math.sqrt(areal*aspekt*2.0), ...bokse.map(b=>b.w));\n  let cx=0, cy=0, rh=0; const GAP=46;\n  bokse.forEach(b=>{\n    if(cx>0 && cx+b.w>maxB){ cx=0; cy+=rh+GAP; rh=0; }\n    const dx=cx+26-b.x0, dy=cy+26+34-b.y0;\n    b.ns.forEach(n=>{ n.x+=dx; n.y+=dy; });\n    cx+=b.w+GAP; rh=Math.max(rh,b.h);\n  });\n  const pos={}; N.forEach(n=>pos[n.id]={x:n.x,y:n.y,w:n.w,h:n.h});\n  return layoutCache[nøgle]=pos;\n}\n\n/* ---------- layout: fokus ---------- */\nfunction fokusLayout(id){\n  const pos={}; const d=nodeDim(id,true); pos[id]={x:0,y:0,w:d.w,h:d.h,center:true};\n  const ud=[], ind=[];\n  const synligeRel = relAf[id].filter(r=>r.niv\u003c=V.filter && r.fra!==r.til);\n  [...new Set(synligeRel.map(r=>r.fra===id?r.til:r.fra))].forEach(n=>{ const rs=synligeRel.filter(r=>r.fra===n||r.til===n); (rs.some(r=>r.fra===id)?ud:ind).push(n); });\n  const sorter = a=>a.sort((x,y)=>B[x].niv-B[y].niv||domaener.indexOf(B[x].omraade)-domaener.indexOf(B[y].omraade)||B[x].navn.localeCompare(B[y].navn,\"da\"));\n  sorter(ud); sorter(ind);\n  function bue(liste, side){\n    const n=liste.length; if(!n) return;\n    const R0 = Math.max(380, n*34);\n    const spredning = Math.min(150, 26*n+20)*Math.PI/180;\n    liste.forEach((nid,i)=>{\n      const t = n===1?0:(i/(n-1)-.5)*spredning;\n      const dd=nodeDim(nid,false,true);\n      pos[nid]={x:side*Math.cos(t)*R0*1.25, y:Math.sin(t)*R0, w:dd.w, h:dd.h};\n    });\n  }\n  if(ud.length+ind.length>10){\n    const alle=[...ud,...ind], n=alle.length, R0=Math.max(400, n*30);\n    alle.forEach((nid,i)=>{ const t=-Math.PI/2+2*Math.PI*i/n+Math.PI/n; const dd=nodeDim(nid,false,true);\n      pos[nid]={x:Math.cos(t)*R0*1.3, y:Math.sin(t)*R0, w:dd.w, h:dd.h}; });\n  }\n  else if(!ind.length && ud.length>6){ bue(ud.slice(0,Math.ceil(ud.length/2)),1); bue(ud.slice(Math.ceil(ud.length/2)),-1); }\n  else if(!ud.length && ind.length>6){ bue(ind.slice(0,Math.ceil(ind.length/2)),-1); bue(ind.slice(Math.ceil(ind.length/2)),1); }\n  else { bue(ud,1); bue(ind,-1); }\n  return pos;\n}\n\n/* ---------- tegning ---------- */\nconst svg=$(\"#svg\"), verden=$(\"#verden\"), lagN=$(\"#lagN\"), lagE=$(\"#lagE\"), lagD=$(\"#lagD\");\nlet nodeEl={}, kantEl={}, domEl={}, aktuelleKanter=[];\n\nfunction maalPos(){\n  if(V.visning===\"fokus\" && V.valgt) return fokusLayout(V.valgt);\n  return overblikLayout(synlige());\n}\n\nfunction byg(){\n  const mål = maalPos();\n  const ids = Object.keys(mål);\n  const set = new Set(ids);\n  lagN.textContent=\"\"; lagE.textContent=\"\"; lagD.textContent=\"\";\n  nodeEl={}; kantEl={}; domEl={};\n  svg.classList.toggle(\"focusmode\", V.visning===\"fokus\");\n  // domænebaggrunde i overblik\n  const fastLayout = D.layout && D.layout[V.filter] && ids.every(id=>D.layout[V.filter][id]);\n  if(V.visning!==\"fokus\" && !fastLayout){\n    domaener.forEach(d=>{\n      if(!ids.some(id=>B[id].omraade===d)) return;\n      const g=el(\"g\",{class:\"domaene\"});\n      const r=el(\"rect\",{rx:18,fill:farve[d][0],\"fill-opacity\":.32,stroke:farve[d][1]});\n      const t=el(\"text\",{fill:farve[d][1]}); t.textContent=d;\n      g.append(r,t); lagD.append(g); domEl[d]={g,r,t};\n    });\n  }\n  aktuelleKanter = R.filter(r=>set.has(r.fra)&&set.has(r.til)&&r.fra!==r.til &&\n    (V.visning!==\"fokus\" || r.fra===V.valgt || r.til===V.valgt) && r.niv\u003c=V.filter);\n  const par={};\n  aktuelleKanter.forEach(r=>{ const k=[r.fra,r.til].sort().join(\"~\"); (par[k]=par[k]||[]).push(r); });\n  aktuelleKanter.forEach(r=>{\n    const k=[r.fra,r.til].sort().join(\"~\"), gr=par[k];\n    const g=el(\"g\",{class:\"edge niv\"+r.niv}); const p=el(\"path\",erDel(r)?{\"marker-start\":\"url(#del)\"}:{\"marker-end\":erArv(r)?\"url(#arv)\":\"url(#pil)\"});\n    const t=el(\"text\"); t.textContent=r.label;\n    g.append(p,t); lagE.append(g);\n    kantEl[r.id]={g,p,t,r,bøj: gr.length>1 ? (gr.indexOf(r)-(gr.length-1)/2)*60*(r.fra\u003cr.til?1:-1) : 0};\n  });\n  ids.forEach(id=>{\n    const b=B[id], [fy,st]=farve[b.omraade];\n    const g=el(\"g\",{class:\"node\"+(mål[id].center?\" center\":\"\")+(b.niv>1&&V.visning===\"fokus\"?\" svag\":\"\")});\n    const ustabil=b.niv===3;\n    const r=el(\"rect\",{rx:9,fill:fy,stroke:st}); if(ustabil) r.setAttribute(\"stroke-dasharray\",\"7 4\");\n    const t=el(\"text\"); t.textContent=b.navn;\n    g.append(r,t);\n    g.addEventListener(\"click\",ev=>{ ev.stopPropagation(); klikBegreb(id); });\n    lagN.append(g); nodeEl[id]={g,r,t,badge:null};\n  });\n  opdaterMarkering();\n  animer(mål);\n}\n\nfunction kantSti(r, P){\n  const a=P[r.fra], b=P[r.til]; if(!a||!b) return null;\n  const ke=kantEl[r.id];\n  let mx=(a.x+b.x)/2, my=(a.y+b.y)/2;\n  const dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy)||1;\n  const cx=mx-dy/L*ke.bøj, cy=my+dx/L*ke.bøj;\n  const klip=(n,tx,ty)=>{ const ddx=tx-n.x, ddy=ty-n.y; const s=Math.min((n.w/2+3)/Math.abs(ddx||1e-6),(n.h/2+3)/Math.abs(ddy||1e-6)); return [n.x+ddx*s,n.y+ddy*s]; };\n  const [x1,y1]=klip(a,cx,cy), [x2,y2]=klip(b,cx,cy);\n  let t=.5; if(V.visning===\"fokus\"){ t = r.fra===V.valgt ? .6 : .4; }\n  const lx=(1-t)*(1-t)*x1+2*t*(1-t)*cx+t*t*x2, ly=(1-t)*(1-t)*y1+2*t*(1-t)*cy+t*t*y2;\n  return {d:`M${x1},${y1} Q${cx},${cy} ${x2},${y2}`, lx, ly};\n}\n\nfunction placer(P){\n  for(const id in nodeEl){\n    const p=P[id]; if(!p) continue; const n=nodeEl[id];\n    n.g.setAttribute(\"transform\",`translate(${p.x},${p.y})`);\n    n.r.setAttribute(\"x\",-p.w/2); n.r.setAttribute(\"y\",-p.h/2); n.r.setAttribute(\"width\",p.w); n.r.setAttribute(\"height\",p.h);\n    if(n.badge) n.badge.setAttribute(\"transform\",`translate(${p.w/2-4},${-p.h/2+4})`);\n  }\n  for(const rid in kantEl){\n    const k=kantEl[rid], s=kantSti(k.r,P); if(!s) continue;\n    k.p.setAttribute(\"d\",s.d); k.t.setAttribute(\"x\",s.lx); k.t.setAttribute(\"y\",s.ly);\n  }\n  for(const d in domEl){\n    const ids=Object.keys(P).filter(id=>B[id].omraade===d); if(!ids.length) continue;\n    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;\n    ids.forEach(id=>{const p=P[id]; x0=Math.min(x0,p.x-p.w/2); y0=Math.min(y0,p.y-p.h/2); x1=Math.max(x1,p.x+p.w/2); y1=Math.max(y1,p.y+p.h/2);});\n    const e=domEl[d]; const pad=26;\n    e.r.setAttribute(\"x\",x0-pad); e.r.setAttribute(\"y\",y0-pad-34); e.r.setAttribute(\"width\",x1-x0+2*pad); e.r.setAttribute(\"height\",y1-y0+2*pad+34);\n    e.t.setAttribute(\"x\",x0-pad+16); e.t.setAttribute(\"y\",y0-pad-8);\n  }\n}\n\nlet anim=null;\nfunction animer(mål){\n  const start={}; for(const id in mål){ const g=V.pos[id]; start[id]= g ? {...g} : {...mål[id], x:mål[id].x*0.9, y:mål[id].y*0.9}; }\n  const t0=performance.now(), T=520;\n  cancelAnimationFrame(anim);\n  const skalTilpasse = true;\n  if(skalTilpasse) tilpas(mål, true);\n  const trin=now=>{\n    const u=Math.min(1,(now-t0)/T), e=u\u003c.5?2*u*u:1-Math.pow(-2*u+2,2)/2;\n    const P={}; for(const id in mål){ const a=start[id], b=mål[id]; P[id]={x:a.x+(b.x-a.x)*e, y:a.y+(b.y-a.y)*e, w:a.w+(b.w-a.w)*e, h:a.h+(b.h-a.h)*e, center:b.center}; }\n    placer(P);\n    if(u\u003c1) anim=requestAnimationFrame(trin); else { V.pos=mål; }\n  };\n  anim=requestAnimationFrame(trin);\n}\n\n/* ---------- markering og status på kort ---------- */\nfunction opdaterMarkering(){\n  const v=V.valgt, fokus=V.visning===\"fokus\";\n  const nb = v ? new Set([v,...relAf[v].filter(r=>r.niv\u003c=V.filter).map(r=>r.fra===v?r.til:r.fra)]) : null;\n  for(const id in nodeEl){\n    const n=nodeEl[id];\n    n.g.classList.toggle(\"valgt\", id===v);\n    const bs=(S.begreber[id]||{}).status||\"\";\n    n.g.classList.toggle(\"bst-bekraeftet\", bs===\"bekraeftet\"); n.g.classList.toggle(\"bst-rettes\", bs===\"rettes\");\n    n.g.classList.toggle(\"dim\", !!(nb && !fokus && !nb.has(id)));\n    // badge: rettes / alt bekræftet\n    if(n.badge){ n.badge.remove(); n.badge=null; }\n    const rs=relAf[id]; if(!rs.length) continue;\n    const st=rs.map(r=>relStatus(r.id));\n    let b=null;\n    if(st.includes(\"rettes\")){ b=el(\"g\",{class:\"badge\"}); b.append(el(\"circle\",{r:9,fill:\"#C8102E\",stroke:\"#fff\",\"stroke-width\":2})); const t=el(\"text\",{fill:\"#fff\",\"font-size\":\"12\",\"font-weight\":\"700\"}); t.textContent=\"!\"; b.append(t); }\n    else if(st.every(s=>s===\"bekraeftet\")){ b=el(\"g\",{class:\"badge\"}); b.append(el(\"circle\",{r:9,fill:\"#5E9E4E\",stroke:\"#fff\",\"stroke-width\":2})); const t=el(\"text\",{fill:\"#fff\",\"font-size\":\"12\",\"font-weight\":\"700\"}); t.textContent=\"✓\"; b.append(t); }\n    if(b){ n.g.append(b); n.badge=b; const p=V.pos[id]; if(p) b.setAttribute(\"transform\",`translate(${p.w/2-4},${-p.h/2+4})`); }\n  }\n  for(const rid in kantEl){\n    const k=kantEl[rid], st=relStatus(rid)||\"none\";\n    const berører = v && (k.r.fra===v||k.r.til===v);\n    k.g.setAttribute(\"class\",\"edge niv\"+k.r.niv+\" st-\"+st+(berører?\" hl\":\"\")+(v&&!fokus&&!berører?\" dim\":\"\")+((fokus||berører||(!v&&V.filter===1))?\" vislabel\":\"\"));\n  }\n  const fst = ftTrin(); document.body.classList.toggle(\"ftaktiv\", !!fst);\n  if(fst){\n    const told = ftTold(), ny = new Set(fst.type===\"b\" ? fst.rel : []);\n    const nyN = new Set(); ny.forEach(rid=>{ nyN.add(RI[rid].fra); nyN.add(RI[rid].til); });\n    for(const id in nodeEl){ const g=nodeEl[id].g; g.classList.remove(\"dim\"); g.classList.toggle(\"ft-senere\", !told.has(id)); g.classList.toggle(\"ft-ny\", nyN.has(id)); }\n    for(const rid in kantEl){ const g=kantEl[rid].g, r=kantEl[rid].r; g.classList.remove(\"dim\",\"hl\");\n      const kendt = told.has(r.fra) && told.has(r.til);\n      g.classList.toggle(\"ft-senere\", !kendt); g.classList.toggle(\"ft-ny\", ny.has(rid)); g.classList.toggle(\"vislabel\", ny.has(rid) || (kendt && fst.type===\"tjek\")); }\n  } else { for(const id in nodeEl) nodeEl[id].g.classList.remove(\"ft-senere\",\"ft-ny\"); for(const rid in kantEl) kantEl[rid].g.classList.remove(\"ft-senere\",\"ft-ny\"); }\n  opdaterFremdrift();\n}\n\nfunction opdaterFremdrift(){\n  const RS = turListe().rel.map(id=>RI[id]).filter(Boolean);\n  const tæl={fortalt:0,bekraeftet:0,rettes:0};\n  RS.forEach(r=>{ const s=relStatus(r.id); if(tæl[s]!=null) tæl[s]++; });\n  const n=RS.length||1, pct=x=>(100*x/n).toFixed(2)+\"%\", alle=tæl.fortalt+tæl.bekraeftet+tæl.rettes;\n  $(\"#fremdrift\").innerHTML =\n    `\u003cspan title=\"Bekræftet ${tæl.bekraeftet}, skal rettes ${tæl.rettes}, fortalt ${tæl.fortalt}\">\u003cb>${alle}\u003c/b> af ${RS.length} relationer gennemgået, \u003cb>${Math.round(100*alle/n)}%\u003c/b>\u003c/span>\n     \u003cspan class=\"bar\">\u003ci style=\"width:${pct(tæl.bekraeftet)};background:var(--st-ok)\">\u003c/i>\u003ci style=\"width:${pct(tæl.rettes)};background:var(--st-rettes)\">\u003c/i>\u003ci style=\"width:${pct(tæl.fortalt)};background:var(--st-fortalt)\">\u003c/i>\u003c/span>`;\n}\n\n/* ---------- zoom og panorering ---------- */\nfunction anvendT(){ verden.setAttribute(\"transform\",`translate(${V.tx},${V.ty}) scale(${V.k})`); }\nfunction tilpas(P, blødt){\n  P = P || V.pos; const ids=Object.keys(P); if(!ids.length) return;\n  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;\n  ids.forEach(id=>{const p=P[id]; x0=Math.min(x0,p.x-p.w/2); y0=Math.min(y0,p.y-p.h/2); x1=Math.max(x1,p.x+p.w/2); y1=Math.max(y1,p.y+p.h/2);});\n  const pad = V.visning===\"fokus\"?60:70; x0-=pad; y0-=pad+40; x1+=pad; y1+=pad;\n  const W=svg.clientWidth, H=svg.clientHeight;\n  const k=Math.min(W/(x1-x0), H/(y1-y0), V.visning===\"fokus\"?1.5:1.2);\n  const mål={k, tx:W/2-k*(x0+x1)/2, ty:H/2-k*(y0+y1)/2};\n  if(!blødt){ Object.assign(V,mål); anvendT(); return; }\n  const s={k:V.k,tx:V.tx,ty:V.ty}, t0=performance.now();\n  const f=now=>{ const u=Math.min(1,(now-t0)/520), e=1-Math.pow(1-u,3);\n    V.k=s.k+(mål.k-s.k)*e; V.tx=s.tx+(mål.tx-s.tx)*e; V.ty=s.ty+(mål.ty-s.ty)*e; anvendT(); if(u\u003c1) requestAnimationFrame(f); };\n  requestAnimationFrame(f);\n}\nfunction zoom(f, cx, cy){\n  const W=svg.clientWidth, H=svg.clientHeight; cx=cx??W/2; cy=cy??H/2;\n  const k=Math.max(.08,Math.min(5,V.k*f)); const r=k/V.k;\n  V.tx=cx-(cx-V.tx)*r; V.ty=cy-(cy-V.ty)*r; V.k=k; anvendT();\n}\nsvg.addEventListener(\"wheel\",e=>{ e.preventDefault(); const b=svg.getBoundingClientRect(); zoom(Math.exp(-e.deltaY*0.0015), e.clientX-b.left, e.clientY-b.top); },{passive:false});\nlet træk=null;\nsvg.addEventListener(\"pointerdown\",e=>{ træk={x:e.clientX,y:e.clientY,tx:V.tx,ty:V.ty,flyttet:false}; });\nwindow.addEventListener(\"pointermove\",e=>{ if(!træk) return; const dx=e.clientX-træk.x, dy=e.clientY-træk.y;\n  if(Math.abs(dx)+Math.abs(dy)>4){ træk.flyttet=true; svg.classList.add(\"drag\"); }\n  if(træk.flyttet){ V.tx=træk.tx+dx; V.ty=træk.ty+dy; anvendT(); } });\nwindow.addEventListener(\"pointerup\",()=>{ setTimeout(()=>{ træk=null; },0); svg.classList.remove(\"drag\"); });\nsvg.addEventListener(\"click\",e=>{ if(træk&&træk.flyttet) return; if(V.visning===\"overblik\"&&V.valgt){ V.valgt=null; opdaterMarkering(); visPanel(); } }, true);\nsvg.addEventListener(\"click\",e=>{ if(træk&&træk.flyttet){ e.stopPropagation(); } }, true);\n$(\"#zoomind\").onclick=()=>zoom(1.25); $(\"#zoomud\").onclick=()=>zoom(0.8); $(\"#tilpas\").onclick=()=>tilpas(null,true);\n\n/* ---------- handlinger ---------- */\nfunction klikBegreb(id){\n  if(træk&&træk.flyttet) return;\n  if(FT.aktiv){ FT.aktiv=false; }\n  if(V.visning===\"fokus\"){\n    if(id===V.valgt) return;\n    V.historik.push(V.valgt); V.valgt=id; byg(); visPanel(); opdaterFokusbar();\n  } else {\n    V.valgt = id; opdaterMarkering(); visPanel();\n  }\n}\nfunction vælg(id, fokus){\n  FT.aktiv=false;\n  if(fokus || V.visning===\"fokus\"){\n    if(V.visning===\"fokus\" && V.valgt && V.valgt!==id) V.historik.push(V.valgt);\n    V.valgt=id; sætVisning(\"fokus\");\n  } else {\n    // sørg for at begrebet er synligt i overblik\n    if(!synlige().includes(id)){ V.skjulteDom.delete(B[id].omraade); if(B[id].niv>V.filter) sætFilter(B[id].niv,true); byg(); tegnLegende(); }\n    V.valgt=id; opdaterMarkering(); visPanel();\n    const p=V.pos[id]||maalPos()[id]; if(p){ const W=svg.clientWidth,H=svg.clientHeight; const k=Math.max(V.k,.8);\n      const s={k:V.k,tx:V.tx,ty:V.ty}, m={k,tx:W/2-k*p.x,ty:H/2-k*p.y}, t0=performance.now();\n      const f=now=>{const u=Math.min(1,(now-t0)/450),e=1-Math.pow(1-u,3); V.k=s.k+(m.k-s.k)*e; V.tx=s.tx+(m.tx-s.tx)*e; V.ty=s.ty+(m.ty-s.ty)*e; anvendT(); if(u\u003c1) requestAnimationFrame(f);};\n      requestAnimationFrame(f); }\n  }\n  visPanel();\n}\nfunction sætVisning(v){\n  if(v===\"fokus\" && !V.valgt){ toast(\"Vælg først et begreb\"); v=\"overblik\"; }\n  if(v===\"overblik\") V.historik=[];\n  V.visning=v;\n  document.querySelectorAll(\"#visning button\").forEach(b=>b.classList.toggle(\"on\",b.dataset.v===v));\n  byg(); opdaterFokusbar();\n}\nfunction sætFilter(f, stille){\n  if(f!==V.filter){ FT.aktiv=false; FT.i=-1; }\n  V.filter=f; gemUI();\n  document.querySelectorAll(\"#filter button\").forEach(b=>b.classList.toggle(\"on\",+b.dataset.v===f));\n  if(!stille) byg();\n}\nfunction opdaterFokusbar(){\n  const fb=$(\"#fokusbar\"); fb.classList.toggle(\"vis\", V.visning===\"fokus\");\n  $(\"#tilbage\").disabled=!V.historik.length;\n  const sti=V.historik.slice(-4).map((id,i,a)=>`\u003ca data-i=\"${V.historik.length-a.length+i}\">${esc(B[id].navn)}\u003c/a>`).join(\" › \");\n  $(\"#sti\").innerHTML = (sti? sti+\" › \" : \"\") + \"\u003cb>\"+esc(V.valgt?B[V.valgt].navn:\"\")+\"\u003c/b>\";\n  $(\"#sti\").querySelectorAll(\"a\").forEach(a=>a.onclick=()=>{ const i=+a.dataset.i; V.valgt=V.historik[i]; V.historik=V.historik.slice(0,i); byg(); visPanel(); opdaterFokusbar(); });\n}\n$(\"#tilbage\").onclick=()=>{ if(!V.historik.length) return; V.valgt=V.historik.pop(); byg(); visPanel(); opdaterFokusbar(); };\n$(\"#udfokus\").onclick=()=>sætVisning(\"overblik\");\ndocument.querySelectorAll(\"#visning button\").forEach(b=>b.onclick=()=>sætVisning(b.dataset.v));\ndocument.querySelectorAll(\"#filter button\").forEach(b=>b.onclick=()=>sætFilter(+b.dataset.v));\n\n/* ---------- legende ---------- */\nfunction tegnLegende(){\n  const l=$(\"#legende\");\n  l.innerHTML = domaener.map(d=>`\u003cspan class=\"chip${V.skjulteDom.has(d)?\" off\":\"\"}${D.begreber.some(b=>b.omraade===d&&NIV(b.vaesentlighed)===1)?\"\":\" ingen-ess\"}\" data-d=\"${esc(d)}\" title=\"Klik for at skjule/vise\">\u003ci style=\"background:${farve[d][0]};border:1px solid ${farve[d][1]}\">\u003c/i>${esc(d)}\u003c/span>`).join(\"\")\n   + `\u003cspan class=\"stl\">\u003ci style=\"background:var(--st-fortalt)\">\u003c/i>Gennemgået\u003c/span>\u003cspan class=\"stl\">\u003ci style=\"background:var(--st-ok)\">\u003c/i>Bekræftet\u003c/span>\u003cspan class=\"stl\">\u003ci style=\"background:var(--st-rettes)\">\u003c/i>Skal rettes\u003c/span>\u003cspan class=\"stl\">\u003ci style=\"border-top:2px dashed #888;height:0\">\u003c/i>Stiplet boks/linje = ubetydelig\u003c/span>\u003cspan class=\"stl\">▷ er en slags, ◇ består af\u003c/span>`;\n  l.querySelectorAll(\".chip\").forEach(c=>c.onclick=()=>{ const d=c.dataset.d; V.skjulteDom.has(d)?V.skjulteDom.delete(d):V.skjulteDom.add(d); tegnLegende(); if(V.visning===\"overblik\") byg(); });\n}\n\n/* ---------- panel ---------- */\nconst panel=$(\"#panel\");\nfunction visPanel(){\n  if(FT && FT.aktiv && OV.mode===\"model\" && FT.i>=0){ panel.innerHTML = fortaelPanel(); return; }\n  const id=V.valgt;\n  if(!id){ visPanel.sidst=null;\n    panel.innerHTML=`\u003cdiv class=\"tom\">\u003cdiv class=\"ftstart\">\u003ch3>Fortæl modellen\u003c/h3>\u003cp>Vi går ét område ad gangen og starter med det simpleste. For hvert begreb læser vi definitionen og de nye relationer, og efter hvert område tager vi et enighedstjek.\u003c/p>\u003cbutton id=\"ftstart\">Start fortællingen ▶\u003c/button>\u003c/div>\n      \u003ch2>Sådan bruges modellen\u003c/h2>\n      \u003cp>Klik på et begreb for at se forklaringen og dets relationer.\u003c/p>\n      \u003cp>Klik på en relation, når den er fortalt. Marker derefter, om forretningen \u003cb>bekræfter\u003c/b> den, eller om den \u003cb>skal rettes\u003c/b>, og skriv en kommentar.\u003c/p>\n      \u003cp>\u003cb>Fokus\u003c/b> viser kun det valgte begreb og dets naboer. Klik på en nabo for at gå videre. Filteret gælder også her, så \u003cb>Væsentlige\u003c/b> kun viser de væsentlige relationer.\u003c/p>\n      \u003cp>\u003cb>Væsentlige\u003c/b> viser de væsentlige begreber og relationer. \u003cb>+ Mindre væsentlige\u003c/b> og \u003cb>Alle\u003c/b> viser mere af listen. Klik på et område i linjen øverst for at skjule det.\u003c/p>\n      \u003cp>Status gemmes automatisk i denne browser. Brug \u003cb>Eksport\u003c/b> efter workshoppen.\u003c/p>\n      \u003cp>\u003cb>◀ ▶\u003c/b> øverst går gennem begreberne i den aftalte rækkefølge. En præsentationsklikker virker også.\u003c/p>\n      \u003cp>Under hvert begreb kan du markere beskrivelsen som bekræftet eller skal rettes, skrive forretningens formulering og tilføje noter med tidspunkt, så de kan holdes op mod optagelsen.\u003c/p>\n      \u003cp class=\"kb\">Genveje: \u003ckbd>N\u003c/kbd>/\u003ckbd>P\u003c/kbd> næste/forrige, \u003ckbd>/\u003c/kbd> søg, \u003ckbd>F\u003c/kbd> fokus, \u003ckbd>Esc\u003c/kbd> tilbage, \u003ckbd>+\u003c/kbd>/\u003ckbd>−\u003c/kbd> zoom, \u003ckbd>0\u003c/kbd> tilpas\u003c/p>\n      \u003cp style=\"font-size:.85em\">Data: ${esc(D.meta.kilde||\"\")}, genereret ${esc(D.meta.genereret||\"\")}, ${D.begreber.length} begreber, ${R.length} relationer\u003c/p>\u003c/div>\n      ${noteSektion(\"_\", (S.begreber._||{}).noter||[]).replace(\"Noter til fremlæggelsen\",\"Generelle noter til fremlæggelsen\")}`;\n    bindNoter(\"_\");\n    return;\n  }\n  const nyt = visPanel.sidst!==id; visPanel.sidst=id;\n  const b=B[id], [fy,st]=farve[b.omraade];\n  const felt=(navn,v,aaben)=> v ? `\u003cdetails${aaben?\" open\":\"\"}>\u003csummary>${navn}\u003c/summary>\u003cp>${esc(v)}\u003c/p>\u003c/details>` : \"\";\n  const uaf=(D.uafklarede||[]).filter(u=>u.begreber.includes(id));\n  const srt=a=>a.sort((x,y)=>x.niv-y.niv);\n  const ud=relAf[id].filter(r=>r.fra===id&&r.niv\u003c=V.filter), ind=relAf[id].filter(r=>r.til===id&&r.fra!==id&&r.niv\u003c=V.filter), alleRel=srt([...ud,...ind]);\n  const o=S.begreber[id]||{}, bst=o.status||\"\";\n  const noter=o.noter||[];\n  panel.innerHTML=`\n   \u003cdiv class=\"ph\">\u003ch2>${esc(b.navn)}\u003c/h2>\n     \u003cdiv class=\"tags\">\u003cspan class=\"tag\">${esc(b.id)}\u003c/span>\u003cspan class=\"tag\" style=\"background:${fy};border-color:${st}\">${esc(b.omraade)}\u003c/span>\u003cspan class=\"tag niv${b.niv}\">${NIVTXT[b.niv]}\u003c/span>${b.type?`\u003cspan class=\"tag\">${esc(b.type)}\u003c/span>`:\"\"}${b.aendring?`\u003cspan class=\"tag\">${esc(b.aendring===\"Ny\"?\"Ny i V5\":b.aendring)}\u003c/span>`:\"\"}${b.vurdering?`\u003cspan class=\"tag\" style=\"background:#fff7e6\">Vurdering: ${esc(b.vurdering)}\u003c/span>`:\"\"}\u003c/div>\u003c/div>\n   \u003cdiv class=\"sek\">\u003cdiv class=\"def${o.defNy?\" gl\":\"\"}\">${esc(b.definition)}\u003c/div>\n     ${o.defNy?`\u003cdiv class=\"defny\">\u003cb>Rettet beskrivelse:\u003c/b> ${esc(o.defNy)}\u003c/div>`:\"\"}\n     \u003cdiv class=\"lin vurd\">\u003cspan class=\"stt\">Beskrivelsen: ${STATUSTXT[bst]}\u003c/span>\u003cspan class=\"knp\">\n       \u003cbutton data-bs=\"bekraeftet\" class=\"ok${bst===\"bekraeftet\"?\" on\":\"\"}\">✓ Bekræftet\u003c/button>\u003cbutton data-bs=\"rettes\" class=\"ret${bst===\"rettes\"?\" on\":\"\"}\">✎ Skal rettes\u003c/button>\u003c/span>\u003c/div>\n     \u003cdiv id=\"retboks\" style=\"display:${bst===\"rettes\"||o.defNy?\"block\":\"none\"}\">\u003clabel>Rettet beskrivelse (forretningens formulering)\u003c/label>\u003ctextarea id=\"defny\">${esc(o.defNy||b.definition)}\u003c/textarea>\u003c/div>\n   \u003c/div>\n   \u003cdiv class=\"sek\">\n     ${felt(\"Uddybning og eksempler\",b.uddybning,true)}\n     ${felt(\"Hverdagsord og synonymer\",b.synonymer,true)}${felt(\"Ikke at forveksle med\",b.ikkeForveksle,true)}\n     ${felt(\"Hvorfor \"+NIVTXT[b.niv].toLowerCase(),b.begrundelse)}\n     ${uaf.map(u=>`\u003cdiv class=\"uaf\">\u003cb>Uafklaret ${esc(u.id)}: ${esc(u.emne)}\u003c/b>${esc(u.uklart)}\u003cbr>\u003ci>Anbefaling:\u003c/i> ${esc(u.anbefaling)}${u.beslutning?`\u003cbr>\u003ci>Beslutning:\u003c/i> ${esc(u.beslutning)}`:\"\"}\u003c/div>`).join(\"\")}\n   \u003c/div>\n   \u003cdiv class=\"sek\">\u003ch3>\u003cspan>Relationer (${ud.length+ind.length})\u003c/span>\u003cspan>\n     \u003cbutton class=\"btn small\" id=\"alleFortalt\" title=\"Marker alle ikke-gennemgåede som gennemgået\">Alle fortalt\u003c/button>\n     ${V.visning!==\"fokus\"?`\u003cbutton class=\"btn small\" id=\"tilFokus\">Fokus\u003c/button>`:\"\"}\u003c/span>\u003c/h3>\n     ${alleRel.map(relKort).join(\"\")}\n     ${!ud.length&&!ind.length?`\u003cdiv class=\"ul\">Begrebet har ingen relationer i listen.\u003c/div>`:\"\"}\n   \u003c/div>\n   ${noteSektion(id, noter)}`;\n  panel.querySelectorAll(\".rel\").forEach(kort=>{\n    const rid=kort.dataset.r;\n    kort.addEventListener(\"click\",e=>{\n      if(e.target.closest(\"button,textarea,a\")) return;\n      const s=relStatus(rid);\n      if(s===\"\"){ saetRel(rid,\"status\",\"fortalt\"); } else if(s===\"fortalt\"){ saetRel(rid,\"status\",\"\"); }\n      pulser(rid); opdaterRel(rid);\n    });\n    kort.addEventListener(\"mouseenter\",()=>{ const k=kantEl[rid]; if(k) k.g.classList.add(\"puls\"); });\n    kort.addEventListener(\"mouseleave\",()=>{ const k=kantEl[rid]; if(k) k.g.classList.remove(\"puls\"); });\n    kort.querySelectorAll(\"button[data-s]\").forEach(bt=>bt.onclick=()=>{\n      const ny=bt.dataset.s; saetRel(rid,\"status\", relStatus(rid)===ny ? (ny===\"fortalt\"?\"\":\"fortalt\") : ny);\n      opdaterRel(rid); if(ny===\"rettes\"&&relStatus(rid)===\"rettes\"){ const ta=panel.querySelector(`.rel[data-r=\"${CSS.escape(rid)}\"] textarea`); ta&&ta.focus(); }\n    });\n    kort.querySelectorAll(\"a[data-g]\").forEach(a=>a.onclick=e=>{ e.preventDefault(); vælg(a.dataset.g); });\n    bindKommentar(kort, rid);\n  });\n  const af=$(\"#alleFortalt\"); if(af) af.onclick=()=>{ [...ud,...ind].forEach(r=>{ if(!relStatus(r.id)) saetRel(r.id,\"status\",\"fortalt\"); }); visPanel(); opdaterMarkering(); };\n  if(nyt) panel.scrollTop=0;\n  const tf=$(\"#tilFokus\"); if(tf) tf.onclick=()=>sætVisning(\"fokus\");\n  panel.querySelectorAll(\"button[data-bs]\").forEach(bt=>bt.onclick=()=>{\n    const ny=bt.dataset.bs, ob=(S.begreber[id]=S.begreber[id]||{});\n    ob.status = ob.status===ny ? \"\" : ny; ob.tid=new Date().toISOString(); gem(); visPanel(); opdaterMarkering();\n    if(ob.status===\"rettes\"){ const t=$(\"#defny\"); t&&t.focus(); }\n  });\n  const dn=$(\"#defny\"); if(dn) dn.addEventListener(\"change\",()=>{ const ob=(S.begreber[id]=S.begreber[id]||{}); const v=dn.value.trim();\n    ob.defNy = (v && v!==b.definition) ? v : \"\"; ob.tid=new Date().toISOString(); gem(); visPanel(); });\n  bindNoter(id);\n}\nfunction nuTid(){ const d=new Date(), p=n=>String(n).padStart(2,\"0\"); return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; }\nfunction noteSektion(id, noter){\n  return `\u003cdiv class=\"sek noter\">\u003ch3>Noter til fremlæggelsen\u003c/h3>\n    \u003cul>${noter.map((n,i)=>`\u003cli>\u003ctime>${esc(n.kl)}\u003c/time>\u003cspan>${esc(n.tekst)}\u003c/span>\u003cbutton data-slet=\"${i}\" title=\"Slet note\">×\u003c/button>\u003c/li>`).join(\"\")}\u003c/ul>\n    \u003clabel>Ny note (Enter gemmer, tidspunktet kommer på automatisk)\u003c/label>\u003ctextarea id=\"nynote\" placeholder=\"Fx 'Salg kalder det også en ordre'\">\u003c/textarea>\u003c/div>`;\n}\nfunction bindNoter(id){\n  const ta=$(\"#nynote\"); if(!ta) return;\n  ta.addEventListener(\"keydown\",e=>{ if(e.key===\"Enter\" && !e.shiftKey){ e.preventDefault(); const t=ta.value.trim(); if(!t) return;\n    const ob=(S.begreber[id]=S.begreber[id]||{}); (ob.noter=ob.noter||[]).push({kl:nuTid(), tid:new Date().toISOString(), tekst:t}); gem(); visPanel(); const n=$(\"#nynote\"); n&&n.focus(); } });\n  panel.querySelectorAll(\"button[data-slet]\").forEach(bt=>bt.onclick=()=>{ const ob=S.begreber[id]; ob.noter.splice(+bt.dataset.slet,1); gem(); visPanel(); });\n}\nfunction bindKommentar(kort, rid){\n  const ta=kort.querySelector(\"textarea\"); if(!ta) return;\n  ta.addEventListener(\"input\",()=>saetRel(rid,\"kommentar\",ta.value));\n}\nfunction relKort(r){\n  const s=relStatus(r.id), o=S.relationer[r.id]||{}, v=V.valgt;\n  const navn=id=> id===v ? `\u003cspan class=\"selv\">${esc(B[id].navn)}\u003c/span>` : `\u003ca href=\"#\" data-g=\"${esc(id)}\">${esc(B[id].navn)}\u003c/a>`;\n  const visKom = s===\"rettes\" || o.kommentar;\n  return `\u003cdiv class=\"rel st-${s||\"none\"}\" data-r=\"${esc(r.id)}\" title=\"Klik for at markere som fortalt\">\n    \u003cdiv class=\"saet\">${navn(r.fra)} \u003cspan class=\"vb\">${esc(r.label)}\u003c/span> ${navn(r.til)}\u003c/div>\n    \u003cdiv class=\"lin\">\u003cspan class=\"stt\">${STATUSTXT[s]}, \u003cspan class=\"niv${r.niv}\">${NIVTXT[r.niv].toLowerCase()}\u003c/span>\u003c/span>\n      \u003cspan class=\"knp\">\u003cbutton data-s=\"fortalt\" class=\"ft${s===\"fortalt\"?\" on\":\"\"}\">Fortalt\u003c/button>\u003cbutton data-s=\"bekraeftet\" class=\"ok${s===\"bekraeftet\"?\" on\":\"\"}\">✓ Bekræftet\u003c/button>\u003cbutton data-s=\"rettes\" class=\"ret${s===\"rettes\"?\" on\":\"\"}\">✎ Skal rettes\u003c/button>\u003c/span>\u003c/div>\n    ${visKom?`\u003ctextarea placeholder=\"Hvad skal rettes?\">${esc(o.kommentar||\"\")}\u003c/textarea>`:\"\"}\n    ${r.bemaerkning ? `\u003cdiv class=\"kilde\">${esc(r.bemaerkning)}\u003c/div>`:\"\"}\n  \u003c/div>`;\n}\nfunction opdaterRel(rid){\n  const gl=panel.querySelector(`.rel[data-r=\"${CSS.escape(rid)}\"]`);\n  if(gl){ const tmp=document.createElement(\"div\"); tmp.innerHTML=relKort(RI[rid]); const ny=tmp.firstElementChild; gl.replaceWith(ny);\n    // genbind\n    ny.addEventListener(\"click\",e=>{ if(e.target.closest(\"button,textarea,a\")) return; const s=relStatus(rid); if(s===\"\") saetRel(rid,\"status\",\"fortalt\"); else if(s===\"fortalt\") saetRel(rid,\"status\",\"\"); pulser(rid); opdaterRel(rid); });\n    ny.addEventListener(\"mouseenter\",()=>{ const k=kantEl[rid]; if(k) k.g.classList.add(\"puls\"); });\n    ny.addEventListener(\"mouseleave\",()=>{ const k=kantEl[rid]; if(k) k.g.classList.remove(\"puls\"); });\n    ny.querySelectorAll(\"button[data-s]\").forEach(bt=>bt.onclick=()=>{ const n=bt.dataset.s; saetRel(rid,\"status\", relStatus(rid)===n ? (n===\"fortalt\"?\"\":\"fortalt\") : n); opdaterRel(rid); if(relStatus(rid)===\"rettes\"){ const ta=panel.querySelector(`.rel[data-r=\"${CSS.escape(rid)}\"] textarea`); ta&&ta.focus(); } });\n    ny.querySelectorAll(\"a[data-g]\").forEach(a=>a.onclick=e=>{ e.preventDefault(); vælg(a.dataset.g); });\n    bindKommentar(ny, rid);\n  }\n  opdaterMarkering();\n}\nfunction pulser(rid){ const k=kantEl[rid]; if(!k) return; k.g.classList.add(\"puls\"); setTimeout(()=>k.g.classList.remove(\"puls\"),700); }\n\n/* ---------- søgning ---------- */\nconst sog=$(\"#sog\"), sogres=$(\"#sogres\"); let sogAkt=0, sogListe=[];\nfunction norm(s){ return (s||\"\").toLowerCase(); }\nsog.addEventListener(\"input\",()=>{\n  const q=norm(sog.value.trim());\n  if(!q){ sogres.style.display=\"none\"; return; }\n  sogListe = D.begreber.map(b=>{ const n=norm(b.navn); let sc = n===q?0 : n.startsWith(q)?1 : n.includes(q)?2 : norm(b.synonymer).includes(q)?3 : norm(b.id)===q?0 : -1; return [sc,b]; })\n    .filter(x=>x[0]>=0).sort((a,b)=>a[0]-b[0]||a[1].navn.localeCompare(b[1].navn,\"da\")).slice(0,12).map(x=>x[1]);\n  sogAkt=0; tegnSog();\n});\nfunction tegnSog(){\n  if(!sogListe.length){ sogres.innerHTML=`\u003cdiv>\u003csmall>Ingen begreber fundet\u003c/small>\u003c/div>`; sogres.style.display=\"block\"; return; }\n  sogres.innerHTML=sogListe.map((b,i)=>`\u003cdiv data-id=\"${b.id}\" class=\"${i===sogAkt?\"akt\":\"\"}\">${esc(b.navn)} \u003csmall>${esc(b.id)}, ${esc(b.omraade)}\u003c/small>\u003c/div>`).join(\"\");\n  sogres.style.display=\"block\";\n  sogres.querySelectorAll(\"div[data-id]\").forEach(d=>d.onmousedown=e=>{ e.preventDefault(); vælgSog(d.dataset.id); });\n}\nfunction vælgSog(id){ sogres.style.display=\"none\"; sog.value=\"\"; sog.blur(); vælg(id); }\nsog.addEventListener(\"keydown\",e=>{\n  if(e.key===\"ArrowDown\"){ sogAkt=Math.min(sogListe.length-1,sogAkt+1); tegnSog(); e.preventDefault(); }\n  else if(e.key===\"ArrowUp\"){ sogAkt=Math.max(0,sogAkt-1); tegnSog(); e.preventDefault(); }\n  else if(e.key===\"Enter\" && sogListe[sogAkt]) vælgSog(sogListe[sogAkt].id);\n  else if(e.key===\"Escape\"){ sog.value=\"\"; sogres.style.display=\"none\"; sog.blur(); }\n});\nsog.addEventListener(\"blur\",()=>setTimeout(()=>sogres.style.display=\"none\",150));\n\n/* ---------- tastatur ---------- */\ndocument.addEventListener(\"keydown\",e=>{\n  if(e.target.matches(\"input,textarea\")) return;\n  if(e.key===\"/\"){ e.preventDefault(); sog.focus(); }\n  else if(e.key===\"f\"||e.key===\"F\"){ sætVisning(V.visning===\"fokus\"?\"overblik\":\"fokus\"); }\n  else if(e.key===\"Escape\"){ if(V.visning===\"fokus\") sætVisning(\"overblik\"); else if(V.valgt){ V.valgt=null; opdaterMarkering(); visPanel(); } }\n  else if(e.key===\"+\"||e.key===\"=\") zoom(1.25);\n  else if(e.key===\"-\") zoom(0.8);\n  else if(e.key===\"0\") tilpas(null,true);\n  else if(e.key===\"Backspace\" && V.visning===\"fokus\") $(\"#tilbage\").click();\n});\n\n/* ---------- skærm ---------- */\nfunction anvendSkala(){ document.documentElement.style.setProperty(\"--s\",V.skala); gemUI(); }\n$(\"#stoerre\").onclick=()=>{ V.skala=Math.min(1.8,+(V.skala+0.1).toFixed(2)); anvendSkala(); };\n$(\"#mindre\").onclick=()=>{ V.skala=Math.max(0.8,+(V.skala-0.1).toFixed(2)); anvendSkala(); };\n$(\"#fuld\").onclick=()=>{ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); };\n$(\"#panelknap\").onclick=()=>{ $(\"#main\").classList.toggle(\"lukket\"); setTimeout(()=>tilpas(null,true),60); };\nwindow.addEventListener(\"resize\",()=>{ clearTimeout(window.__rz); window.__rz=setTimeout(()=>tilpas(null,false),150); });\n\n/* ---------- eksport / import ---------- */\nconst menu=$(\"#menu\");\nmenu.querySelector(\".btn\").onclick=e=>{ e.stopPropagation(); menu.classList.toggle(\"aaben\"); };\ndocument.addEventListener(\"click\",()=>menu.classList.remove(\"aaben\"));\nfunction dato(){ const d=new Date(), p=n=>String(n).padStart(2,\"0\"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }\nfunction hent(navn, indhold, type){\n  const blob=new Blob([indhold],{type}); const a=document.createElement(\"a\");\n  a.href=URL.createObjectURL(blob); a.download=navn; document.body.append(a); a.click();\n  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500);\n}\nfunction csvFelt(v){ v=String(v==null?\"\":v); return /[\";\\n\\r]/.test(v) ? `\"${v.replace(/\"/g,'\"\"')}\"` : v; }\nfunction eksportCSV(){\n  const rk=[[\"Type\",\"ID\",\"Fra-ID\",\"Fra\",\"Relation\",\"Til-ID\",\"Til\",\"Læst som sætning\",\"Væsentlighed\",\"Område (fra)\",\"Status\",\"Kommentar\",\"Tidspunkt\"]];\n  const orden={rettes:0,bekraeftet:1,fortalt:2,\"\":3};\n  [...R].sort((a,b)=>orden[relStatus(a.id)]-orden[relStatus(b.id)]||a.fra.localeCompare(b.fra,\"da\",{numeric:true})).forEach(r=>{\n    const o=S.relationer[r.id]||{};\n    rk.push([\"Relation\",r.id,r.fra,B[r.fra].navn,r.label,r.til,B[r.til].navn,r.saetning||`${B[r.fra].navn} ${r.label} ${B[r.til].navn}`,NIVTXT[r.niv],B[r.fra].omraade,STATUSTXT[o.status||\"\"],o.kommentar||\"\",o.tid||\"\"]);\n  });\n  D.begreber.forEach(b=>{ const o=S.begreber[b.id]; if(!o) return;\n    if(o.status||o.defNy) rk.push([\"Begreb\",b.id,b.id,b.navn,\"\",\"\",\"\",o.defNy?\"Rettet beskrivelse: \"+o.defNy:b.definition,NIVTXT[b.niv],b.omraade,STATUSTXT[o.status||\"\"],o.defNy||\"\",o.tid||\"\ or:\"smooth\",block:\"nearest\"}); }\n/* ---------- skift mellem model og øvelser ---------- */\nfunction sætMode(m){\n  OV.mode = m; V.valgt = null;\n  document.querySelectorAll(\"#ovmode button\").forEach(b=>b.classList.toggle(\"on\", b.dataset.m===m));\n  try{ parent.hlMode && parent.hlMode(m); }catch(e){}\n  document.body.classList.toggle(\"ovaktiv\", m!==\"model\"); document.body.classList.toggle(\"ov3\", m===\"o3\");\n  if($(\"#main\").classList.contains(\"lukket\")) $(\"#main\").classList.remove(\"lukket\");\n  if(m===\"model\"){ ryd(); byg(); }\n  visPanel();\n  try{ localStorage.setItem(LAGER+\"-ov\", JSON.stringify({mode:OV.mode, dom:OV.dom, rejse:OV.rejse})); }catch(e){}\n}\ndocument.querySelectorAll(\"#ovmode button\").forEach(b=>b.onclick=()=>sætMode(b.dataset.m));\nfunction gaaTil(i){\n  if(OV.mode===\"o3\") OV.dom = Math.max(0, Math.min(DOM3.length-1, i));\n  if(OV.mode===\"o4\") OV.rejse = Math.max(0, Math.min(OV4.length-1, i));\n  V.valgt = null; visPanel(); panel.scrollTop = 0;\n  try{ localStorage.setItem(LAGER+\"-ov\", JSON.stringify({mode:OV.mode, dom:OV.dom, rejse:OV.rejse})); }catch(e){}\n}\nconst _tgOv = turGaa;\nturGaa = function(d){\n  if(OV.mode===\"o3\") return gaaTil(OV.dom+d);\n  if(OV.mode===\"o4\") return gaaTil(OV.rejse+d);\n  if(OV.mode===\"ops\") return;\n  _tgOv(d);\n};\nconst _otOv = opdaterTur;\nopdaterTur = function(){\n  if(OV.mode===\"o3\") $(\"#turpos\").textContent = `Domæne ${OV.dom+1} af ${DOM3.length}`;\n  else if(OV.mode===\"o4\") $(\"#turpos\").textContent = `Rejse ${OV.rejse+1} af ${OV4.length}`;\n  else if(OV.mode===\"ops\") $(\"#turpos\").textContent = \"Opsamling\";\n  else _otOv();\n};\n\n/* ---------- panel ---------- */\nconst _vpOv = visPanel;\nvisPanel = function(){\n  if(OV.mode===\"model\"){ _vpOv(); return; }\n  const top = panel.scrollTop;\n  if(OV.mode===\"o3\") panel.innerHTML = panel3();\n  else if(OV.mode===\"o4\") panel.innerHTML = panel4();\n  else panel.innerHTML = panelOps();\n  bindOv();\n  opdaterTur();\n  panel.scrollTop = visPanel.ovSidst===OV.mode+OV.dom+\"/\"+OV.rejse ? top : 0;\n  visPanel.ovSidst = OV.mode+OV.dom+\"/\"+OV.rejse;\n};\n\nfunction valgtKort(){\n  const id = V.valgt; if(!id) return \"\";\n  const b = B[id], [fy,st] = farve[b.omraade];\n  return `\u003cdiv class=\"ov-valgt\">\n    \u003cdiv class=\"ov-vh\">\u003cb>${esc(b.navn)}\u003c/b>\u003cspan class=\"tag\" style=\"background:${fy};border-color:${st}\">${esc(b.omraade)}\u003c/span>\u003cspan class=\"tag niv${b.niv}\">${NIVTXT[b.niv]}\u003c/span>\n      \u003cbutton class=\"ov-x\" data-luk title=\"Luk\">×\u003c/button>\u003c/div>\n    \u003cdiv class=\"ov-def\">${esc(b.definition)}\u003c/div>\n    ${b.synonymer?`\u003cdiv class=\"ov-mini\">\u003cb>Hverdagsord\u003c/b> ${esc(b.synonymer)}\u003c/div>`:\"\"}\n    ${b.ikkeForveksle?`\u003cdiv class=\"ov-mini\">\u003cb>Ikke at forveksle med\u003c/b> ${esc(b.ikkeForveksle)}\u003c/div>`:\"\"}\n    \u003cbutton class=\"btn small\" data-imodel=\"${esc(id)}\">Se relationerne i modellen\u003c/button>\n  \u003c/div>`;\n}\nfunction stepper(liste, akt, mrk){\n  return `\u003cdiv class=\"ov-step\">${liste.map((t,i)=>`\u003cbutton data-gaa=\"${i}\" class=\"${i===akt?\"on\":\"\"}${mrk(i)?\" faerdig\":\"\"}\" title=\"${esc(t)}\">${esc(t)}\u003c/button>`).join(\"\")}\u003c/div>`;\n}\nfunction fingre(vaerdi, data){\n  return `\u003cdiv class=\"ov-fingre\">\u003cspan>Enighedstjek, vis 1 til 5 fingre\u003c/span>\u003cdiv>${[1,2,3,4,5].map(n=>`\u003cbutton ${data}=\"${n}\" class=\"${vaerdi===n?\"on\":\"\"}\">${n}\u003c/button>`).join(\"\")}\u003c/div>\u003c/div>`;\n}\nfunction navKnapper(i, n, tekst){\n  return `\u003cdiv class=\"ov-nav\">\u003cbutton class=\"btn small\" data-gaa=\"${i-1}\" ${i===0?\"disabled\":\"\"}>◀ Forrige\u003c/button>\u003cspan>${tekst}\u003c/span>\u003cbutton class=\"btn small dark\" data-gaa=\"${i+1}\" ${i===n-1?\"disabled\":\"\"}>Næste ▶\u003c/button>\u003c/div>`;\n}\nfunction begrebsListeData(){\n  return `\u003cdatalist id=\"ov-alle\">${D.begreber.slice().sort((a,b)=>a.navn.localeCompare(b.navn,\"da\")).map(b=>`\u003coption value=\"${esc(b.navn)}\">`).join(\"\")}\u003c/datalist>`;\n}\nfunction findesTag(navn, id){\n  id = id || idAf(navn); if(!id || !B[id]) return `\u003cspan class=\"tag ov-ny\">NYT BEGREB\u003c/span>`;\n  const b = B[id];\n  const t = b.niv===1 ? \"Er allerede væsentlig\" : `Findes som ${NIVTXT[b.niv].toLowerCase()}`;\n  return `\u003ca href=\"#\" class=\"tag niv${b.niv}\" data-vis=\"${id}\" title=\"${esc(b.omraade)}. Klik for at se definitionen\">${t}\u003c/a>`;\n}\n/* søgefelt til \"Mangler\": finder begreber i hele modellen, også mindre væsentlige og ubetydelige */\nfunction sogFelt(p, ph){\n  return `\u003cdiv class=\"ov-sog\">\u003cinput id=\"${p}navn\" placeholder=\"${ph}\" autocomplete=\"off\">\u003cdiv class=\"ov-res\" id=\"${p}res\">\u003c/div>\u003cdiv class=\"ov-status\" id=\"${p}status\">\u003c/div>\u003c/div>`;\n}\nfunction sogMatch(q){\n  q = q.toLowerCase().trim(); if(!q) return [];\n  return D.begreber.map(b=>{ const n=b.navn.toLowerCase(), sy=(b.synonymer||\"\").toLowerCase();\n      const sc = n===q?0 : n.startsWith(q)?1 : n.includes(q)?2 : sy.includes(q)?3 : -1; return [sc,b]; })\n    .filter(x=>x[0]>=0).sort((a,b)=>a[0]-b[0] || (a[1].niv===1)-(b[1].niv===1) || a[1].navn.localeCompare(b[1].navn,\"da\")).slice(0,8).map(x=>x[1]);\n}\nfunction bindSog(p, tilfoej){\n  const inp=$(\"#\"+p+\"navn\"), res=$(\"#\"+p+\"res\"), st=$(\"#\"+p+\"status\"); if(!inp) return;\n  let liste=[], akt=0;\n  const status=()=>{ const id=inp.dataset.id||idAf(inp.value.trim());\n    if(!inp.value.trim()){ st.innerHTML=\"\"; return; }\n    if(id && B[id]){ const b=B[id]; st.innerHTML = b.niv===1 ? `\u003cb>${esc(b.navn)}\u003c/b> er allerede et væsentligt begreb i ${esc(b.omraade)}.` : `\u003cb>${esc(b.navn)}\u003c/b> findes som ${NIVTXT[b.niv].toLowerCase()} i ${esc(b.omraade)}. \u003ca href=\"#\" data-vis=\"${id}\">Se definitionen\u003c/a>`; }\n    else if(liste.length) st.innerHTML = `Vælg et begreb fra listen, eller tilføj det som \u003cspan class=\"tag ov-ny\">NYT BEGREB\u003c/span>`;\n    else st.innerHTML = `Ingen match i modellen. Tilføjes som \u003cspan class=\"tag ov-ny\">NYT BEGREB\u003c/span>`;\n    st.querySelectorAll(\"[data-vis]\").forEach(a=>a.onmousedown=e=>{ e.preventDefault(); const navn=inp.value, nid=inp.dataset.id; visDef(a.dataset.vis); const ni=$(\"#\"+p+\"navn\"); if(ni){ ni.value=navn; if(nid) ni.dataset.id=nid; ni.dispatchEvent(new Event(\"input\")); } }); };\n  const tegn=()=>{ if(!liste.length){ res.style.display=\"none\"; return; }\n    res.innerHTML = liste.map((b,i)=>`\u003cdiv data-id=\"${b.id}\" class=\"${i===akt?\"akt\":\"\"}\">\u003cb>${esc(b.navn)}\u003c/b> \u003cspan class=\"tag niv${b.niv}\">${NIVTXT[b.niv]}\u003c/span>\u003csmall>${esc(b.omraade)}\u003c/small>\u003c/div>`).join(\"\");\n    res.style.display=\"block\";\n    res.querySelectorAll(\"[data-id]\").forEach(d=>d.onmousedown=e=>{ e.preventDefault(); vaelg(d.dataset.id); }); };\n  const vaelg=id=>{ inp.value=B[id].navn; inp.dataset.id=id; liste=[]; tegn(); status(); };\n  inp.addEventListener(\"input\",()=>{ delete inp.dataset.id; liste=sogMatch(inp.value); akt=0; tegn(); status(); });\n  inp.addEventListener(\"keydown\",e=>{\n    if(e.key===\"ArrowDown\"&&liste.length){ akt=Math.min(liste.length-1,akt+1); tegn(); e.preventDefault(); }\n    else if(e.key===\"ArrowUp\"&&liste.length){ akt=Math.max(0,akt-1); tegn(); e.preventDefault(); }\n    else if(e.key===\"Enter\"){ e.preventDefault(); if(liste.length && res.style.display===\"block\") vaelg(liste[akt].id); else tilfoej(); }\n    else if(e.key===\"Escape\"){ liste=[]; tegn(); } });\n  inp.addEventListener(\"blur\",()=>setTimeout(()=>{ liste=[]; tegn(); },150));\n}\n\n/* Øvelse 3 */\nfunction panel3(){\n  const o = ovS().o3, d = DOM3[OV.dom];\n  const tael = {ok:0, forkert:0};\n  d.ids.forEach(id=>{ const v=(o.beg[id]||{}).v; if(tael[v]!=null) tael[v]++; });\n  const ikke = d.ids.length - tael.ok - tael.forkert;\n  const mangler = o.mangler.map((m,i)=>({...m,i})).filter(m=>m.dom===OV.dom);\n  const fd = (o.dom[OV.dom]||{}).fingre || 0;\n  return `\u003cdiv class=\"ov-hoved\">\u003cdiv class=\"ov-crumb\">Øvelse 3: Giver modellen mening?\u003c/div>\n    ${stepper(DOM3.map((x,i)=>`${i+1} ${x.navn}`), OV.dom, i=>!!(o.dom[i]||{}).fingre)}\n    \u003ch2>${esc(d.navn)}\u003c/h2>\n    \u003cdiv class=\"ov-sub\">${d.ids.length} væsentlig${d.ids.length===1?\"t begreb\":\"e begreber\"}. Vi viser modellen fra gæst til afregning, en kategori af gangen.\u003c/div>\n    \u003cdiv class=\"ov-tal\">\u003cspan class=\"t-ok\">\u003cb>${tael.ok}\u003c/b> giver mening\u003c/span>\u003cspan class=\"t-ret\">\u003cb>${tael.forkert}\u003c/b> forstået eller brugt forkert\u003c/span>\u003cspan>\u003cb>${ikke}\u003c/b> ikke vurderet\u003c/span>\u003cspan class=\"t-mgl\">\u003cb>${mangler.length}\u003c/b> mangler\u003c/span>\u003c/div>\n  \u003c/div>\n  ${valgtKort()}\n  \u003cdiv class=\"sek\">\u003ch3>\u003cspan>Læs begreberne\u003c/span>\u003c/h3>\n    \u003cp class=\"ov-hj\">Kender I ordet, og betyder det det samme hos jer? Klik på navnet for at se definitionen.\u003c/p>\n    \u003cdiv class=\"ov-grid\">${d.ids.map(id=>{ const b=B[id], s=o.beg[id]||{}, v=s.v||\"\"; const aab = OV.aabenDef===id;\n      return `\u003cdiv class=\"ov-row v-${v||\"none\"}\">\n        \u003cdiv class=\"ov-rh\">\u003ca href=\"#\" class=\"ov-navn\" data-def=\"${id}\">${esc(b.navn)}\u003c/a>\u003cspan class=\"ov-type\">${esc(b.type||\"\")}\u003c/span>\u003c/div>\n        ${aab?`\u003cdiv class=\"ov-def\">${esc(b.definition)}\u003c/div>`:\"\"}\n        \u003cdiv class=\"knp\">\u003cbutton data-v3=\"ok\" data-id=\"${id}\" class=\"ok${v===\"ok\"?\" on\":\"\"}\">✓ Giver mening\u003c/button>\u003cbutton data-v3=\"forkert\" data-id=\"${id}\" class=\"ret${v===\"forkert\"?\" on\":\"\"}\">✎ Forstået eller brugt forkert\u003c/button>\u003c/div>\n        ${v===\"forkert\"||s.kom?`\u003ctextarea data-kom3=\"${id}\" placeholder=\"Hvad er forstået eller brugt forkert? Hvad kalder I det?\">${esc(s.kom||\"\")}\u003c/textarea>`:\"\"}\n      \u003c/div>`; }).join(\"\")}\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"sek\">\u003ch3>\u003cspan>Mangler der noget i ${esc(d.navn.toLowerCase())}?\u003c/span>\u003c/h3>\n    \u003cp class=\"ov-hj\">Skriv det, der mangler. Er et mindre væsentligt begreb vigtigt, så skriv det også.\u003c/p>\n    ${mangler.map(m=>`\u003cdiv class=\"ov-mgl\">\u003cdiv>\u003cb>${esc(m.navn)}\u003c/b> ${findesTag(m.navn, m.id)} \u003cspan class=\"tag\">${esc(m.rejse||\"Alle tre\")}\u003c/span>${m.note?`\u003cdiv class=\"ov-mini\">${esc(m.note)}\u003c/div>`:\"\"}\u003c/div>\u003cbutton class=\"ov-x\" data-slet3=\"${m.i}\" title=\"Slet\">×\u003c/button>\u003c/div>`).join(\"\")}\n    \u003cdiv class=\"ov-form\">\n      ${sogFelt(\"m3\",\"Søg eller skriv et nyt begreb\")}\n      \u003cselect id=\"m3rejse\">${REJSER3.map(r=>`\u003coption>${r}\u003c/option>`).join(\"\")}\u003c/select>\n      \u003ctextarea id=\"m3note\" placeholder=\"Hvad dækker det, og hvorfor mangler det?\">\u003c/textarea>\n      \u003cbutton class=\"btn small dark\" id=\"m3add\">Tilføj\u003c/button>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"sek\">${fingre(fd, \"data-f3\")}\u003c/div>\n  \u003cdiv class=\"sek\">${navKnapper(OV.dom, DOM3.length, `Domæne ${OV.dom+1} af ${DOM3.length}`)}\n    \u003cp class=\"ov-hj\" style=\"margin-top:10px\">Vi er i mål, når alle ni domæner er gennemgået, og hver rettelse og hvert hul er skrevet op.\u003c/p>\u003c/div>`;\n}\n\n/* Øvelse 4 */\nfunction panel4(){\n  const r = OV4[OV.rejse], s = r4(r.k), o4 = ovS().o4;\n  const daek = r.vIds.filter(id=>s.daek[id]===\"ja\").length, ikkeD = r.vIds.filter(id=>s.daek[id]===\"nej\").length;\n  return `\u003cdiv class=\"ov-hoved\">\u003cdiv class=\"ov-crumb\">Øvelse 4: Kan alle rejser beskrives med listen?\u003c/div>\n    ${stepper(OV4.map(x=>`${x.k} ${x.navn}`), OV.rejse, i=>{ const z=(o4.rejse[OV4[i].k]||{}).daek||{}; return OV4[i].vIds.every(id=>z[id]); })}\n    \u003ch2>${esc(r.k)}: ${esc(r.navn)}\u003c/h2>\n    \u003cdiv class=\"ov-gruppe\">\u003cspan>Gruppe\u003c/span>${[\"1\",\"2\"].map(g=>`\u003cbutton data-gr=\"${g}\" class=\"${s.gruppe===g?\"on\":\"\"}\">Gruppe ${g}\u003c/button>`).join(\"\")}\u003c/div>\n    \u003cdiv class=\"ov-saer\">\u003cb>Det særlige ved rejsen\u003c/b>\u003cbr>${esc(r.saer)}\u003c/div>\n    \u003cdiv class=\"ov-tal\">\u003cspan class=\"t-ok\">\u003cb>${daek}\u003c/b> dækker\u003c/span>\u003cspan class=\"t-ret\">\u003cb>${ikkeD}\u003c/b> dækker ikke\u003c/span>\u003cspan class=\"t-mgl\">\u003cb>${s.mangler.length}\u003c/b> mangler\u003c/span>\u003c/div>\n  \u003c/div>\n  ${valgtKort()}\n  \u003cdiv class=\"sek\">\u003ch3>\u003cspan>Begreber i modellen\u003c/span>\u003c/h3>\n    \u003cp class=\"ov-hj\">Dækker de væsentlige begreber rejsen? Forslagene er Kvadrants og skal testes i rummet.\u003c/p>\n    \u003cdiv class=\"ov-grid\">${r.vIds.map(id=>{ const b=B[id], v=s.daek[id]||\"\"; const aab=OV.aabenDef===id;\n      return `\u003cdiv class=\"ov-row v-${v===\"ja\"?\"ok\":v===\"nej\"?\"forkert\":\"none\"}\">\n        \u003cdiv class=\"ov-rh\">\u003ca href=\"#\" class=\"ov-navn\" data-def=\"${id}\">${esc(b.navn)}\u003c/a>\u003cspan class=\"ov-type\">${esc(b.omraade)}\u003c/span>\u003c/div>\n        ${aab?`\u003cdiv class=\"ov-def\">${esc(b.definition)}\u003c/div>`:\"\"}\n        \u003cdiv class=\"knp\">\u003cbutton data-d4=\"ja\" data-id=\"${id}\" class=\"ok${v===\"ja\"?\" on\":\"\"}\">✓ Dækker\u003c/button>\u003cbutton data-d4=\"nej\" data-id=\"${id}\" class=\"ret${v===\"nej\"?\" on\":\"\"}\">✎ Dækker ikke\u003c/button>\u003c/div>\n        ${v===\"nej\"||s.kom[id]?`\u003ctextarea data-kom4=\"${id}\" placeholder=\"Hvad dækker det ikke?\">${esc(s.kom[id]||\"\")}\u003c/textarea>`:\"\"}\n      \u003c/div>`; }).join(\"\")}\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"sek\">\u003ch3>\u003cspan>Grå begreber\u003c/span>\u003c/h3>\n    \u003cp class=\"ov-hj\">De findes kun som mindre væsentlige i modellen. Er et af dem så vigtigt, at det skal være væsentligt?\u003c/p>\n    \u003cdiv class=\"ov-grid\">${r.gIds.map(id=>{ const b=B[id], on=!!s.op[id]; const aab=OV.aabenDef===id;\n      return `\u003cdiv class=\"ov-row ov-graarow${on?\" v-op\":\"\"}\">\n        \u003cdiv class=\"ov-rh\">\u003ca href=\"#\" class=\"ov-navn\" data-def=\"${id}\">${esc(b.navn)}\u003c/a>\u003cspan class=\"tag niv${b.niv}\">${NIVTXT[b.niv]}\u003c/span>\u003c/div>\n        ${aab?`\u003cdiv class=\"ov-def\">${esc(b.definition)}\u003c/div>`:\"\"}\n        \u003cdiv class=\"knp\">\u003cbutton data-op=\"${id}\" class=\"ft${on?\" on\":\"\"}\">${on?\"✓ Skal være væsentligt\":\"Skal være væsentligt?\"}\u003c/button>\u003c/div>\n      \u003c/div>`; }).join(\"\")}\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"sek\">\u003ch3>\u003cspan>Mangler vi noget?\u003c/span>\u003c/h3>\n    \u003cp class=\"ov-hj\">Ét begreb pr. felt med en ejer.\u003c/p>\n    ${s.mangler.map((m,i)=>`\u003cdiv class=\"ov-mgl\">\u003cdiv>\u003cb>${esc(m.navn)}\u003c/b> ${findesTag(m.navn, m.id)}${m.ejer?` \u003cspan class=\"tag\">Ejer: ${esc(m.ejer)}\u003c/span>`:` \u003cspan class=\"tag ov-ny\">Mangler ejer\u003c/span>`}${m.note?`\u003cdiv class=\"ov-mini\">${esc(m.note)}\u003c/div>`:\"\"}\u003c/div>\u003cbutton class=\"ov-x\" data-slet4=\"${i}\" title=\"Slet\">×\u003c/button>\u003c/div>`).join(\"\")}\n    \u003cdiv class=\"ov-form\">\n      ${sogFelt(\"m4\",\"Søg eller skriv et nyt begreb\")}\n      \u003cinput id=\"m4ejer\" placeholder=\"Ejer\">\n      \u003ctextarea id=\"m4note\" placeholder=\"Hvad dækker det?\">\u003c/textarea>\n      \u003cbutton class=\"btn small dark\" id=\"m4add\">Tilføj\u003c/button>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"sek\">${navKnapper(OV.rejse, OV4.length, `Rejse ${OV.rejse+1} af ${OV4.length}`)}\u003c/div>\n  \u003cdiv class=\"sek\">${fingre(o4.fingre||0, \"data-f4\")}\n    \u003cp class=\"ov-hj\" style=\"margin-top:8px\">Enighedstjekket gælder hele listen. Vi er i mål, når hver rejse kan beskrives med de væsentlige begreber, eller det, der mangler, er skrevet op med en ejer.\u003c/p>\u003c/div>`;\n}\n\n/* Opsamling */\nfunction panelOps(){\n  const o = ovS(), o3 = o.o3, o4 = o.o4;\n  const forkert = [], ok = [];\n  DOM3.forEach((d,i)=>d.ids.forEach(id=>{ const s=o3.beg[id]||{}; if(s.v===\"forkert\") forkert.push({id,dom:i,kom:s.kom}); if(s.v===\"ok\") ok.push(id); }));\n  const alle3 = DOM3.reduce((a,d)=>a+d.ids.length,0);\n  const mgl4 = [], op4 = [], nej4 = [];\n  OV4.forEach(r=>{ const s=(o4.rejse[r.k])||{daek:{},kom:{},op:{},mangler:[]};\n    (s.mangler||[]).forEach(m=>mgl4.push({...m, k:r.k}));\n    Object.keys(s.op||{}).filter(id=>s.op[id]).forEach(id=>op4.push({id,k:r.k}));\n    r.vIds.filter(id=>(s.daek||{})[id]===\"nej\").forEach(id=>nej4.push({id,k:r.k,kom:(s.kom||{})[id]})); });\n  const navn = id => `\u003ca href=\"#\" class=\"ov-navn\" data-vis=\"${id}\">${esc(B[id].navn)}\u003c/a>`;\n  return `\u003cdiv class=\"ov-hoved\">\u003cdiv class=\"ov-crumb\">Opsamling af Øvelse 3 og 4\u003c/div>\u003ch2>Det, vi har skrevet op\u003c/h2>\n    \u003cdiv class=\"ov-sub\">Alt fra Øvelse 3 og 4 samlet ét sted. Klik på et domæne eller en rejse for at gå tilbage til den.\u003c/div>\u003c/div>\n  \u003cdiv class=\"sek\">\u003ch3>\u003cspan>Øvelse 3: Giver modellen mening?\u003c/span>\u003cspan>${ok.length+forkert.length} af ${alle3} vurderet\u003c/span>\u003c/h3>\n    \u003ctable class=\"ov-tab\">\u003ctr>\u003cth>Domæne\u003c/th>\u003cth>✓\u003c/th>\u003cth>✎\u003c/th>\u003cth>Mangler\u003c/th>\u003cth>Fingre\u003c/th>\u003c/tr>\n    ${DOM3.map((d,i)=>{ const v=x=>d.ids.filter(id=>(o3.beg[id]||{}).v===x).length; return `\u003ctr>\u003ctd>\u003ca href=\"#\" data-til3=\"${i}\">${esc(d.navn)}\u003c/a>\u003c/td>\u003ctd>${v(\"ok\")}\u003c/td>\u003ctd>${v(\"forkert\")}\u003c/td>\u003ctd>${o3.mangler.filter(m=>m.dom===i).length}\u003c/td>\u003ctd>${(o3.dom[i]||{}).fingre||\"\"}\u003c/td>\u003c/tr>`; }).joi w Set(a.mangler.map(m=>m.navn.toLowerCase()+\"|\"+(m.ejer||\"\"))); (b.mangler||[]).forEach(m=>{ if(!hm.has(m.navn.toLowerCase()+\"|\"+(m.ejer||\"\"))) a.mangler.push(m); });\n  }\n  if(n4.fingre && !o.o4.fingre) o.o4.fingre=n4.fingre;\n  gem();\n}\n\n/* start i den øvelse, man sidst var i */\ntry{ const u=JSON.parse(localStorage.getItem(LAGER+\"-ov\")||\"{}\"); if(u.dom!=null) OV.dom=u.dom; if(u.rejse!=null) OV.rejse=u.rejse; if(u.mode && u.mode!==\"model\") setTimeout(()=>sætMode(u.mode),50); }catch(e){}\n\n/* ---------- start ---------- */\n{ const t=(D.meta.titel||\"Begrebsmodel\").split(\" \"); $(\"#titel\").innerHTML = esc(t[0])+(t.length>1?\" \u003cspan>\"+esc(t.slice(1).join(\" \"))+\"\u003c/span>\":\"\"); }\n$(\"#meta\").textContent = `${D.meta.kilde||\"\"}, ${D.begreber.length} begreber, ${R.length} relationer`;\nanvendSkala(); sætFilter(V.filter,true); tegnLegende(); visPanel(); byg();\nwindow.BM = {\n  mode: m => { if(OV.mode!==m) sætMode(m); },\n  vis: id => { if(OV.mode!=='model') sætMode('model'); vælg(id); },\n  pop: id => { if(OV.mode!=='model') sætMode('model'); document.body.classList.add('popmode'); V.historik=[]; V.valgt=id; sætVisning('fokus'); visPanel(); },\n  luk: () => { document.body.classList.remove('popmode'); if(V.visning==='fokus') sætVisning('overblik'); },\n  S: () => S,\n  modelRows: () => { window.__ROWS=1; try{ return eksportCSV(); } finally { window.__ROWS=0; } },\n  ovRows: () => { window.__ROWS=1; try{ return eksportOvCSV(); } finally { window.__ROWS=0; } }\n};\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"</script>

.right{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.right input{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:13px var(--body);padding:7px 11px;border-radius:999px;width:12em}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.ok i{background:var(--green)} .status.warn i{background:var(--yellow)}
main{flex:1;min-height:0;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);display:none}
iframe.vis{display:block}
#bag{display:none;position:fixed;inset:0;background:rgba(28,23,18,.45);z-index:50}
body.pop #bag{display:block}
body.pop #fbm{display:block;position:fixed;inset:auto;left:50%;top:50%;width:min(860px,92vw);height:min(560px,80vh);transform:translate(-50%,-50%);z-index:51;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
#lukpop{display:none;position:fixed;z-index:52;border-radius:999px;border:0;background:var(--dark);color:var(--onDark);font:600 13px var(--body);padding:8px 14px;cursor:pointer}
body.pop #lukpop{display:block;left:calc(50% + min(860px,92vw)/2 - 132px);top:calc(50% - min(560px,80vh)/2 + 12px)}
#poptitel{display:none;position:fixed;z-index:52;left:calc(50% - min(860px,92vw)/2 + 18px);top:calc(50% - min(560px,80vh)/2 + 14px);font:600 15px var(--display);color:var(--ink);background:var(--surface);padding:6px 12px;border-radius:999px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
#poptitel small{font:12px var(--body);color:var(--muted);margin-left:8px}
body.pop #poptitel{display:block}
button:focus-visible,input:focus-visible{outline:2px solid var(--tan);outline-offset:2px}
@media (max-width:760px){.right{margin-left:0}.right input{width:9em}}
</style>

<body>
<header>
  <div class="brand"><small>HimmerLand Fase 0, Workshop II</small><b>Øvelse 1 <span>til 4</span></b></div>
  <nav id="faner" aria-label="Øvelser">
    <button data-t="o1">Øvelse 1 Pains</button><button data-t="o2">Øvelse 2 Krav</button><span class="sep"></span>
    <button data-t="model">Model</button><button data-t="o3">Øvelse 3 Begreber</button><button data-t="o4">Øvelse 4 Rejser</button>
  </nav>
  <div class="right">
    <input id="navn" placeholder="Skriv dit navn" autocomplete="name" aria-label="Navn">
    <span class="status" id="status"><i></i><span id="statustxt">Ikke gemt i fil endnu</span></span>
    <button class="btn dark" id="gem">Gem i fil</button>
    <button class="btn" id="eksport">Eksportér til Excel</button>
  </div>
</header>
<div id="bag"></div><div id="poptitel"></div><button id="lukpop" title="Luk (Esc)">× Luk modellen</button>
<main>
  <iframe id="f12" title="Øvelse 1 og 2"></iframe>
  <iframe id="fbm" title="Begrebsmodel, Øvelse 3 og 4"></iframe>
</main>
<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
const WRAP = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
const SRC12 = JSON.parse($("#src-o12").textContent), SRCBM = JSON.parse($("#src-bm").textContent);
let W = {}; try { W = JSON.parse($("#wrap-state").textContent) || {}; } catch(e) {}
try { const l = JSON.parse(localStorage.getItem("hl-ws2-samlet-wrap-v6") || "null"); if (l && (l.saved||0) > (W.saved||0)) W = l; } catch(e) {}
W.tab = (W.tab && W.tab !== "ops") ? W.tab : "o1";
const f12 = $("#f12"), fbm = $("#fbm");
const klar = {f12:false, fbm:false};
let dirty = false;

function setStatus(cls, txt){ $("#status").className = "status " + cls; $("#statustxt").textContent = txt; }
function hhmm(){ const d = new Date(); return String(d.getHours()).padStart(2,"0") + "." + String(d.getMinutes()).padStart(2,"0"); }
function gemW(){ W.saved = Date.now(); try { localStorage.setItem("hl-ws2-samlet-wrap-v6", JSON.stringify(W)); } catch(e) {} }
window.hlChanged = () => { dirty = true; setStatus("warn", "Gemt i browseren kl. " + hhmm() + ". Tryk Gem i fil"); };
window.hlMode = () => {};
window.hlTab = t => { W.tab = t; markér(); gemW(); };
window.hlVisModel = (id, navn) => { if (!klar.fbm) return; const t = document.getElementById("poptitel"); t.textContent = navn || ""; t.append(Object.assign(document.createElement("small"), {textContent: "og de ord, det hænger sammen med. Klik på et ord for at gå videre"})); document.body.classList.add("pop"); fbm.contentWindow.BM.pop(id); };
function lukPop(){ if (!document.body.classList.contains("pop")) return; document.body.classList.remove("pop"); if (klar.fbm) fbm.contentWindow.BM.luk(); }
document.getElementById("bag").onclick = lukPop; document.getElementById("lukpop").onclick = lukPop;
document.addEventListener("keydown", e => { if (e.key === "Escape") lukPop(); });
[f12, fbm].forEach(fr => fr.addEventListener("load", () => { try { fr.contentWindow.document.addEventListener("keydown", e => { if (e.key === "Escape" && document.body.classList.contains("pop")) lukPop(); }); } catch(e) {} }));

function markér(){ document.querySelectorAll("#faner button").forEach(b => b.classList.toggle("on", b.dataset.t === W.tab)); }
function vis(t){
  lukPop(); W.tab = t; markér(); gemW();
  const er12 = t !== "model";
  f12.classList.toggle("vis", er12); fbm.classList.toggle("vis", !er12);
  if (er12 && klar.f12) f12.contentWindow.HL12.setTab({o1:1, o2:2, o3:3, o4:4, ops:5}[t]);
  if (!er12 && klar.fbm) fbm.contentWindow.BM.mode(t);
}
document.querySelectorAll("#faner button").forEach(b => b.onclick = () => vis(b.dataset.t));

f12.addEventListener("load", () => { klar.f12 = true; const n = f12.contentWindow.HL12.navn(); $("#navn").value = n || ""; if (W.tab !== "model") vis(W.tab); });
fbm.addEventListener("load", () => { klar.fbm = true; if (W.tab === "model") vis(W.tab); });
f12.srcdoc = SRC12; fbm.srcdoc = SRCBM;
vis(W.tab);
if (W.saved && JSON.parse($("#wrap-state").textContent || "{}").saved) setStatus("ok", "Svarene er hentet fra filen");

$("#navn").addEventListener("input", e => { if (klar.f12) f12.contentWindow.HL12.setNavn(e.target.value); });

/* ---------- gem hele filen ---------- */
const enc = s => JSON.stringify(s).replace(/</g, "\\u003c");
const sæt = (html, id, val) => html.replace(new RegExp('(<script type="application/json" id="' + id + '">)[\\s\\S]*?(<\/script>)'), (m, a, b) => a + val + b);
function filnavn(ext){
  const n = ($("#navn").value || "").trim().replace(/[^\wæøåÆØÅ -]/g, "").replace(/\s+/g, "_");
  return "HimmerLand_Workshop_II_Ovelse_1_til_4" + (n ? "_" + n : "") + ext;
}
function hent(navn, data, type){
  const blob = data instanceof Blob ? data : new Blob([data], {type});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = navn; document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function byg(){
  if (!klar.f12 || !klar.fbm) throw new Error("ikke klar");
  const h12 = f12.contentWindow.HL12.buildHTML();
  const hbm = sæt(SRCBM, "bm-state", JSON.stringify(fbm.contentWindow.BM.S()).replace(/</g, "\\u003c"));
  gemW();
  let out = sæt(WRAP, "src-o12", enc(h12));
  out = sæt(out, "src-bm", enc(hbm));
  out = sæt(out, "wrap-state", JSON.stringify(W).replace(/</g, "\\u003c"));
  return out;
}
$("#gem").onclick = () => {
  try { hent(filnavn(".html"), byg(), "text/html"); dirty = false; setStatus("ok", "Fil gemt kl. " + hhmm() + ". Send filen videre som den er"); }
  catch(e) { setStatus("warn", "Vent et øjeblik, filen indlæses stadig"); }
};
window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

/* ---------- Excel (xlsx uden eksterne biblioteker) ---------- */
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b){ let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zip(files){
  const te = new TextEncoder(), parts = [], central = []; let off = 0;
  const u16 = v => [v & 255, (v >>> 8) & 255], u32 = v => [v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255];
  for (const [name, txt] of files) {
    const nb = te.encode(name), data = te.encode(txt), crc = crc32(data);
    const head = [0x50,0x4b,3,4, ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(crc), ...u32(data.length), ...u32(data.length), ...u16(nb.length), ...u16(0)];
    parts.push(new Uint8Array(head), nb, data);
    central.push(new Uint8Array([0x50,0x4b,1,2, ...u16(20), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(crc), ...u32(data.length), ...u32(data.length), ...u16(nb.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(off)]), nb);
    off += head.length + nb.length + data.length;
  }
  const csize = central.reduce((a, b) => a + b.length, 0);
  const end = new Uint8Array([0x50,0x4b,5,6, ...u16(0), ...u16(0), ...u16(files.length), ...u16(files.length), ...u32(csize), ...u32(off), ...u16(0)]);
  return new Blob([...parts, ...central, end], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
const x = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, "");
function col(i){ let s = ""; i++; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }
function sheet(rows){
  const width = Math.max(...rows.map(r => r.length));
  const cols = Array.from({length: width}, (_, c) => { const L = Math.min(60, Math.max(8, ...rows.slice(0, 200).map(r => String(r[c] == null ? "" : r[c]).length * .9))); return `<col min="${c+1}" max="${c+1}" width="${L.toFixed(1)}" customWidth="1"/>`; }).join("");
  const body = rows.map((r, i) => `<row r="${i+1}">` + r.map((v, c) => {
    const ref = col(c) + (i + 1), st = i === 0 ? ' s="1"' : ' s="2"';
    if (typeof v === "number" || (/^\d+$/.test(String(v)) && String(v).length < 6 && i > 0)) return `<c r="${ref}"${st}><v>${Number(v)}</v></c>`;
    return `<c r="${ref}" t="inlineStr"${st}><is><t xml:space="preserve">${x(v)}</t></is></c>`;
  }).join("") + `</row>`).join("");
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${cols}</cols><sheetData>${body}</sheetData><autoFilter ref="A1:${col(width-1)}${rows.length}"/></worksheet>`;
}
function xlsx(ark){
  const files = [];
  files.push(["[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${ark.map((a, i) => `<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}</Types>`]);
  files.push(["_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`]);
  files.push(["xl/workbook.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${ark.map((a, i) => `<sheet name="${x(a[0])}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join("")}</sheets>${ark.map((a, i) => `<definedNames><definedName name="_xlnm._FilterDatabase" localSheetId="${i}" hidden="1">'${x(a[0])}'!$A$1:$${col(Math.max(...a[1].map(r => r.length))-1)}$${a[1].length}</definedName></definedNames>`).slice(0,0).join("")}</workbook>`]);
  files.push(["xl/_rels/workbook.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${ark.map((a, i) => `<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")}<Relationship Id="rId${ark.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`]);
  files.push(["xl/styles.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="10"/><name val="Calibri"/></font><font><b/><sz val="10"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF3C2C1C"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"><alignment vertical="top" wrapText="1"/></xf><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`]);
  ark.forEach((a, i) => files.push([`xl/worksheets/sheet${i+1}.xml`, sheet(a[1])]));
  return zip(files);
}
$("#eksport").onclick = () => {
  if (!klar.f12 || !klar.fbm) { setStatus("warn", "Vent et øjeblik, filen indlæses stadig"); return; }
  const r12 = f12.contentWindow.HL12.rows(), rov = f12.contentWindow.HL12.rows34(), rm = fbm.contentWindow.BM.modelRows();
  const r1 = [r12[0]].concat(r12.slice(1).filter(r => r[1] === "Pain")), r2 = [r12[0]].concat(r12.slice(1).filter(r => r[1] === "Krav"));
  hent(filnavn(".xlsx"), xlsx([["Øvelse 1 Pains", r1], ["Øvelse 2 Krav", r2], ["Øvelse 3 og 4", rov], ["Model kommentarer", rm]]));
  setStatus(dirty ? "warn" : "ok", "Excel eksporteret kl. " + hhmm());
};
})();
</script>
<!-- ===== KVADRANT DB til Workshop II. Sidder lige før </body> ===== -->
<script>
(function () {
  const CONFIG = {
    url:      'https://hdffpdighiblwabimelg.supabase.co',
    key:      'sb_publishable_vbwoHt0dhHIFhwSM0d_R-A_LfZC52pS',
    workshop: 'himmerland-ws2'
  };
  const LS12 = 'hl-ws2-samlet-o12-v6', LSBM = 'himmerland-ws2-samlet-bm-v6', LSW = 'hl-ws2-samlet-wrap-v6';
  const f12 = document.querySelector('#f12'), fbm = document.querySelector('#fbm'), nameEl = document.querySelector('#navn');
  const rd = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
  const ready = () => { try { return !!(f12.contentWindow.HL12 && fbm.contentWindow.BM); } catch (e) { return false; } };
  const stamp = b => Math.max((b && b.o12 && b.o12.saved) || 0, (b && b.bm && b.bm.sidst) || 0);

  const H = { 'Content-Type': 'application/json', apikey: CONFIG.key };
  if (!CONFIG.key.startsWith('sb_')) H.Authorization = 'Bearer ' + CONFIG.key;
  const rpc = (fn, body) => fetch(CONFIG.url + '/rest/v1/rpc/' + fn, { method: 'POST', headers: H, body: JSON.stringify(body) })
    .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)));

  const badge = document.createElement('div');
  badge.style.cssText = 'position:fixed;right:12px;bottom:12px;z-index:99;background:#3C2C1C;color:#fff;font:12px/1 system-ui,sans-serif;padding:8px 12px;border-radius:99px;display:flex;gap:8px;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.25)';
  badge.innerHTML = '<span style="width:9px;height:9px;border-radius:50%;background:#8C847A;display:inline-block"></span><span>Skriv dit navn for at gemme online</span>';
  document.body.appendChild(badge);
  const say = (c, t) => { badge.firstChild.style.background = c; badge.lastChild.textContent = t; };

  let active = null, timer = null, busy = false;

  function bundle() {
    const HL = f12.contentWindow.HL12, BM = fbm.contentWindow.BM;
    try { HL.buildHTML(); } catch (e) {}                       // gemmer øvelse 1 og 2 i browseren først
    return {
      navn: active, _t: Date.now(), o12: rd(LS12), bm: JSON.parse(JSON.stringify(BM.S())), w: rd(LSW) || {},
      rows: { r12: HL.rows(), r34: HL.rows34(), rm: BM.modelRows() }   // de samme rækker som Excel eksporten
    };
  }
  async function push() {
    if (!active || !ready()) return;
    say('#E6B840', 'Gemmer online …');
    try { await rpc('save_answers', { p_workshop: CONFIG.workshop, p_name: active, p_data: bundle() }); say('#7CC48A', 'Gemt online'); }
    catch (e) { say('#BF574E', 'Kunne ikke gemme online. Prøver igen ved næste ændring'); }
  }
  async function connect(name, auto) {
    name = (name || '').trim();
    if (!name) { active = null; say('#8C847A', 'Skriv dit navn for at gemme online'); return; }
    if (busy || (active && name.toLowerCase() === active.toLowerCase())) return;
    if (!ready()) { setTimeout(() => connect(name, auto), 500); return; }
    busy = true; say('#E6B840', 'Henter dine svar …');
    try {
      const remote = await rpc('load_answers', { p_workshop: CONFIG.workshop, p_name: name });
      const local = { o12: rd(LS12), bm: rd(LSBM) };
      if (remote && remote.o12 && !(auto && stamp(remote) <= stamp(local))) {
        try {
          localStorage.setItem(LS12, JSON.stringify(remote.o12));
          if (remote.bm) localStorage.setItem(LSBM, JSON.stringify(remote.bm));
          if (remote.w) localStorage.setItem(LSW, JSON.stringify(remote.w));
        } catch (e) {}
        say('#E6B840', 'Åbner dine svar …');
        let n = 0;
        const done = () => { if (++n < 2) return; active = name; busy = false; say('#7CC48A', 'Dine svar er hentet. Du kan fortsætte'); };
        [f12, fbm].forEach(fr => { fr.addEventListener('load', done, { once: true }); fr.srcdoc = fr.srcdoc + '\n'; });
        return;
      }
      active = name; await push();
    } catch (e) { say('#BF574E', 'Ingen forbindelse til databasen'); }
    busy = false;
  }
  function schedule() { if (!active || busy) return; clearTimeout(timer); timer = setTimeout(push, 1500); }

  const oc = window.hlChanged, ot = window.hlTab;
  window.hlChanged = function () { if (oc) oc.apply(this, arguments); schedule(); };
  window.hlTab = function () { if (ot) ot.apply(this, arguments); schedule(); };

  nameEl.addEventListener('change', e => connect(e.target.value, false));
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && active) push(); });

  /* ved genåbning hentes navnet, så snart arket er indlæst. Navne der skrives bagefter, håndteres af change */
  let tries = 0;
  const iv = setInterval(() => {
    if (ready()) { clearInterval(iv); if (nameEl.value.trim()) connect(nameEl.value, true); }
    else if (++tries > 40) clearInterval(iv);
  }, 300);
})();
</script>

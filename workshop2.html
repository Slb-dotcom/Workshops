.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-right:8px}\n.hjl{border-top:1px dashed var(--line2);padding-top:10px;font-size:12.5px;color:var(--ink2)}\n.hjt{display:flex;gap:6px;align-items:center;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}\n.hjt .ic{width:14px;height:14px;color:var(--tan)}\n.hjl ul{margin:6px 0 0;padding-left:18px}\n.hjl li{margin:2px 0}\n.hjl p{margin:6px 0 0;color:var(--muted)}\n.guide{border-color:var(--accent);background:var(--surface)}\n.guide .trin{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px;color:var(--ink2);line-height:1.5}\n.gex{background:var(--sunk);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:13px}\n.gext{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}\n.gexr b{display:inline-block;min-width:9em;color:var(--ink)}\n.visguide{display:flex;justify-content:flex-end}\n.pbar{display:inline-block;width:80px;height:6px;border-radius:999px;background:var(--line);overflow:hidden;margin-left:10px;vertical-align:middle}\n.pbar i{display:block;height:100%;background:var(--green)}\n.hist mark{background:var(--yellow-soft);color:var(--ink);font-weight:600;border-radius:3px;padding:0 2px}\n.opg{display:flex;gap:8px;align-items:flex-start;background:var(--tan-soft);border-radius:8px;padding:9px 12px;font-weight:600;color:var(--ink)}\n.opg .ic{width:16px;height:16px;color:var(--accent);flex:none;margin-top:2px}\nselect.box.kat{width:13em;flex:none}\nselect.box.fejl{border-color:var(--red);box-shadow:0 0 0 2px var(--red-soft)}\n.fejltxt{color:var(--red);font-weight:600}\n\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader class=\"top\">\n  \u003cdiv class=\"wrap\">\n    \u003cdiv class=\"brand\">\u003cb>HimmerLand\u003c/b>\u003cspan>Workshop II: Øvelse 1 og 2\u003c/span>\u003c/div>\n    \u003cdiv class=\"who\">\u003clabel for=\"navn\">\u003cspan class=\"ic\" data-i=\"user\">\u003c/span>Navn\u003c/label>\u003cinput id=\"navn\" placeholder=\"Skriv dit navn\" autocomplete=\"name\">\u003c/div>\n    \u003cdiv class=\"save\">\n      \u003cspan class=\"status\" id=\"status\">\u003ci>\u003c/i>\u003cspan id=\"statustxt\">Ikke gemt endnu\u003c/span>\u003c/span>\n      \u003cbutton class=\"btn primary\" id=\"gem\" type=\"button\">\u003cspan class=\"ic\" data-i=\"floppy-disk\">\u003c/span>\u003cspan class=\"lbl\">Gem i fil\u003c/span>\u003c/button>\n      \u003cbutton class=\"btn ghost\" id=\"eksport\" type=\"button\">\u003cspan class=\"ic\" data-i=\"microsoft-excel-logo\">\u003c/span>\u003cspan class=\"lbl\">Eksportér til Excel\u003c/span>\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/header>\n\u003cmain class=\"wrap\" id=\"app\">\u003c/main>\n\u003cfooter class=\"wrap\">HimmerLand Fase 0, Kvadrant Consulting, Pains og kravforslag fra workshopmaterialet v19\u003c/footer>\n\u003cscript type=\"application/json\" id=\"hl-data\">[{\"id\": \"P5\", \"rejse\": \"K01 Par og venner på getaway\", \"fase\": \"1 Inspiration og booking\", \"tid\": 5, \"titel\": \"Hver tid bookes ét sted og skrives ind igen i hotelsystemet\", \"hvad\": \"Spa, bord, aktivitet og golf bookes i hvert sit system og skrives igen ind i PMS. Receptionen har mange skærme åbne for ikke at taste forkert tid eller antal.\", \"hvorfor\": \"Dobbelt indtastning koster tid hver dag og giver fejl i tid og antal.\", \"hvem\": \"Salg på hverdage, ellers receptionen og golfshoppen\", \"krav\": [{\"p\": \"MUST\", \"t\": \"Når en medarbejder booker spa, bord, aktivitet eller golf til et ophold, skal det kunne gøres ét sted, så intet skal tastes ind igen.\"}, {\"p\": \"MUST\", \"t\": \"Når en tid eller et antal ændres ét sted, skal ændringen slå igennem alle steder.\"}]}, {\"id\": \"P1\", \"rejse\": \"K01 Par og venner på getaway\", \"fase\": \"1 Inspiration og booking\", \"tid\": 5, \"titel\": \"Online booking kræver mange klik, så gæster giver op og ringer\", \"hvad\": \"Gæsten skal vælge et ophold, før hun kommer videre, og mange giver op og ringer. En getaway kræver 21 trin, 11 skift mellem skærme og systemer og 2 logins.\", \"hvorfor\": \"Bookinger, der kunne være gennemført online, bruger medarbejdernes tid og kommer ikke ind i et online forløb.\", \"hvem\": \"Gæsten, derefter salgsafdelingen eller receptionen\", \"krav\": [{\"p\": \"MUST\", \"t\": \"Når gæsten booker online, skal det være nemt at klikke sig igennem bookingflowet, så gæsten ikke giver op og ringer.\"}]}, {\"id\": \"P10\", \"rejse\": \"K01 Par og venner på getaway\", \"fase\": \"1 Inspiration og booking\", \"tid\": 4, \"titel\": \"Tider aftales frem og tilbage, og systemet holder ikke tiden imens\", \"hvad\": \"Receptionen og salg aftaler tider med gæsten over flere omgange på mail og telefon. Systemet kan ikke holde en tid, mens den tilbydes, så den kan blive booket af en anden imens.\", \"hvorfor\": \"Gæsten får tilbudt en tid, der ikke længere findes, og så starter det forfra.\", \"hvem\": \"Receptionen og salgsafdelingen\", \"krav\": [{\"p\": \"MUST\", \"t\": \"Når gæsten booker et ophold, skal gæsten selv kunne vælge tider til spa og restaurant i samme bookingflow, så tider ikke skal aftales frem og tilbage.\"}, {\"p\": \"MUST\", \"t\": \"Når gæsten booker tider, skal det kunne gøres ét sted uden at skulle ind i flere systemer.\"}]}, {\"id\": \"P8\", \"rejse\": \"K01 Par og venner på getaway\", \"fase\": \"1 Inspiration og booking\", \"tid\": 4, \"titel\": \"Onlinepakker får tider, gæsten ikke har valgt\", \"hvad\": \"Onlinepakker får faste tider til spa (fx kl. 14.59) og morgenmad (kl. 6.30). Kun ca. 2 ud af 10 skriver ønsker i noten. Receptionen retter tiderne, og gæster ringer.\", \"hvorfor\": \"Gæsten får tider, der ikke passer, og receptionen bruger tid på at rette dem.\", \"hvem\": \"Gæsten og receptionen\", \"krav\": [{\"p\": \"MUST\", \"t\": \"Når gæsten booker en pakke med spa eller middag online, skal gæsten kunne se og vælge de ledige tider.\"}, {\"p\": \"SHOULD\", \"t\": \"Når gæsten booker en ydelse med tid hos HimmerLand, skal gæsten vælge et tidspunkt, før bookingen kan gennemføres.\"}]}, {\"id\": \"P42\", \"rejse\": \"K01 Par og venner på getaway\", \"fase\": \"1 Inspiration og booking\", \"tid\": 3, \"titel\": \"Gavekort ligger i flere systemer og kan ikke bruges på tværs\", \"hvad\": \"Gavekort sælges i LifePeaks, i shoppens FlexPos og tidligere via Truestory, som er opsagt. Online kan kun ét gavekort bruges pr. booking, og feltet til koden er svært at finde.\", \"hvorfor\": \"Gæsten kan ikke bruge sit gavekort frit på resortet, og HimmerLand mister mersalget, når det indløses.\", \"hvem\": \"Gæsten og receptionen\", \"krav\": [{\"p\": \"MUST\", \"t\": \"Når gæsten har et gavekort fra HimmerLand, skal det kunne bruges på ophold, restauranter, shop og aktiviteter.\"}, {\"p\": \"SHOULD\", \"t\": \"Når gæsten betaler online, skal gæsten kunne bruge alle sine gavekort på samme booking, uden begrænsning på antal.\"}]}, {\"id\": \"P22\", \"rejse\": \"K01 Par og venner på getaway\", \"fase\": \"2 Tilkøb og aktiviteter\", \"tid\": 5, \"titel\": \"Afdelingerne tjekker de samme lister mod hinanden hver dag\", \"hvad\": \"Reception og restaurant tjekker dagligt Spectra mod DinnerBooking og HalBooking, og spaen tjekker spalisten. En rettelse i Spectra går ikke automatisk videre til DinnerBooking.\", \"hvorfor\": \"Mange medarbejdere bruger tid hver dag på at afstemme, og fejl opdages for sent.\", \"hvem\": \"Reception, salg, restaurant, spa og golfshop\", \"krav\": [{\"p\": \"MUST\", \"t\": \"Når noget ændres på en booking ét sted, skal det ændres alle steder, så ingen afdeling skal tjekke lister mod hinanden.\"}]}, {\"id\": \"P11\", \"rejse\": \"K01 Par og venner på getaway\", \"fase\": \"2 Tilkøb og aktiviteter\", \"tid\": 4, \"titel\": \"Gæsten kan ikke booke aktiviteter og spa før sit ophold\", \"hvad\": \"HalBooking kræver profil, login og kort, og gæsten betaler fuld pris. Login med reservation kræver værelsesnummer, som først kommer ved check in.\", \"hvorfor\": \"Mange mailer i stedet deres ønsker til receptionen, og gæster, der booker selv, betaler mere end opholdsprisen.\", \"hvem\": \"Gæsten og receptionen\", \"krav\": [{\"p\": \"MUST\", \"t\": \"Når gæsten har booket et ophold, skal gæsten kunne booke aktiviteter og spa til opholdsprisen med samme login og uden værelsesnummer.\"}]}, {\"id\": \"P21\", \"rejse\": \"K01 Par og venner på getaway\", \"fase\": \"2 Tilkøb og aktiviteter\", \"tid\": 4, \"titel\": \"En booketid i HalBooking kan ikke flyttes, kun slettes og oprettes igen\", \"hvad\": \"I HalBooking kan en tid ikke flyttes. Den skal slettes og oprettes igen. Det sker mange gange om dagen.\", \"hvorfor\": \"Ekstra arbejde og risiko for, at tiden bliver taget af en anden imens.\", \"hvem\": \"Receptionen\", \"krav\": [{\"p\": \"MUST\", \"t\": \"Når en booket tid skal ændres, skal medarbejderen kunne flytte tiden direkte uden at slette og oprette den igen.\"}]}, {\"id\": \"P52\", \"rejse\": \"K01 Par og venner på getaway\", \"fase\": \"2 Tilkøb og aktiviteter\", \"tid\": 4, \"titel\": \"Opholdsgæsters borde flyttes i hånden mellem to systemer\", \"hvad\": \"Spectra og DinnerBooking er ikke integreret. Opholdsgæsternes borde flyttes i hånden, hvilket giver overbooking og forkert antal kuverter. Der er fire indgange til bordbooking.\", \"hvorfor\": \"Gæster kan stå uden bord, og køkkenet laver forkert mængde mad.\", \"hvem\": \"Salgsafdelingen, receptionen og restauranten\", \"krav\": [{\"p\": \"MUST\", \"t\": \"Når en opholdsgæst får et bord, skal bordet ligge i samme bordbooking, uanset hvor det er booket, så ingen borde flyttes i hånden.\"}]}, {\"id\": \"P15\", \"rejse\": \"K01 Par og venner på getaway\", \"fase\": \"2 Tilkøb og aktiviteter\", \"tid\": 3, \"titel\": \"Allergier og særønsker skrives to steder\", \"hvad\": \"Allergier, fødselsdag og andre særlige ønsker skrives både i Spectra (hotelsystemet) I en note og i DinnerBooking (bordbooking) I en note.\", \"hvorfor\": \"Ønsker kan mangle det ene sted, og restauranten kan ikke tage hensyn.\", \"hvem\": \"Receptionen og restauranten\", \"krav\": [{\"p\": \"MUST\", \"t\": \"Når allergier eller særønsker registreres, skal de kun skrives ét sted og kunne ses af salg, reception, restaurant og housekeeping.\"}]}, {\"id\": \"P23\", \"rejse\": \"K01 Par og venner på getaway\", \"fase\": \"3 Ankomst og ophold\", \"tid\": 3, \"titel\": \"Online check in virker kun delvist og sparer ikke kø i receptionen\", \"hvad\": \"Tjekker gæsten ind i AeroGuest, gennemgås tiderne ikke, og nye gæster står alligevel i kø for at finde værelset. Bord tilbydes ikke.\", \"hvorfor\": \"Online check in sparer ikke receptionens tid og giver ikke mersalg.\", \"hvem\": \"Gæsten og receptionen\", \"krav\": [{\"p\": \"SHOULD\", \"t\": \"Når gæsten tjekker ind online, skal gæsten få sine tider og vejen til værelset. Bord og tider er booket på forhånd, så intet skal aftales i receptionen.\"}]}, {\"id\": \"P71\", \"rejse\": \"K01 Par og venner på getaway\", \"fase\": \"3 Ankomst og ophold\", \"tid\": 3, \"titel\": \"Adgang til faciliteter kræver forskellige medier\", \"hvad\": \"Svømmehallen kræver en QR kode, fitness bruger værelseskortet, og padel og golfsimulator kræver en sekscifret kode på papir. Informationen i AeroGuest er svær at finde rundt i.\", \"hvorfor\": \"Gæster spørger i receptionen, og nogle kommer ikke ind.\", \"hvem\": \"Gæsten og receptionen\", \"krav\": [{\"p\": \"SHOULD\", \"t\": \"Når en opholdsgæst skal i svømmehal, fitness, padel og golfsimulator, skal ét adgangsmiddel give adgang til det hele.\"}]}, {\"id\": \"P72\", \"rejse\": \"K01 Par og venner på getaway\", \"fase\": \"3 Ankomst og ophold\", \"tid\": 2, \"titel\": \"Restaurantens kasse går ned et par gange om måneden\", \"hvad\": \"Når kassesystemet går ned, skriver restauranten bonger i hånden og kan ikke se, hvad der er bonget på bordet. Det er blevet bedre med den nye kasse, men sker stadig.\", \"hvorfor\": \"Varer glemmes på regningen, og betalinger registreres bagefter.\", \"hvem\": \"Restauranten\", \"krav\": [{\"p\": \"SHOULD\", \"t\": \"Når restaurantens kasse er nede, skal tjenerne kunne blive ved med at bonge og tage betaling, og alt skal komme med i systemet bagefter.\"}]}, {\"id\": \"P31\", \"rejse\": \"K01 Par og venner på getaway\", \"fase\": \"4 Betaling og afregning\", \"tid\": 5, \"titel\": \"Checkud søndag morgen er et puslespil\", \"hvad\": \"Søndag morgen printes regningerne og gennemgås én for én, 30 til 45 minutter med afbrydelser. Restaurantbilaget er uspecificeret, og en uenighed tager 5 til 15 minutter.\", \"hvorfor\": \"Kø ved udtjekning og meget tid bundet i receptionen på dagens travleste tidspunkt.\", \"hvem\": \"Receptionen\", \"krav\": [{\"p\": \"MUST\", \"t\": \"Når gæsten tjekker ud, skal regningen være samlet og vise hver ydelse, så receptionen ikke skal gennemgå og rette regningerne først.\"}]}, {\"id\": \"P33\", \"rejse\": \"K01 Par og venner på getaway\", \"fase\": \"4 Betaling og afregning\", \"tid\": 3, \"titel\": \"Online udtjekning viser kun totalbeløb\", \"hvad\": \"AeroGuest viser kun totalbeløb og 'overførsel', ikke de enkelte poster, så få tjekker ud der.\", \"hvorfor\": \"Gæsten kan ikke tjekke sin regning og går til receptionen.\", \"hvem\": \"Gæsten\", \"krav\": [{\"p\": \"MUST\", \"t\": \"Når gæsten tjekker ud digitalt, skal gæsten kunne se hver ydelse på regningen.\"}]}, {\"id\": \"P32\", \"rejse\": \"K01 Par og venner på getaway\", \"fase\": \"4 Betaling og afregning\", \"tid\": 3, \"titel\": \"Middagen i pakken kan komme på regningen to gange\", \"hvad\": \"Middagen er betalt i pakken, men restaurantens kasse kan ikke se det. Bonges den også, står den to gange på gæstens regning, og receptionen må finde og kreditere den ved check ud.\", \"hvorfor\": \"Gæsten risikerer at betale to gange, og receptionen bruger tid på at rydde op ved check ud.\", \"hvem\": \"Receptionen og restauranten\", \"krav\": [{\"p\": \"MUST\", \"t\": \"Når en ydelse er betalt i pakken, skal restauranten kunne se det, så den ikke kommer på regningen igen.\"}]}, {\"id\": \"P36\", \"rejse\": \"K01 Par og venner på getaway\", \"fase\": \"4 Betaling og afregning\", \"tid\": 4, \"titel\": \"Rabat på regningen regnes i hånden med lommeregner\", \"hvad\": \"Koncernens medarbejdere får 20 % rabat, men den kan ikke gives ved booking. Mangler den på regningen, trækkes 20 % fra hver varelinje med lommeregner, fordi Spectra ikke kan regne procent.\", \"hvorfor\": \"Tidskrævende og fejlbehæftet, og det sker mens gæsten venter.\", \"hvem\": \"Receptionen\", \"krav\": [{\"p\": \"MUST\", \"t\": \"Når en gæst har ret til rabat, skal systemet selv regne rabatten på hele regningen eller de varer, rabatten gælder.\"}, {\"p\": \"SHOULD\", \"t\": \"Når en koncernmedarbejder booker, skal rabatten kunne gives allerede ved booking.\"}]}, {\"id\": \"P62\", \"rejse\": \"K01 Par og venner på getaway\", \"fase\": \"5 Efter besøget\", \"tid\": 2, \"titel\": \"Ingen loyalitet, ingen CRM og ingen samlet viden om gæsten\", \"hvad\": \"Der er intet loyalitetsprogram og intet CRM. Ingen kender gæstens samlede forbrug, og samtykke til nyhedsbrev er spredt i flere systemer.\", \"hvorfor\": \"Marketing kan ikke målrette, og samtykke kan ikke dokumenteres ét sted.\", \"hvem\": \"Marketing og ledelsen\", \"krav\": [{\"p\": \"SHOULD\", \"t\": \"Når en gæst køber noget på resortet, skal det samles på gæstens profil, så HimmerLand kender gæstens samlede forbrug.\"}]}, {\"id\": \"P38\", \"rejse\": \"K01 Par og venner på getaway\", \"fase\": \"5 Efter besøget\", \"tid\": 3, \"titel\": \"Anmeldelser besvares hver for sig på fem platforme\", \"hvad\": \"Gæstefeedbacken samles i Loopon, men anmeldelser på TripAdvisor, Trustpilot, Expedia, Booking.com og DinnerBooking skal besvares inde på hver platform.\", \"hvorfor\": \"Hver platform skal tjekkes og besvares for sig, og svarene ligger spredt.\", \"hvem\": \"Receptionen\", \"krav\": [{\"p\": \"COULD\", \"t\": \"Når en anmeldelse kommer ind, skal den kunne ses og besvares ét sted.\"}]}, {\"id\": \"P40\", \"rejse\": \"K01 Par og venner på getaway\", \"fase\": \"5 Efter besøget\", \"tid\": 2, \"titel\": \"Tidligere gæster findes kun på telefonnummer og anonymiseres efter et år\", \"hvad\": \"Tidligere gæster kan kun findes på telefonnummer eller gammelt reservationsnummer. De anonymiseres efter et år eller gemmes i fem år.\", \"hvorfor\": \"En gæst, der kommer igen, genkendes ikke.\", \"hvem\": \"Receptionen\", \"krav\": [{\"p\": \"SHOULD\", \"t\": \"Når en tidligere gæst booker eller ringer igen, skal gæsten genkendes og kobles til sin profil.\"}]}, {\"id\": \"P64\", \"rejse\": \"K01 Par og venner på getaway\", \"fase\": \"6 Bag kulissen\", \"tid\": 4, \"titel\": \"Værelsespriser sættes dagligt i hånden på alle kanaler\", \"hvad\": \"Værelsespriser sættes hver dag på alle salgskanaler ud fra erfaring. En ændret værelsespris ændrer pakkeprisen.\", \"hvorfor\": \"Der er ingen regel i systemet for prissætningen, så pakkepriserne ændrer sig, hver gang værelsesprisen ændres.\", \"hvem\": \"Receptionschefen\", \"krav\": [{\"p\": \"SHOULD\", \"t\": \"Når værelsesprisen ændres, skal pakkepriserne følge med i alle kanaler af sig selv.\"}]}, {\"id\": \"P66\", \"rejse\": \"K01 Par og venner på getaway\", \"fase\": \"6 Bag kulissen\", \"tid\": 3, \"titel\": \"Data er svære at få ud af systemerne\", \"hvad\": \"Data er svære at få ud af systemerne, og Spectra kan ikke forklare sine egne rapporter.\", \"hvorfor\": \"Økonomi og ledelse har svært ved at få de data, de har brug for.\", \"hvem\": \"Økonomiafdelingen og ledelsen\", \"krav\": [{\"p\": \"SHOULD\", \"t\": \"Når HimmerLand har brug for data, skal de selv kunne hente dem fra alle systemer uden at spørge leverandøren.\"}]}, {\"id\": \"P70\", \"rejse\": \"K01 Par og venner på getaway\", \"fase\": \"6 Bag kulissen\", \"tid\": 3, \"titel\": \"Det er tungt at lære nye medarbejdere de mange systemer\", \"hvad\": \"Der er mange systemer, som hver virker på sin måde, og meget sidder i fingrene. Det er tungt at lære nye medarbejdere dem alle.\", \"hvorfor\": \"Nye medarbejdere er længe om at blive trygge, og der sker fejl.\", \"hvem\": \"Alle medarbejdere\", \"krav\": [{\"p\": \"MUST\", \"t\": \"Når en ny medarbejder starter, skal systemerne være så intuitive, at personen hurtigt kan begynde at arbejde.\"}]}, {\"id\": \"P75\", \"rejse\": \"K01 Par og venner på getaway\", \"fase\": \"6 Bag kulissen\", \"tid\": 3, \"titel\": \"Bankindbetalinger læses manuelt ind hver dag\", \"hvad\": \"Indbetalinger trækkes som fil fra banken og læses ind i Spectra og Business Central hver dag.\", \"hvorfor\": \"Uden indlæsningen kan receptionen ikke se forudbetalinger, og økonomi kan ikke holde lukket i jul og nytår.\", \"hvem\": \"Økonomiafdelingen og receptionen\", \"krav\": [{\"p\": \"SHOULD\", \"t\": \"Når en gæst betaler via bankoverførsel, skal betalingen automatisk stå på bookingen, så ingen skal læse filer ind.\"}]}, {\"id\": \"V3\", \"rejse\": \"K08 Virksomhed eller gruppe\", \"fase\": \"1 Inspiration og booking\", \"tid\": 4, \"titel\": \"Et tilbud skal lægges ind i flere systemer i hånden\", \"hvad\": \"Salg lægger tilbuddet i Spectra, mailer formularen til sig selv, lægger den i GetAccept og sender en følgemail. Efter underskrift sættes status til bekræftet i hånden.\", \"hvorfor\": \"Mange manuelle trin pr. tilbud, og tilbud kan fejle på vejen.\", \"hvem\": \"Salgsafdelingen\", \"krav\": [{\"p\": \"MUST\", \"t\": \"Når salg sender et tilbud, skal det kunne laves og sendes til digital underskrift direkte fra bookingen.\"}, {\"p\": \"COULD\", \"t\": \"Når kunden har skrevet under, skal bookingen automatisk stå som bekræftet.\"}]}, {\"id\": \"V1\", \"rejse\": \"K08 Virksomhed eller gruppe\", \"fase\": \"1 Inspiration og booking\", \"tid\": 3, \"titel\": \"Mødepakker og lokaler kan ikke bookes online, kun forespørges\", \"hvad\": \"Virksomheder kan ikke booke mødepakker og lokaler online. De kan kun sende en forespørgsel. Alt starter på telefon, mail eller kontaktformular, som lander i en mailboks.\", \"hvorfor\": \"Salg skal manuelt gribe alle henvendelser, og kunden venter på svar.\", \"hvem\": \"Kunden og salgsafdelingen\", \"krav\": [{\"p\": \"COULD\", \"t\": \"Når en virksomhed kigger på møder online, skal den kunne se faciliteterne, og om lokalet er ledigt, så den nemt kan sende en forespørgsel.\"}]}, {\"id\": \"V7\", \"rejse\": \"K08 Virksomhed eller gruppe\", \"fase\": \"1 Inspiration og booking\", \"tid\": 3, \"titel\": \"Særlige forespørgsler passer ikke i standardpakkerne\", \"hvad\": \"Særlige forespørgsler (festival, store golfgrupper) passer ikke i standardpakkerne og giver flere kontaktrunder, før der kan sendes tilbud.\", \"hvorfor\": \"Tilbuddet tager længere tid, og salg sætter det sammen fra bunden hver gang.\", \"hvem\": \"Salgsafdelingen\", \"krav\": [{\"p\": \"SHOULD\", \"t\": \"Når en forespørgsel ikke passer i en pakke, skal salg kunne sætte tilbuddet sammen af faste byggeklodser med priser.\"}]}, {\"id\": \"V11\", \"rejse\": \"K08 Virksomhed eller gruppe\", \"fase\": \"2 Tilkøb og aktiviteter\", \"tid\": 5, \"titel\": \"En ændring eller sletning rettes i hvert system for sig\", \"hvad\": \"Når antallet ændres (fx 30 til 25 personer), rettes det i hvert system for sig, og fejl opdages først på koordineringsmødet. Sletninger slår heller ikke igennem.\", \"hvorfor\": \"Fejl i antal giver forkert mad, forkerte lokaler og forkert regning.\", \"hvem\": \"Salgsafdelingen og driften\", \"krav\": [{\"p\": \"MUST\", \"t\": \"Når antal, tider eller ydelser ændres eller slettes ét sted, skal det ændres alle steder.\"}]}, {\"id\": \"V10\", \"rejse\": \"K08 Virksomhed eller gruppe\", \"fase\": \"2 Tilkøb og aktiviteter\", \"tid\": 5, \"titel\": \"Tilkøb til et arrangement bookes i hånden i flere systemer\", \"hvad\": \"Salg booker tilkøb i hånden i GolfBox, DinnerBooking og HalBooking ud over Spectra. GolfBox lukker ned, hvis DGU numre tastes for langsomt, så de skrives først på post its.\", \"hvorfor\": \"Samme arrangement skal tastes ind flere steder, og det er salgs største tidsforbrug.\", \"hvem\": \"Salgsafdelingen\", \"krav\": [{\"p\": \"MUST\", \"t\": \"Når salg booker et arrangement, skal lokale, mad og aktiviteter kunne bookes samlet ét sted.\"}, {\"p\": \"SHOULD\", \"t\": \"Når et arrangement har golf, skal golfdelen kunne kobles til arrangementet, selv om starttiderne fortsat bookes i golfsystemet.\"}]}, {\"id\": \"V16\", \"rejse\": \"K08 Virksomhed eller gruppe\", \"fase\": \"2 Tilkøb og aktiviteter\", \"tid\": 3, \"titel\": \"Business Club koordineres uden for den normale arbejdsgang\", \"hvad\": \"Aktivitetsafdelingen planlægger Business Club i Excel og lægger arrangementerne ind i Spectra, DinnerBooking og GolfBox. Der er intet system til medlemmernes tilmelding og nyhedsbrev.\", \"hvorfor\": \"Arrangementerne ligger uden for den normale bookingløsning, så der opstår spørgsmål, dobbeltarbejde og fejl.\", \"hvem\": \"Aktivitetsafdelingen, golfafdelingen og salgsafdelingen\", \"krav\": [{\"p\": \"SHOULD\", \"t\": \"Når et Business Club arrangement planlægges, skal det laves i samme bookingløsning og af de samme folk som andre arrangementer.\"}, {\"p\": \"SHOULD\", \"t\": \"Når et medlem vil deltage i et arrangement, skal medlemmet selv kunne tilmelde sig.\"}]}, {\"id\": \"V14\", \"rejse\": \"K08 Virksomhed eller gruppe\", \"fase\": \"2 Tilkøb og aktiviteter\", \"tid\": 4, \"titel\": \"Private fester planlægges kun gennem samtaler og mails\", \"hvad\": \"Et bryllup kræver mindst tre til fire samtaler plus rundvisning, mails og opfølgende spørgsmål. Et firmaarrangement for 250 personer klares ofte med ét møde.\", \"hvorfor\": \"Kunden kan ikke selv udfylde valg og detaljer, så alt gennemgås i møder og mails. Private fester er de mest tidskrævende for salg.\", \"hvem\": \"Salgsafdelingen\", \"krav\": [{\"p\": \"COULD\", \"t\": \"Når kunden planlægger en fest, skal kunden selv kunne udfylde valg og detaljer digitalt mellem møderne.\"}]}, {\"id\": \"V25\", \"rejse\": \"K08 Virksomhed eller gruppe\", \"fase\": \"3 Ankomst og ophold\", \"tid\": 3, \"titel\": \"Systemerne viser forskellige tider og tilkøb\", \"hvad\": \"Systemerne viser forskellige tider og tilkøb (13 eller 13.30, fadøl tilkøbt eller ej), og aftaler ligger flere steder end Spectra. En lørdag kl. 22 kan personalet ikke se, hvad der er aftalt.\", \"hvorfor\": \"Gruppen får ikke det aftalte, og personalet kan ikke afklare det på stedet.\", \"hvem\": \"Driften og værten\", \"krav\": [{\"p\": \"MUST\", \"t\": \"Når et arrangement afvikles, skal alle afdelinger se de samme tider, antal og tilkøb.\"}]}, {\"id\": \"V19\", \"rejse\": \"K08 Virksomhed eller gruppe\", \"fase\": \"3 Ankomst og ophold\", \"tid\": 4, \"titel\": \"Koordineringsmøde og mail hver uge\", \"hvad\": \"Hver uge gennemgår afdelingerne den kommende uge på et koordineringsmøde for at se, hvad der står i systemerne. Ændringer bagefter sendes i en mail.\", \"hvorfor\": \"Mange afdelinger bruger tid på et møde, og ændringer mellem møderne når ikke alle.\", \"hvem\": \"Salgsafdelingen, værten og driften\", \"krav\": [{\"p\": \"MUST\", \"t\": \"Når et arrangement ændres efter overleveringen, skal de berørte afdelinger automatisk få besked om, hvad der er ændret.\"}]}, {\"id\": \"V26\", \"rejse\": \"K08 Virksomhed eller gruppe\", \"fase\": \"3 Ankomst og ophold\", \"tid\": 4, \"titel\": \"Navnelister til nøglekort er en tung manuel opgave\", \"hvad\": \"Digital check in kræver deltagernes telefonnumre. Navnelisterne kommer på mail eller i en formular og skal tastes ind i hånden, før nøglekort og AeroGuest kan bruges.\", \"hvorfor\": \"Tungt manuelt arbejde for salg og reception, og fejl i listerne giver fejl i nøglekort.\", \"hvem\": \"Salgsafdelingen og receptionen\", \"krav\": [{\"p\": \"SHOULD\", \"t\": \"Når en virksomhed har deltagere med overnatning, skal kontaktpersonen selv kunne skrive navne og telefonnumre ind digitalt.\"}]}, {\"id\": \"V24\", \"rejse\": \"K08 Virksomhed eller gruppe\", \"fase\": \"3 Ankomst og ophold\", \"tid\": 4, \"titel\": \"Restaurantchefen samler dagen fra tre systemer og bemander i Word\", \"hvad\": \"Restaurantchefen går ind i hver booking i Spectra og kigger i DinnerBooking og HalBooking for at bemande. Fordelingen laves i Word og sendes i Quinyx (vagtplan).\", \"hvorfor\": \"Meget tid til at samle overblik, som et system kunne give.\", \"hvem\": \"Restaurantchefen\", \"krav\": [{\"p\": \"SHOULD\", \"t\": \"Når restaurantchefen planlægger dagen, skal alle arrangementer, borde og aktiviteter kunne ses ét sted.\"}, {\"p\": \"COULD\", \"t\": \"Når bemandingen planlægges, skal antal gæster kunne hentes direkte ind i vagtplanen.\"}]}, {\"id\": \"V32\", \"rejse\": \"K08 Virksomhed eller gruppe\", \"fase\": \"4 Betaling og afregning\", \"tid\": 3, \"titel\": \"Fakturaen gennemgås linje for linje før afsendelse\", \"hvad\": \"Salg gennemgår fakturaen linje for linje og finder dobbeltposteringer, fx middag og vin på både arrangement og restaurantbon. Kunder ringer alligevel om forkerte fakturaer.\", \"hvorfor\": \"Meget tid pr. faktura, og dobbeltposteringer kan blive overset.\", \"hvem\": \"Salgsafdelingen\", \"krav\": [{\"p\": \"SHOULD\", \"t\": \"Når et arrangement faktureres, skal hver ydelse kun være registreret ét sted, så fakturaen er rigtig fra start og ikke skal gennemgås linje for linje.\"}]}, {\"id\": \"V37\", \"rejse\": \"K08 Virksomhed eller gruppe\", \"fase\": \"4 Betaling og afregning\", \"tid\": 3, \"titel\": \"Forudbetalinger indlæses i hånden hver dag\", \"hvad\": \"Der er ingen bankintegration. Hver dag trækkes en fil med indbetalinger fra Nordea og læses ind i Spectra og Business Central. Ellers kan receptionen ikke se, at kunden har betalt.\", \"hvorfor\": \"Daglig manuel opgave, også hen over jul og nytår, så økonomi ikke kan lukke ned.\", \"hvem\": \"Økonomiafdelingen og receptionen\", \"krav\": [{\"p\": \"MUST\", \"t\": \"Når en kunde betaler, skal betalingen automatisk stå på bookingen og i økonomisystemet.\"}]}, {\"id\": \"V38\", \"rejse\": \"K08 Virksomhed eller gruppe\", \"fase\": \"4 Betaling og afregning\", \"tid\": 3, \"titel\": \"Business club rabat skrives på varen og ses ikke som rabat\", \"hvad\": \"Business Club rabat skrives på varen og registreres ikke som rabat. Satserne er forskellige for mad, vin og øl. Ekstra køb kræver manuel faktura og en forklarende mail.\", \"hvorfor\": \"HimmerLand kan ikke følge rabatten, og ekstra køb giver manuelt arbejde.\", \"hvem\": \"Økonomiafdelingen og salgsafdelingen\", \"krav\": [{\"p\": \"SHOULD\", \"t\": \"Når et Business Club medlem får rabat, skal det fremgå som rabat.\"}, {\"p\": \"SHOULD\", \"t\": \"Når et medlem køber ekstra, skal det kunne trækkes på medlemsaftalen uden manuel faktura.\"}]}, {\"id\": \"V33\", \"rejse\": \"K08 Virksomhed eller gruppe\", \"fase\": \"4 Betaling og afregning\", \"tid\": 3, \"titel\": \"Fakturaer fra Spectra er lange og uigennemsigtige\", \"hvad\": \"Fakturaerne fra Spectra er lange og ikke gennemsigtige, med op til to sider navne og værelser.\", \"hvorfor\": \"Kunden forstår ikke fakturaen og ringer.\", \"hvem\": \"Kunden og salgsafdelingen\", \"krav\": [{\"p\": \"SHOULD\", \"t\": \"Når kunden får en faktura, skal den være kort og overskuelig med detaljerne i et bilag.\"}]}, {\"id\": \"V40\", \"rejse\": \"K08 Virksomhed eller gruppe\", \"fase\": \"5 Efter besøget\", \"tid\": 3, \"titel\": \"Systemet giver ingen opgave om opfølgning efter arrangementet\", \"hvad\": \"Der er ingen opgave eller påmindelse om opfølgning efter et arrangement, så den sker kun hos de kunder, der når at blive prioriteret. Mange følges dog op, når de genbooker.\", \"hvorfor\": \"Kunder uden opfølgning giver ingen feedback.\", \"hvem\": \"Salgsafdelingen\", \"krav\": [{\"p\": \"COULD\", \"t\": \"Når et arrangement er slut, skal salg automatisk få en opgave om at følge op.\"}]}, {\"id\": \"V41\", \"rejse\": \"K08 Virksomhed eller gruppe\", \"fase\": \"5 Efter besøget\", \"tid\": 2, \"titel\": \"Feedback deles ikke i et system\", \"hvad\": \"Feedback deles på mail, mundtligt eller på ugemødet. Kun graverende feedback lægges på gæsteprofilen.\", \"hvorfor\": \"Læring forsvinder, og samme fejl kan gentages.\", \"hvem\": \"Salgsafdelingen og driften\", \"krav\": [{\"p\": \"SHOULD\", \"t\": \"Når der kommer feedback, skal den gemmes på kunden og arrangementet, så alle kan se den.\"}]}, {\"id\": \"V43\", \"rejse\": \"K08 Virksomhed eller gruppe\", \"fase\": \"6 Bag kulissen\", \"tid\": 3, \"titel\": \"Rabatkoder og aftaler med virksomheder er ikke koblet til virksomheden\", \"hvad\": \"Rabatkoder til virksomhedsaftaler ligger i både HalBooking og Spectra uden kobling til virksomheden. Der er ingen standard, og omsætning pr. aftale findes i to systemer.\", \"hvorfor\": \"HimmerLand kan ikke se hvad en aftale er værd uden manuelt arbejde.\", \"hvem\": \"Salgsafdelingen, økonomiafdelingen og ledelsen\", \"krav\": [{\"p\": \"MUST\", \"t\": \"Når en virksomhed får en rabataftale, skal rabatten være koblet til virksomheden og gælde på både ophold og aktiviteter.\"}, {\"p\": \"SHOULD\", \"t\": \"Når HimmerLand ser på en virksomhed, skal aftale, rabat og samlet forbrug kunne ses ét sted.\"}]}, {\"id\": \"V45\", \"rejse\": \"K08 Virksomhed eller gruppe\", \"fase\": \"6 Bag kulissen\", \"tid\": 3, \"titel\": \"Spectra er for tungt til de udadvendte sælgere\", \"hvad\": \"Spectra er så tungt, at de udadvendte sælgere arbejder med blok og telefon. Der er intet let værktøj til at registrere dialogen med kunden.\", \"hvorfor\": \"Dialogen med kunden findes ikke, hvor andre kan se den.\", \"hvem\": \"De udadvendte sælgere\", \"krav\": [{\"p\": \"SHOULD\", \"t\": \"Når en sælger taler med en kunde, skal sælgeren nemt kunne skrive aftalen ind på kunden, også fra telefonen.\"}]}, {\"id\": \"V50\", \"rejse\": \"K08 Virksomhed eller gruppe\", \"fase\": \"6 Bag kulissen\", \"tid\": 5, \"titel\": \"Afdelingerne dobbelttjekker de samme lister\", \"hvad\": \"Salg, reception, restaurant og shop dobbelttjekker de samme lister, fordi en rettelse i Spectra ikke går automatisk videre til DinnerBooking. Det er for vores egen skyld, ikke gæstens.\", \"hvorfor\": \"Mange medarbejdere bruger tid på kontrol, som et fælles system kunne gøre overflødig.\", \"hvem\": \"Salg, reception, restaurant, spa og golfshop\", \"krav\": [{\"p\": \"MUST\", \"t\": \"Når en afdeling bruger en booking, skal den kunne stole på, at den ser den samme opdaterede booking som alle andre, så ingen behøver at dobbelttjekke.\"}]}, {\"id\": \"G1\", \"rejse\": \"K03 Golfrejse og golfgrupper\", \"fase\": \"1 Inspiration og booking\", \"tid\": 5, \"titel\": \"Golfpakkerne kan ikke kombineres\", \"hvad\": \"Golf og spa findes hver for sig. To runder golf og New Course findes ikke som pakke, og der er kun få tilkøb. Derfor ringer eller mailer gæsterne, og det bookes i hånden.\", \"hvorfor\": \"Golfgæsten får ikke den rejse, hun vil have, og salg og reception bruger tid på manuel booking.\", \"hvem\": \"Gæsten, salgsafdelingen og receptionen\", \"krav\": [{\"p\": \"MUST\", \"t\": \"Når gæsten booker et golfophold, skal gæsten selv kunne sætte opholdet sammen med runder, bane, golfbil og spa.\"}, {\"p\": \"SHOULD\", \"t\": \"Når en gruppe har forskellige ønsker, skal hver deltager kunne have sine egne tilvalg på samme booking.\"}]}, {\"id\": \"G2\", \"rejse\": \"K03 Golfrejse og golfgrupper\", \"fase\": \"1 Inspiration og booking\", \"tid\": 5, \"titel\": \"Pakken med green fee giver ikke en starttid\", \"hvad\": \"Opholdspakken indeholder green fee, men starttiden bookes i hånden i GolfBox af HimmerLand. De to systemer taler ikke sammen.\", \"hvorfor\": \"Gæsten får ikke sin starttid med det samme, og en medarbejder skal gøre det manuelt.\", \"hvem\": \"Salgsafdelingen og receptionen\", \"krav\": [{\"p\": \"MUST\", \"t\": \"Når gæsten booker en pakke med green fee, skal gæsten vælge sin starttid i samme bookingflow.\"}]}, {\"id\": \"G3\", \"rejse\": \"K03 Golfrejse og golfgrupper\", \"fase\": \"1 Inspiration og booking\", \"tid\": 3, \"titel\": \"Større golfgrupper skal gennem salg og mail om banen\", \"hvad\": \"Standardophold op til 5 værelser bookes online. Større grupper går til salg, som afklarer på mail, om banen er ledig, og koordinerer hotel og golf i hånden.\", \"hvorfor\": \"Lang svartid og meget mailarbejde, før gruppen kan få tilbud.\", \"hvem\": \"Gæsten og salgsafdelingen\", \"krav\": [{\"p\": \"SHOULD\", \"t\": \"Når en stor golfgruppe spørger, skal det være nemt for salg at finde ledige værelser og starttider.\"}]}, {\"id\": \"G6\", \"rejse\": \"K03 Golfrejse og golfgrupper\", \"fase\": \"1 Inspiration og booking\", \"tid\": 3, \"titel\": \"Udenlandske gæster og agenter kan ikke betjenes på tysk\", \"hvad\": \"Agenter og udenlandske golfgrupper får alt på engelsk, for HimmerLand er ikke klar på tysk. Kun halvdelen af Spectra kan oversættes til engelsk, så resten skrives om i hånden.\", \"hvorfor\": \"Tyskland er et marked med grupperejser, men gæsterne får ikke service på deres sprog, og salg oversætter selv.\", \"hvem\": \"Salgsafdelingen og agenterne\", \"krav\": [{\"p\": \"SHOULD\", \"t\": \"Når en udenlandsk gæst eller agent booker, skal bookingflow, tilbud og bekræftelser være på engelsk.\"}]}, {\"id\": \"G11\", \"rejse\": \"K03 Golfrejse og golfgrupper\", \"fase\": \"2 Tilkøb og aktiviteter\", \"tid\": 3, \"titel\": \"Starttiden kan blive taget, mens der mailes frem og tilbage\", \"hvad\": \"Starttiden kan blive taget af en anden, mens gæsten og HimmerLand mailer frem og tilbage (fx 10.10, så 10.20).\", \"hvorfor\": \"Gæsten mister den tid, der var tilbudt.\", \"hvem\": \"Receptionen og salgsafdelingen\", \"krav\": [{\"p\": \"SHOULD\", \"t\": \"Når gæsten booker golf, skal gæsten selv vælge starttiden, så tider ikke skal mailes frem og tilbage.\"}]}, {\"id\": \"G12\", \"rejse\": \"K03 Golfrejse og golfgrupper\", \"fase\": \"2 Tilkøb og aktiviteter\", \"tid\": 3, \"titel\": \"Betalt golf skal rettes i to systemer, og prisen sættes i hånden til 0\", \"hvad\": \"En ændret starttid rettes både i Spectra og GolfBox, og prisen i GolfBox sættes i hånden til 0 kr for opholdsgæster for at printe scorekort.\", \"hvorfor\": \"Dobbeltarbejde ved hver golftid på et ophold, og risiko for at gæsten bliver bedt om at betale igen.\", \"hvem\": \"Receptionen og salgsafdelingen\", \"krav\": [{\"p\": \"MUST\", \"t\": \"Når en starttid er betalt i opholdet, skal golfsystemet og automaten vide det, så ingen pris skal rettes i hånden.\"}]}, {\"id\": \"G15\", \"rejse\": \"K03 Golfrejse og golfgrupper\", \"fase\": \"2 Tilkøb og aktiviteter\", \"tid\": 3, \"titel\": \"Store grupper blokeres i GolfBox med reservationsnummer og initialer\", \"hvad\": \"Store grupper uden DGU numre blokeres i GolfBox med reservationsnummer og initialer. Blokeringen frigives ikke automatisk ved aflysning, og annullerede ophold skal slettes i hånden.\", \"hvorfor\": \"Tider kan blive stående blokeret, og gæster kan stå uden tid.\", \"hvem\": \"Salgsafdelingen\", \"krav\": [{\"p\": \"MUST\", \"t\": \"Når en gruppe får reserveret starttider, skal de hænge sammen med gruppens booking og frigives af sig selv, hvis gruppen aflyser.\"}]}, {\"id\": \"G10\", \"rejse\": \"K03 Golfrejse og golfgrupper\", \"fase\": \"2 Tilkøb og aktiviteter\", \"tid\": 3, \"titel\": \"DGU numre og starttidsønsker indhentes på mail efter bookingen\", \"hvad\": \"DGU numre og ønskede starttider indhentes på mail efter bookingen. For grupper følges der også op på mail om allergier og bord.\", \"hvorfor\": \"Meget mailarbejde, og bookingen er sjældent færdig før ankomst.\", \"hvem\": \"Receptionen og salgsafdelingen\", \"krav\": [{\"p\": \"SHOULD\", \"t\": \"Når golf bookes, skal DGU numre og ønsker for alle spillere skrives ind med det samme, så intet skal indhentes på mail bagefter.\"}]}, {\"id\": \"G16\", \"rejse\": \"K03 Golfrejse og golfgrupper\", \"fase\": \"2 Tilkøb og aktiviteter\", \"tid\": 3, \"titel\": \"Golfbiler bookes i spaens system og noteres i golfsystemet\", \"hvad\": \"Golfbiler bookes i Spectra under spafanen og noteres i GolfBox. De lejes også i FlexPos. Gæsten booker ikke selv og må maile eller gå i shoppen.\", \"hvorfor\": \"Bilerne kan blive booket to steder, og systemerne viser ikke samme status.\", \"hvem\": \"Receptionen og golfshoppen\", \"krav\": [{\"p\": \"SHOULD\", \"t\": \"Når en golfbil bookes, lejes eller betales, skal det ske ét sted, som både reception og shop kan se.\"}]}, {\"id\": \"G23\", \"rejse\": \"K03 Golfrejse og golfgrupper\", \"fase\": \"3 Ankomst og ophold\", \"tid\": 3, \"titel\": \"Shoppen tjekker dagens golfgæster mellem to systemer\", \"hvad\": \"Shoppen trækker en arbejdsliste og tjekker Spectra mod GolfBox, også for golfbiler.\", \"hvorfor\": \"Hver morgen bruges tid på at sammenligne lister.\", \"hvem\": \"Golfshoppen\", \"krav\": [{\"p\": \"SHOULD\", \"t\": \"Når dagen starter, skal shoppen kunne se dagens golfgæster, tider og golfbiler i én liste.\"}]}, {\"id\": \"G38\", \"rejse\": \"K03 Golfrejse og golfgrupper\", \"fase\": \"3 Ankomst og ophold\", \"tid\": 3, \"titel\": \"To computere til samme golfkunde i shoppen\", \"hvad\": \"I golfshoppen bookes starttiden i GolfBox på én computer, og betalingen tages i kassen på en anden. I restauranten kører booking og betaling på samme computer.\", \"hvorfor\": \"Medarbejderen skifter mellem to computere ved hver golfkunde.\", \"hvem\": \"Golfshoppen\", \"krav\": [{\"p\": \"SHOULD\", \"t\": \"Når shoppen ekspederer en golfgæst, skal starttid og betaling kunne klares på samme skærm.\"}]}, {\"id\": \"G29\", \"rejse\": \"K03 Golfrejse og golfgrupper\", \"fase\": \"4 Betaling og afregning\", \"tid\": 2, \"titel\": \"Der er ingen faste regler for gruppers betaling\", \"hvad\": \"Systemet har ingen faste betalingsformer for grupper, så det vurderes fra gang til gang, om en gruppe får rater, betalingslink eller betaler online.\", \"hvorfor\": \"Salg skal beslutte hver gang, og grupperne behandles forskelligt.\", \"hvem\": \"Salgsafdelingen\", \"krav\": [{\"p\": \"SHOULD\", \"t\": \"Når en gruppe skal betale, skal der kun være én eller to faste måder at betale på, som systemet håndterer.\"}]}, {\"id\": \"G36\", \"rejse\": \"K03 Golfrejse og golfgrupper\", \"fase\": \"4 Betaling og afregning\", \"tid\": 2, \"titel\": \"Golfbil kan betales to steder\", \"hvad\": \"Receptionen booker golfbilen i Spectras spafane med pris og skriver i en note i GolfBox, om den er betalt. Shoppen kan også leje bilen ud via FlexPos.\", \"hvorfor\": \"Shoppen skal tjekke to systemer for at se, om der er betalt, og ingen ved helt, hvorfor noten skrives.\", \"hvem\": \"Receptionen og golfshoppen\", \"krav\": [{\"p\": \"SHOULD\", \"t\": \"Når en golfbil betales, skal det kunne ses ét sted, om den er betalt på opholdet eller i shoppen.\"}]}, {\"id\": \"G30\", \"rejse\": \"K03 Golfrejse og golfgrupper\", \"fase\": \"5 Efter besøget\", \"tid\": 2, \"titel\": \"Ingen opfølgning efter golfrejser\", \"hvad\": \"Systemet giver ingen opgave om at følge op efter golfrejser og golfgrupper, og der er ingen opfølgning med agenterne. Gæsterne får kun den automatiske feedbackmail.\", \"hvorfor\": \"Om gruppen eller agenten kommer igen, afhænger af, at de selv tager kontakt.\", \"hvem\": \"Salgsafdelingen\", \"krav\": [{\"p\": \"SHOULD\", \"t\": \"Når en golfgruppe eller en agents gæster har været der, skal salg automatisk få en opgave om at følge op.\"}]}, {\"id\": \"G31\", \"rejse\": \"K03 Golfrejse og golfgrupper\", \"fase\": \"5 Efter besøget\", \"tid\": 2, \"titel\": \"Feedbackmailen kræver gæstens mail\", \"hvad\": \"Feedbackmailen kræver gæstens mailadresse, som typisk først kommer via AeroGuest (online check in).\", \"hvorfor\": \"Gæster, der ikke tjekker ind online, får ikke spørgsmål om deres oplevelse.\", \"hvem\": \"Receptionen\", \"krav\": [{\"p\": \"SHOULD\", \"t\": \"Når et ophold bookes online, på telefon eller via online check in, skal gæstens mailadresse være påkrævet, så gæsten altid får feedbackmailen.\"}]}, {\"id\": \"G35\", \"rejse\": \"K03 Golfrejse og golfgrupper\", \"fase\": \"6 Bag kulissen\", \"tid\": 2, \"titel\": \"Vagtplanen til golfarrangementer laves ud fra et hjemmelavet udtræk\", \"hvad\": \"Vagtplanen til company days og golfarrangementer laves ud fra et hjemmelavet Power BI udtræk af bekræftede bookinger fra Spectra.\", \"hvorfor\": \"Udtrækket er hjemmelavet og skal vedligeholdes.\", \"hvem\": \"Golfafdelingen og aktivitet\", \"krav\": [{\"p\": \"COULD\", \"t\": \"Når golf eller aktiviteter bookes, skal bemandingsbehovet kunne ses uden et hjemmelavet udtræk.\"}]}, {\"id\": \"G37\", \"rejse\": \"K03 Golfrejse og golfgrupper\", \"fase\": \"6 Bag kulissen\", \"tid\": 2, \"titel\": \"Golfbiler tildeles manuelt uden data om slid\", \"hvad\": \"Bilerne tildeles efter rotation, bil 1 til 20 dag 1 og bil 21 dag 2. Rengøring er håndholdt.\", \"hvorfor\": \"Ingen data om brug og slid, og tildelingen afhænger af manuel styring.\", \"hvem\": \"Golfshoppen\", \"krav\": [{\"p\": \"COULD\", \"t\": \"Når golfbiler deles ud, skal systemet vide, hvor meget hver bil er brugt.\"}]}]\u003c/script>\n\u003cscript type=\"application/json\" id=\"hl-begreber\">{\"beg\": {\"BG-001\": {\"navn\": \"Gæst\", \"omr\": \"Gæster, kunder og roller\", \"niv\": 1, \"type\": \"Part eller rolle\", \"def\": \"En person, der bruger, booker eller betaler for HimmerLands ydelser, uanset om personen overnatter, kommer for en dag eller deltager i et arrangement.\", \"syn\": \"Opholdsgæst, dagsgæst, restaurantgæst; 'hr. og fru Jensen'. 'Bruger' frarådes (bruges om login).\", \"ikke\": \"Kunde (den der hæfter), Deltager (kan være et navn uden kendt person), Brugerkonto (login).\"}, \"BG-002\": {\"navn\": \"Organisation\", \"omr\": \"Gæster, kunder og roller\", \"niv\": 1, \"type\": \"Part eller rolle\", \"def\": \"En virksomhed, forening, institution eller anden juridisk enhed, der køber hos HimmerLand eller formidler salg på vegne af andre.\", \"syn\": \"Virksomhed, firma, erhvervskunde, B2B-kunde, selskab. Salg og IT siger ofte 'kunder' om virksomheder.\", \"ikke\": \"Kontaktperson (personen i virksomheden).\"}, \"BG-003\": {\"navn\": \"Kunde\", \"omr\": \"Gæster, kunder og roller\", \"niv\": 1, \"type\": \"Part eller rolle\", \"def\": \"Den gæst eller organisation, der køber en booking eller et tilbud og hæfter for betalingen.\", \"syn\": \"Debitor (økonomi), bestiller, aftalepart.\", \"ikke\": \"Gæst (den der bruger ydelsen) og Organisation (en kunde kan også være en privatperson).\"}, \"BG-004\": {\"navn\": \"Part\", \"omr\": \"Gæster, kunder og roller\", \"niv\": 2, \"type\": \"Part eller rolle\", \"def\": \"En person eller organisation, som HimmerLand har en relation til.\", \"syn\": \"Bruges kun i modellen.\", \"ikke\": \"Kunde.\"}, \"BG-005\": {\"navn\": \"Kontaktperson\", \"omr\": \"Gæster, kunder og roller\", \"niv\": 1, \"type\": \"Part eller rolle\", \"def\": \"En gæst, der repræsenterer en organisation over for HimmerLand, fx som bestiller, fakturamodtager eller mødeleder.\", \"syn\": \"Arrangør, bestiller, tovholder, golfgruppens kaptajn.\", \"ikke\": \"Deltager (er med, men repræsenterer ikke organisationen).\"}, \"BG-006\": {\"navn\": \"Mødeleder\", \"omr\": \"Gæster, kunder og roller\", \"niv\": 2, \"type\": \"Part eller rolle\", \"def\": \"En kontaktperson, der leder kundens arrangement på dagen og gennemgår programmet med konferenceværten.\", \"syn\": \"Konferenceleder.\", \"ikke\": \"Bestiller (den der har købt arrangementet).\"}, \"BG-007\": {\"navn\": \"Deltager\", \"omr\": \"Gæster, kunder og roller\", \"niv\": 1, \"type\": \"Part eller rolle\", \"def\": \"En person, der er med i en booking eller et arrangement uden nødvendigvis selv at have booket.\", \"syn\": \"Medrejsende, spiller, konferencegæst, kursist.\", \"ikke\": \"Kontaktperson og Kunde.\"}, \"BG-008\": {\"navn\": \"Gruppe\", \"omr\": \"Gæster, kunder og roller\", \"niv\": 1, \"type\": \"Part eller rolle\", \"def\": \"Flere gæster, der booker og rejser sammen under én booking, fx en firmagruppe, en golfgruppe eller et selskab.\", \"syn\": \"Firmagruppe, golfgruppe, selskab, turgruppe.\", \"ikke\": \"Arrangement (indholdet) og Deltagerliste (navnene).\"}, \"BG-009\": {\"navn\": \"Opholdsgæst\", \"omr\": \"Gæster, kunder og roller\", \"niv\": 1, \"type\": \"Part eller rolle\", \"def\": \"En gæst, der har en overnatning på et værelse eller i et feriehus i en periode.\", \"syn\": \"Boende gæst, hotelgæst, receptionsgæst.\", \"ikke\": \"Dagsgæst.\"}, \"BG-010\": {\"navn\": \"Dagsgæst\", \"omr\": \"Gæster, kunder og roller\", \"niv\": 1, \"type\": \"Part eller rolle\", \"def\": \"En gæst, der bruger resortet uden at overnatte, fx til golf, padel, spa eller restaurant.\", \"syn\": \"Lokal gæst, gæst udefra.\", \"ikke\": \"Walk-in (en dagsgæst kan sagtens have booket).\"}, \"BG-011\": {\"navn\": \"Walk-in\", \"omr\": \"Gæster, kunder og roller\", \"niv\": 2, \"type\": \"Part eller rolle\", \"def\": \"En gæst, der møder op og køber uden forudgående booking, typisk i en restaurant eller bar.\", \"syn\": \"Gæst fra gaden.\", \"ikke\": \"Dagsgæst.\"}, \"BG-012\": {\"navn\": \"Restaurantgæst\", \"omr\": \"Gæster, kunder og roller\", \"niv\": 2, \"type\": \"Part eller rolle\", \"def\": \"En gæst, der spiser i en af resortets restauranter, uanset om gæsten overnatter.\", \"syn\": \"À la carte-gæst.\", \"ikke\": \"Opholdsgæst og Dagsgæst.\"}, \"BG-013\": {\"navn\": \"Golfspiller\", \"omr\": \"Gæster, kunder og roller\", \"niv\": 1, \"type\": \"Part eller rolle\", \"def\": \"En gæst, der spiller golf, kendt ved sit DGU-nummer, sin hjemmeklub og sit handicap.\", \"syn\": \"Spiller, golfgæst, greenfee-gæst.\", \"ikke\": \"Golfklubmedlemskab.\"}, \"BG-014\": {\"navn\": \"Leisure-gæst\", \"omr\": \"Gæster, kunder og roller\", \"niv\": 2, \"type\": \"Part eller rolle\", \"def\": \"En gæst, der besøger resortet privat og selv betaler.\", \"syn\": \"Læsergæst, privatgæst, 'hr. og fru Jensen'.\", \"ikke\": \"Dagsgæst.\"}, \"BG-015\": {\"navn\": \"Business-gæst\", \"omr\": \"Gæster, kunder og roller\", \"niv\": 2, \"type\": \"Part eller rolle\", \"def\": \"En gæst, der deltager i et møde, en konference eller et firmaarrangement på en organisations regning.\", \"syn\": \"Konferencegæst, mødegæst, firmagæst, B2B-gæst.\", \"ikke\": \"Kontaktperson.\"}, \"BG-016\": {\"navn\": \"Agent\", \"omr\": \"Gæster, kunder og roller\", \"niv\": 1, \"type\": \"Part eller rolle\", \"def\": \"En organisation, der videresælger HimmerLands ophold og pakker til egne kunder, fx et golfrejsebureau i England eller Tyskland.\", \"syn\": \"Turoperatør, rejsearrangør, partner (fx Nordic Golfers).\", \"ikke\": \"OTA (sælger værelser online).\"}, \"BG-017\": {\"navn\": \"OTA\", \"omr\": \"Gæster, kunder og roller\", \"niv\": 2, \"type\": \"Part eller rolle\", \"def\": \"En online bookingportal, fx Booking.com eller Expedia, der sælger HimmerLands værelser mod provision.\", \"syn\": \"Bookingportal, bookingpartner.\", \"ikke\": \"Agent (sælger pakker til egne kunder).\"}, \"BG-018\": {\"navn\": \"Golfklub\", \"omr\": \"Gæster, kunder og roller\", \"niv\": 2, \"type\": \"Part eller rolle\", \"def\": \"En organisation, som golfspillere er medlemmer af, enten HimmerLands egen golfklub eller en anden klub.\", \"syn\": \"Hjemmeklub, klub.\", \"ikke\": \"Golfklubmedlemskab (HimmerLands egen ordning).\"}, \"BG-019\": {\"navn\": \"Husejer\", \"omr\": \"Gæster, kunder og roller\", \"niv\": 2, \"type\": \"Part eller rolle\", \"def\": \"En person, der ejer et feriehus på resortet og har et medlemskab hos HimmerLand som husejer.\", \"syn\": \"Husejerkort.\", \"ikke\": \"Opholdsgæst, der lejer et feriehus.\"}, \"BG-167\": {\"navn\": \"Privat udlejning\", \"omr\": \"Gæster, kunder og roller\", \"niv\": 2, \"type\": \"Hændelse\", \"def\": \"En husejers egen udlejning af sit feriehus uden om HimmerLand.\", \"syn\": \"Husejerudlejning.\", \"ikke\": \"Ophold (HimmerLands egen udlejning).\"}, \"BG-020\": {\"navn\": \"Koncernmedarbejder\", \"omr\": \"Gæster, kunder og roller\", \"niv\": 2, \"type\": \"Part eller rolle\", \"def\": \"En ansat i Lars Larsen Group, som har ret til medarbejderrabat hos HimmerLand.\", \"syn\": \"JYSK-medarbejder, LLG-medarbejder.\", \"ikke\": \"Medarbejder (ansat hos HimmerLand).\"}, \"BG-021\": {\"navn\": \"Stamgæst\", \"omr\": \"Gæster, kunder og roller\", \"niv\": 2, \"type\": \"Part eller rolle\", \"def\": \"En gæst, der kommer igen flere gange over en periode.\", \"syn\": \"Stamkunde, faste gæster.\", \"ikke\": \"Medlem (har en ordning).\"}, \"BG-022\": {\"navn\": \"Medarbejder\", \"omr\": \"Gæster, kunder og roller\", \"niv\": 2, \"type\": \"Part eller rolle\", \"def\": \"En person, der er ansat hos HimmerLand.\", \"syn\": \"Ansat, kollega.\", \"ikke\": \"Koncernmedarbejder, Instruktør (kan være ekstern).\"}, \"BG-023\": {\"navn\": \"Rolle\", \"omr\": \"Gæster, kunder og roller\", \"niv\": 2, \"type\": \"Part eller rolle\", \"def\": \"En funktion, en medarbejder udfører, uafhængigt af hvilken afdeling medarbejderen hører til.\", \"syn\": \"Funktion, stilling.\", \"ikke\": \"Afdeling.\"}, \"BG-024\": {\"navn\": \"Konferencevært\", \"omr\": \"Gæster, kunder og roller\", \"niv\": 2, \"type\": \"Part eller rolle\", \"def\": \"En medarbejder i rollen som vært, der tager imod et arrangement på dagen, gennemgår programmet med mødelederen og giver ændringer videre til driften.\", \"syn\": \"Vært, værtskabsrollen.\", \"ikke\": \"Mødeleder (kundens person).\"}, \"BG-025\": {\"navn\": \"Sælger\", \"omr\": \"Gæster, kunder og roller\", \"niv\": 2, \"type\": \"Part eller rolle\", \"def\": \"En medarbejder i salg, der håndterer forespørgsler, tilbud og opfølgning over for virksomheder, grupper og agenter.\", \"syn\": \"Salgsmanager, golfmanager, salgsafdelingen.\", \"ikke\": \"Kontaktperson (kundens person).\"}, \"BG-026\": {\"navn\": \"Afdeling\", \"omr\": \"Gæster, kunder og roller\", \"niv\": 2, \"type\": \"Part eller rolle\", \"def\": \"En organisatorisk enhed i HimmerLand, fx reception, salg, F&B, aktivitet, golf, housekeeping, teknik eller økonomi.\", \"syn\": \"Afd.\", \"ikke\": \"Rolle og Lokation.\"}, \"BG-027\": {\"navn\": \"Leverandør\", \"omr\": \"Gæster, kunder og roller\", \"niv\": 2, \"type\": \"Part eller rolle\", \"def\": \"En ekstern organisation, der leverer en del af en ydelse til gæsten efter bestilling fra HimmerLand, fx blomster.\", \"syn\": \"Underleverandør.\", \"ikke\": \"Agent.\"}, \"BG-028\": {\"navn\": \"Promotor\", \"omr\": \"Gæster, kunder og roller\", \"niv\": 3, \"type\": \"Part eller rolle\", \"def\": \"En organisation, der ejer et eksternt event, fx en turnering, som HimmerLand er vært for.\", \"syn\": \"Eventpartner.\", \"ikke\": \"Agent.\"}, \"BG-029\": {\"navn\": \"Henvendelse\", \"omr\": \"Salg, dialog og aftaler\", \"niv\": 2, \"type\": \"Hændelse\", \"def\": \"En kontakt mellem HimmerLand og en gæst eller organisation, fx et opkald, en mail, en formular eller en besked.\", \"syn\": \"Kontakt, dialog, touchpoint.\", \"ikke\": \"Forespørgsel (har et konkret købsønske).\"}, \"BG-030\": {\"navn\": \"Forespørgsel\", \"omr\": \"Salg, dialog og aftaler\", \"niv\": 1, \"type\": \"Hændelse\", \"def\": \"En henvendelse med et konkret købsønske, der kræver afklaring og et tilbud, fx en konference, en golfgruppe eller en fest.\", \"syn\": \"Lead, konferenceforespørgsel.\", \"ikke\": \"Booking.\"}, \"BG-031\": {\"navn\": \"Tilbud\", \"omr\": \"Salg, dialog og aftaler\", \"niv\": 1, \"type\": \"Ting eller aftale\", \"def\": \"HimmerLands skriftlige pristilbud til én kunde, som bliver til en bekræftet booking, når kunden accepterer det.\", \"syn\": \"Kontrakt, oplæg.\", \"ikke\": \"Kampagne (til alle) og Bekræftelse (efter booking).\"}, \"BG-032\": {\"navn\": \"Accept\", \"omr\": \"Salg, dialog og aftaler\", \"niv\": 2, \"type\": \"Hændelse\", \"def\": \"Kundens bindende godkendelse af et tilbud.\", \"syn\": \"Underskrift, kontraktgodkendelse.\", \"ikke\": \"Samtykke (GDPR) og Bekræftelse (HimmerLands besked).\"}, \"BG-033\": {\"navn\": \"Salgskanal\", \"omr\": \"Salg, dialog og aftaler\", \"niv\": 1, \"type\": \"Ting eller aftale\", \"def\": \"Den vej, en booking eller forespørgsel kommer ind ad, fx hjemmeside, OTA, agent, telefon, mail, reception eller aktivitetsstand.\", \"syn\": \"Kanal, bookingkanal, indgang.\", \"ikke\": \"Lokation (hvor ydelsen leveres).\"}, \"BG-034\": {\"navn\": \"Kampagne\", \"omr\": \"Salg, dialog og aftaler\", \"niv\": 2, \"type\": \"Ting eller aftale\", \"def\": \"Et tidsbegrænset salgstilbud til alle gæster, fx en julepakke eller 'to valgfrie aktiviteter', som vises på hjemmesiden.\", \"syn\": \"Pakker og tilbud, sommerpakke.\", \"ikke\": \"Tilbud.\"}, \"BG-035\": {\"navn\": \"Aftale\", \"omr\": \"Salg, dialog og aftaler\", \"niv\": 1, \"type\": \"Ting eller aftale\", \"def\": \"En kommerciel aftale mellem HimmerLand og en organisation om priser, rabatter, kapacitet eller provision i en periode.\", \"syn\": \"Firmaaftale, rammeaftale, samarbejdsaftale.\", \"ikke\": \"Tilbud (enkelt salg) og Medlemskab.\"}, \"BG-036\": {\"navn\": \"Virksomhedsaftale\", \"omr\": \"Salg, dialog og aftaler\", \"niv\": 2, \"type\": \"Ting eller aftale\", \"def\": \"En aftale med en virksomhed om firmapris på ophold, møder og aktiviteter for virksomheden og dens medarbejdere.\", \"syn\": \"Firmaaftale, rammeaftale, lokal aftale.\", \"ikke\": \"Business Club.\"}, \"BG-037\": {\"navn\": \"Agentaftale\", \"omr\": \"Salg, dialog og aftaler\", \"niv\": 2, \"type\": \"Ting eller aftale\", \"def\": \"En aftale med en agent om priskoder, pakker, evt. kapacitet og provision.\", \"syn\": \"Firmaaftale med agent.\", \"ikke\": \"OTA-aftale.\"}, \"BG-038\": {\"navn\": \"Cross country-aftale\", \"omr\": \"Salg, dialog og aftaler\", \"niv\": 2, \"type\": \"Ting eller aftale\", \"def\": \"En aftale med fire andre golfklubber, der giver deres medlemmer to gratis runder hver på HimmerLands baner.\", \"syn\": \"Cross country.\", \"ikke\": \"Golfklubmedlemskab.\"}, \"BG-039\": {\"navn\": \"Provision\", \"omr\": \"Salg, dialog og aftaler\", \"niv\": 2, \"type\": \"Egenskab\", \"def\": \"Den andel af prisen, en agent eller OTA får for at formidle en booking.\", \"syn\": \"Kommission.\", \"ikke\": \"Rabat (prisnedslag til kunden).\"}, \"BG-040\": {\"navn\": \"Priskode\", \"omr\": \"Salg, dialog og aftaler\", \"niv\": 2, \"type\": \"Ting eller aftale\", \"def\": \"En aftalt prisstruktur, der gælder for en kunde, agent, kanal eller periode.\", \"syn\": \"Rate code, firmapris, bookingkode.\", \"ikke\": \"Rabatkode (indtastes af gæsten).\"}, \"BG-041\": {\"navn\": \"Rabatkode\", \"omr\": \"Salg, dialog og aftaler\", \"niv\": 2, \"type\": \"Ting eller aftale\", \"def\": \"En kode, som gæsten indtaster ved booking for at få en rabat eller indløse en inkluderet ydelse.\", \"syn\": \"Kampagnekode, kode.\", \"ikke\": \"Priskode.\"}, \"BG-042\": {\"navn\": \"Opfølgning\", \"omr\": \"Salg, dialog og aftaler\", \"niv\": 1, \"type\": \"Hændelse\", \"def\": \"En planlagt kontakt fra HimmerLand til en kunde før eller efter besøget for at afklare detaljer, sælge mere eller sige tak.\", \"syn\": \"Kontaktpunkt, seks-ugers-mail, tak for sidst.\", \"ikke\": \"Bekræftelse (HimmerLands besked om bookingen).\"}, \"BG-043\": {\"navn\": \"Genbooking\", \"omr\": \"Salg, dialog og aftaler\", \"niv\": 2, \"type\": \"Hændelse\", \"def\": \"En kundes booking af samme eller et tilsvarende arrangement igen, typisk til næste år.\", \"syn\": \"Booke igen.\", \"ikke\": \"Stamgæst.\"}, \"BG-044\": {\"navn\": \"Mersalg\", \"omr\": \"Salg, dialog og aftaler\", \"niv\": 2, \"type\": \"Hændelse\", \"def\": \"Salg af tilkøb, opgraderinger eller aktiviteter ud over det, gæsten først har købt.\", \"syn\": \"Opgradering, tilvalg.\", \"ikke\": \"Tilkøb (det, der sælges).\"}, \"BG-045\": {\"navn\": \"Samtykke\", \"omr\": \"Salg, dialog og aftaler\", \"niv\": 2, \"type\": \"Ting eller aftale\", \"def\": \"Gæstens tilladelse til, at HimmerLand må sende nyhedsbrev, markedsføre eller profilere.\", \"syn\": \"Permission, GDPR-samtykke, tilmelding til nyhedsbrev.\", \"ikke\": \"Accept (juridisk aftale).\"}, \"BG-046\": {\"navn\": \"Salgsstop\", \"omr\": \"Salg, dialog og aftaler\", \"niv\": 2, \"type\": \"Hændelse\", \"def\": \"En bevidst lukning for salg af en pakke, en kanal eller en periode for at holde plads til forventede grupper eller arrangementer.\", \"syn\": \"'Pakke huset', lukke ned.\", \"ikke\": \"Kapacitetsreservation.\"}, \"BG-047\": {\"navn\": \"Salgsmulighed\", \"omr\": \"Salg, dialog og aftaler\", \"niv\": 3, \"type\": \"Hændelse\", \"def\": \"En forventet, endnu ikke bekræftet booking, som en sælger regner med.\", \"syn\": \"Pipeline.\", \"ikke\": \"Forespørgsel.\"}, \"BG-048\": {\"navn\": \"Tilbudsgrundlag\", \"omr\": \"Salg, dialog og aftaler\", \"niv\": 3, \"type\": \"Egenskab\", \"def\": \"De oplysninger, salg skal have for at kunne give en pris: dato, antal, formål, forplejning og kontaktdata.\", \"syn\": \"Oplysningsark.\", \"ikke\": \"Forespørgsel.\"}, \"BG-049\": {\"navn\": \"Medlemskab\", \"omr\": \"Medlemskab og fordele\", \"niv\": 1, \"type\": \"Ting eller aftale\", \"def\": \"En tidsbegrænset ordning, der mod betaling giver en virksomhed eller person fordele hos HimmerLand.\", \"syn\": \"Klubmedlemskab, medlemskort.\", \"ikke\": \"Aftale (kommercielle vilkår) og Loyalitetsprogram (belønner forbrug).\"}, \"BG-050\": {\"navn\": \"Business Club\", \"omr\": \"Medlemskab og fordele\", \"niv\": 2, \"type\": \"Ting eller aftale\", \"def\": \"Et medlemskab for virksomheder med årligt kontingent, medlemskort, rabatter og ca. 7 medlemsarrangementer om året.\", \"syn\": \"Erhvervsklubben, BC.\", \"ikke\": \"Virksomhedsaftale.\"}, \"BG-051\": {\"navn\": \"Golfklubmedlemskab\", \"omr\": \"Medlemskab og fordele\", \"niv\": 2, \"type\": \"Ting eller aftale\", \"def\": \"Et medlemskab af HimmerLands egen golfklub, som giver gratis spil og ret til selv at bekræfte starttider.\", \"syn\": \"Golfklubben.\", \"ikke\": \"Golfklub (organisationen) og medlemskab af andre klubber.\"}, \"BG-052\": {\"navn\": \"Medlem\", \"omr\": \"Medlemskab og fordele\", \"niv\": 1, \"type\": \"Part eller rolle\", \"def\": \"En person, der er tilknyttet et medlemskab og bruger dets fordele.\", \"syn\": \"Kortholder, klubmedlem.\", \"ikke\": \"Medlemskab (ordningen) og Kunde (den der betaler for medlemskabet).\"}, \"BG-053\": {\"navn\": \"Medlemskort\", \"omr\": \"Medlemskab og fordele\", \"niv\": 2, \"type\": \"Ting eller aftale\", \"def\": \"Det kort, der identificerer et medlem ved køb, så fordelen gives, og købet kan opkræves via medlemskabet.\", \"syn\": \"Fordelskort, kundekort, Business Club-kort, husejerkort.\", \"ikke\": \"Adgangsmedie (værelseskort) og Gavekort.\"}, \"BG-054\": {\"navn\": \"Medlemsfordel\", \"omr\": \"Medlemskab og fordele\", \"niv\": 2, \"type\": \"Ting eller aftale\", \"def\": \"En konkret fordel, et medlemskab giver, fx en rabatsats pr. varekategori, gratis greenfee eller gratis rangebolde.\", \"syn\": \"Medlemsrabat, bestyrelsesrabat, fribillet.\", \"ikke\": \"Rabatkode.\"}, \"BG-055\": {\"navn\": \"Medlemsarrangement\", \"omr\": \"Medlemskab og fordele\", \"niv\": 2, \"type\": \"Hændelse\", \"def\": \"Et arrangement kun for medlemmer, fx Business Clubs ProAm-golfturnering.\", \"syn\": \"Klubarrangement, BC-event.\", \"ikke\": \"Arrangement for en ekstern kunde.\"}, \"BG-056\": {\"navn\": \"Medlemstillæg\", \"omr\": \"Medlemskab og fordele\", \"niv\": 3, \"type\": \"Ting eller aftale\", \"def\": \"Et tillæg, der købes til et medlemskab, fx ekstra medlemskort, golfklubmedlemskab eller ekstra greenfee-billetter.\", \"syn\": \"Tilvalg til medlemskab.\", \"ikke\": \"Tilkøb til en booking.\"}, \"BG-057\": {\"navn\": \"Loyalitetsprogram\", \"omr\": \"Medlemskab og fordele\", \"niv\": 2, \"type\": \"Ting eller aftale\", \"def\": \"En ordning, der belønner gæster for gentagne køb på tværs af resortet, fx med point.\", \"syn\": \"Fordelsprogram, point, klippekort.\", \"ikke\": \"Medlemskab (betales med kontingent).\"}, \"BG-058\": {\"navn\": \"Produkt\", \"omr\": \"Produkt, pakke og pris\", \"niv\": 1, \"type\": \"Ting eller aftale\", \"def\": \"Det, HimmerLand sælger, fx overnatning, behandling, greenfee, middag, mødelokale, leje eller en vare i shoppen.\", \"syn\": \"Ydelse, vare, varenummer.\", \"ikke\": \"Ressource (det, der bookes) og Bookinglinje (det, der er købt).\"}, \"BG-059\": {\"navn\": \"Varekategori\", \"omr\": \"Produkt, pakke og pris\", \"niv\": 2, \"type\": \"Egenskab\", \"def\": \"En gruppering af produkter, fx mad, vin, øl og vand, shop, ophold og pakke, som rabatter og rapportering afhænger af.\", \"syn\": \"Varegruppe.\", \"ikke\": \"Produkttype.\"}, \"BG-060\": {\"navn\": \"Pakke\", \"omr\": \"Produkt, pakke og pris\", \"niv\": 1, \"type\": \"Ting eller aftale\", \"def\": \"Et produkt, der består af flere produkter til én samlet pris, fx en getaway, et golfophold eller en mødepakke.\", \"syn\": \"Opholdspakke, pakkeophold, 'ophold med påhæng'.\", \"ikke\": \"Arrangement (det konkrete forløb).\"}, \"BG-061\": {\"navn\": \"Pakkeelement\", \"omr\": \"Produkt, pakke og pris\", \"niv\": 2, \"type\": \"Ting eller aftale\", \"def\": \"Et produkt, der indgår i en pakke, med antal og evt. krav om et tidspunkt, fx spa-entré eller middag.\", \"syn\": \"Pakkeindhold, varelinje i pakken.\", \"ikke\": \"Tilkøb (købes ved siden af).\"}, \"BG-062\": {\"navn\": \"Valgfrit pakkeelement\", \"omr\": \"Produkt, pakke og pris\", \"niv\": 2, \"type\": \"Ting eller aftale\", \"def\": \"Et pakkeelement, som gæsten selv vælger blandt flere muligheder, fx 'to valgfrie aktiviteter'.\", \"syn\": \"Valgfri aktivitet, gratis aktivitet.\", \"ikke\": \"Tilkøb og Rabatkode.\"}, \"BG-063\": {\"navn\": \"Getaway\", \"omr\": \"Produkt, pakke og pris\", \"niv\": 1, \"type\": \"Ting eller aftale\", \"def\": \"En pakke til private med overnatning og ét tema, fx spa, golf eller restaurant.\", \"syn\": \"Spa getaway, spaophold, golf getaway.\", \"ikke\": \"Golfrejse og Gruppe.\"}, \"BG-064\": {\"navn\": \"Golfophold\", \"omr\": \"Produkt, pakke og pris\", \"niv\": 2, \"type\": \"Ting eller aftale\", \"def\": \"En pakke med overnatning og greenfee, evt. med morgenmad eller middag.\", \"syn\": \"Golfpakke, golf getaway.\", \"ikke\": \"Golfrejse (via agent).\"}, \"BG-065\": {\"navn\": \"Mødepakke\", \"omr\": \"Produkt, pakke og pris\", \"niv\": 2, \"type\": \"Ting eller aftale\", \"def\": \"En pakke til møder, kurser eller konferencer med lokale, forplejning og evt. overnatning.\", \"syn\": \"Dagspakke, kursuspakke, konferencepakke, festpakke.\", \"ikke\": \"Arrangement.\"}, \"BG-066\": {\"navn\": \"Tilkøb\", \"omr\": \"Produkt, pakke og pris\", \"niv\": 1, \"type\": \"Ting eller aftale\", \"def\": \"Et produkt, gæsten køber oven i sin booking, fx bobler, blomster, vin eller golfbil.\", \"syn\": \"Tilvalg, add-on, mersalg.\", \"ikke\": \"Pakkeelement.\"}, \"BG-067\": {\"navn\": \"Aktivitet\", \"omr\": \"Produkt, pakke og pris\", \"niv\": 1, \"type\": \"Ting eller aftale\", \"def\": \"En bookbar oplevelse, fx padel, bowling, minigolf, teambuilding eller quiz.\", \"syn\": \"Oplevelse, ferieaktivitet.\", \"ikke\": \"Facilitet (adgang uden booking).\"}, \"BG-068\": {\"navn\": \"Holdaktivitet\", \"omr\": \"Produkt, pakke og pris\", \"niv\": 2, \"type\": \"Ting eller aftale\", \"def\": \"En aktivitet med fast tidspunkt og et maksimalt antal deltagere, fx crossfit eller yoga i ferieperioder.\", \"syn\": \"Holdplan, ferieaktivitet.\", \"ikke\": \"Banebooking.\"}, \"BG-069\": {\"navn\": \"Aktivitetsprogram\", \"omr\": \"Produkt, pakke og pris\", \"niv\": 3, \"type\": \"Ting eller aftale\", \"def\": \"Det planlagte program af holdaktiviteter i en ferieperiode.\", \"syn\": \"Ferieprogram.\", \"ikke\": \"Arrangementskøreplan.\"}, \"BG-070\": {\"navn\": \"Spa-entré\", \"omr\": \"Produkt, pakke og pris\", \"niv\": 2, \"type\": \"Ting eller aftale\", \"def\": \"Adgang til spaen i et tidsrum, typisk 3 timer.\", \"syn\": \"Spaadgang, entré.\", \"ikke\": \"Behandling.\"}, \"BG-071\": {\"navn\": \"Behandling\", \"omr\": \"Produkt, pakke og pris\", \"niv\": 2, \"type\": \"Ting eller aftale\", \"def\": \"En spabehandling, fx massage, som bookes på en behandler i et tidsrum.\", \"syn\": \"Spabehandling.\", \"ikke\": \"Spa-entré.\"}, \"BG-072\": {\"navn\": \"Greenfee\", \"omr\": \"Produkt, pakke og pris\", \"niv\": 2, \"type\": \"Ting eller aftale\", \"def\": \"Prisen for at spille en runde golf.\", \"syn\": \"Runde, greenfee-billet.\", \"ikke\": \"Starttid (tidspunktet).\"}, \"BG-073\": {\"navn\": \"Inkluderet ydelse\", \"omr\": \"Produkt, pakke og pris\", \"niv\": 1, \"type\": \"Egenskab\", \"def\": \"En ydelse, der er betalt via opholdet eller pakken og derfor ikke skal betales igen der, hvor den leveres.\", \"syn\": \"IO, 'i ophold', 'med i opholdet'.\", \"ikke\": \"Pakkeelement (selve produktet).\"}, \"BG-074\": {\"navn\": \"Pris\", \"omr\": \"Produkt, pakke og pris\", \"niv\": 1, \"type\": \"Egenskab\", \"def\": \"Beløbet for et produkt på et bestemt tidspunkt, evt. for en bestemt kanal, priskode eller gæstetype.\", \"syn\": \"Rate, listepris, dagspris.\", \"ikke\": \"Rabat.\"}, \"BG-075\": {\"navn\": \"Opholdsgæstpris\", \"omr\": \"Produkt, pakke og pris\", \"niv\": 2, \"type\": \"Egenskab\", \"def\": \"Den lavere pris på aktiviteter og spa, der gælder for gæster med ophold.\", \"syn\": \"Hotelpris.\", \"ikke\": \"Pakkepris.\"}, \"BG-076\": {\"navn\": \"Yield\", \"omr\": \"Produkt, pakke og pris\", \"niv\": 2, \"type\": \"Hændelse\", \"def\": \"Den daglige fastsættelse af værelsespriser ud fra belægning og forventet efterspørgsel.\", \"syn\": \"Revenue management, prisstyring.\", \"ikke\": \"Priskode.\"}, \"BG-077\": {\"navn\": \"Rabat\", \"omr\": \"Produkt, pakke og pris\", \"niv\": 2, \"type\": \"Ting eller aftale\", \"def\": \"Et nedslag i prisen, som en kunde får på grund af et medlemskab, en aftale, en rabatkode eller en særlig ret.\", \"syn\": \"Medlemsrabat, firmarabat, koncernrabat, rabatlinje.\", \"ikke\": \"Provision og Pris.\"}, \"BG-078\": {\"navn\": \"Gavekort\", \"omr\": \"Produkt, pakke og pris\", \"niv\": 2, \"type\": \"Ting eller aftale\", \"def\": \"Et tilgodehavende med en saldo, som kan bruges som betaling på resortet.\", \"syn\": \"Beløbsgavekort, Life Peaks-gavekort.\", \"ikke\": \"Medlemskort og Rabatkode.\"}, \"BG-079\": {\"navn\": \"Sæson\", \"omr\": \"Produkt, pakke og pris\", \"niv\": 2, \"type\": \"Egenskab\", \"def\": \"En periode med særlig efterspørgsel, priser og aktivitetsprogram, fx skoleferier, julemåned og golfsæson.\", \"syn\": \"Ferieperiode, højsæson.\", \"ikke\": \"Tidsrum.\"}, \"BG-080\": {\"navn\": \"Familieferie\", \"omr\": \"Produkt, pakke og pris\", \"niv\": 3, \"type\": \"Ting eller aftale\", \"def\": \"En pakke til familier i skoleferier, hvor ophold kombineres med aktivitetsprogrammet.\", \"syn\": \"Ferieophold.\", \"ikke\": \"Getaway.\"}, \"BG-081\": {\"navn\": \"Ressource\", \"omr\": \"Ressource og kapacitet\", \"niv\": 1, \"type\": \"Ting eller aftale\", \"def\": \"Noget, der bookes i tid og har begrænset kapacitet, fx et værelse, et lokale, et bord, en bane, en instruktør eller en golfbil.\", \"syn\": \"Kapacitet, facilitet (frarådes), værelsestype.\", \"ikke\": \"Produkt (det, der sælges) og Lokation (stedet).\"}, \"BG-082\": {\"navn\": \"Ressourcetype\", \"omr\": \"Ressource og kapacitet\", \"niv\": 3, \"type\": \"Egenskab\", \"def\": \"En kategori af ressourcer med samme egenskaber, fx dobbeltværelse, suite, mødelokale til 6 eller padelbane.\", \"syn\": \"Værelsestype, lokaletype.\", \"ikke\": \"Produkt.\"}, \"BG-083\": {\"navn\": \"Værelse\", \"omr\": \"Ressource og kapacitet\", \"niv\": 2, \"type\": \"Ting eller aftale\", \"def\": \"En ressource til overnatning på hotellet med et værelsesnummer.\", \"syn\": \"Hotelværelse; værelsesnummer.\", \"ikke\": \"Ophold (bookingen af værelset).\"}, \"BG-084\": {\"navn\": \"Feriehus\", \"omr\": \"Ressource og kapacitet\", \"niv\": 2, \"type\": \"Ting eller aftale\", \"def\": \"Et hus på resortet, der udlejes til ophold.\", \"syn\": \"Hus.\", \"ikke\": \"Værelse.\"}, \"BG-085\": {\"navn\": \"Lokale\", \"omr\": \"Ressource og kapacitet\", \"niv\": 2, \"type\": \"Ting eller aftale\", \"def\": \"Et møde-, konference- eller festlokale, der bookes til et arrangement.\", \"syn\": \"Mødelokale, selskabslokale, Multihallen.\", \"ikke\": \"Lokation.\"}, \"BG-086\": {\"navn\": \"Bord\", \"omr\": \"Ressource og kapacitet\", \"niv\": 2, \"type\": \"Ting eller aftale\", \"def\": \"En plads i en restaurant til et antal kuverter.\", \"syn\": \"Kuvert, seating.\", \"ikke\": \"Bordreservation.\"}, \"BG-087\": {\"navn\": \"Golfbane\", \"omr\": \"Ressource og kapacitet\", \"niv\": 2, \"type\": \"Ting eller aftale\", \"def\": \"En bane, der bookes i starttider, fx Old Course, New Course eller Par 3.\", \"syn\": \"Bane, course.\", \"ikke\": \"Lokation.\"}, \"BG-088\": {\"navn\": \"Facilitet\", \"omr\": \"Ressource og kapacitet\", \"niv\": 2, \"type\": \"Ting eller aftale\", \"def\": \"Et fast anlæg, som gæster får adgang til uden at booke en tid, fx fitness, svømmehal eller minigolf.\", \"syn\": \"Anlæg.\", \"ikke\": \"Ressource (bookes i tid).\"}, \"BG-089\": {\"navn\": \"Instruktør\", \"omr\": \"Ressource og kapacitet\", \"niv\": 2, \"type\": \"Part eller rolle\", \"def\": \"En person, der bookes til undervisning eller træning, fx en golfpro eller padelinstruktør.\", \"syn\": \"Pro, træner.\", \"ikke\": \"Medarbejder (ansættelsen).\"}, \"BG-090\": {\"navn\": \"Udstyr\", \"omr\": \"Ressource og kapacitet\", \"niv\": 2, \"type\": \"Ting eller aftale\", \"def\": \"Bookbart udstyr i et begrænset antal, fx golfbiler og trolleys.\", \"syn\": \"Lejeudstyr.\", \"ikke\": \"Tilkøb.\"}, \"BG-091\": {\"navn\": \"Golfbil\", \"omr\": \"Ressource og kapacitet\", \"niv\": 2, \"type\": \"Ting eller aftale\", \"def\": \"Udstyr, der lejes ud til golfspillere sammen med en starttid eller i golfshoppen.\", \"syn\": \"Buggy, golfvogn.\", \"ikke\": \"Trolley.\"}, \"BG-092\": {\"navn\": \"Lokation\", \"omr\": \"Ressource og kapacitet\", \"niv\": 1, \"type\": \"Ting eller aftale\", \"def\": \"Et fysisk sted på resortet, hvor ydelser leveres og salg sker, fx hotellet, Hul 19, HimmerRiget, Larsens Sportsbar, spaen, golfshoppen og købmanden.\", \"syn\": \"Salgssted, outlet, restaurant, shop.\", \"ikke\": \"Ressource.\"}, \"BG-093\": {\"navn\": \"Kapacitet\", \"omr\": \"Ressource og kapacitet\", \"niv\": 1, \"type\": \"Egenskab\", \"def\": \"Hvor meget af en ressource der kan sælges i et tidsrum.\", \"syn\": \"Ledighed, availability.\", \"ikke\": \"Belægning (det solgte).\"}, \"BG-094\": {\"navn\": \"Kapacitetsreservation\", \"omr\": \"Ressource og kapacitet\", \"niv\": 2, \"type\": \"Ting eller aftale\", \"def\": \"Kapacitet, der holdes til en bestemt gruppe, agent eller begivenhed, før den konkrete booking er på plads.\", \"syn\": \"Blokering, forhåndsreservation, allotment, kvote.\", \"ikke\": \"Salgsstop.\"}, \"BG-095\": {\"navn\": \"Banblokering\", \"omr\": \"Ressource og kapacitet\", \"niv\": 2, \"type\": \"Ting eller aftale\", \"def\": \"En kapacitetsreservation af tider på golfbanen til en gruppe, turnering eller et arrangement, før spillerne er kendt.\", \"syn\": \"Blokering, banelukning.\", \"ikke\": \"Starttid.\"}, \"BG-096\": {\"navn\": \"Belægning\", \"omr\": \"Ressource og kapacitet\", \"niv\": 2, \"type\": \"Egenskab\", \"def\": \"Den del af kapaciteten, der er solgt eller i brug.\", \"syn\": \"Occupancy.\", \"ikke\": \"Kapacitet.\"}, \"BG-097\": {\"navn\": \"Grupperegel\", \"omr\": \"Ressource og kapacitet\", \"niv\": 2, \"type\": \"Egenskab\", \"def\": \"En regel, der afgør, hvordan en gruppe håndteres, fx at mere end 5 værelser sendes til salg, eller at mere end 10 personer kræver forudbestilt menu.\", \"syn\": \"'Over 5 værelser'.\", \"ikke\": \"Aftale.\"}, \"BG-098\": {\"navn\": \"Overbooking\", \"omr\": \"Ressource og kapacitet\", \"niv\": 3, \"type\": \"Hændelse\", \"def\": \"En hændelse, hvor mere er solgt, end der er kapacitet til.\", \"syn\": \"Dobbeltbooking.\", \"ikke\": \"Kapacitet.\"}, \"BG-099\": {\"navn\": \"Tidsrum\", \"omr\": \"Ressource og kapacitet\", \"niv\": 3, \"type\": \"Egenskab\", \"def\": \"En fast tidsenhed, som kapacitet styres i, fx en halv time.\", \"syn\": \"Slot.\", \"ikke\": \"Starttid.\"}, \"BG-100\": {\"navn\": \"Booking\", \"omr\": \"Booking og levering\", \"niv\": 1, \"type\": \"Ting eller aftale\", \"def\": \"Kundens samlede køb til ét besøg med en periode, en status og en salgskanal.\", \"syn\": \"Reservation (Spectra), ordre.\", \"ikke\": \"Bookinglinje (en del af bookingen).\"}, \"BG-101\": {\"navn\": \"Bookinglinje\", \"omr\": \"Booking og levering\", \"niv\": 1, \"type\": \"Ting eller aftale\", \"def\": \"En enkelt del af en booking, fx et ophold, en spatid, et bord, en starttid, et lokale eller et tilkøb, med tidspunkt, antal og pris.\", \"syn\": \"Varelinje, ordrelinje, reservation.\", \"ikke\": \"Booking (det samlede køb) og Køb (salg på et salgssted).\"}, \"BG-102\": {\"navn\": \"Reservationsnummer\", \"omr\": \"Booking og levering\", \"niv\": 2, \"type\": \"Egenskab\", \"def\": \"Det nummer, der identificerer en booking.\", \"syn\": \"Bookingnummer, bekræftelsesnummer, res.nr.\", \"ikke\": \"Værelsesnummer.\"}, \"BG-103\": {\"navn\": \"Bookingstatus\", \"omr\": \"Booking og levering\", \"niv\": 2, \"type\": \"Egenskab\", \"def\": \"Hvor langt en booking eller bookinglinje er, fx forespurgt, option, bekræftet, annulleret eller gennemført.\", \"syn\": \"Status.\", \"ikke\": \"Bekræftelse (beskeden).\"}, \"BG-104\": {\"navn\": \"Ophold\", \"omr\": \"Booking og levering\", \"niv\": 1, \"type\": \"Ting eller aftale\", \"def\": \"Den del af en booking, der er overnatning på et værelse eller i et feriehus i en periode.\", \"syn\": \"Overnatning, stay.\", \"ikke\": \"Booking og Pakke.\"}, \"BG-105\": {\"navn\": \"Check-in\", \"omr\": \"Booking og levering\", \"niv\": 2, \"type\": \"Hændelse\", \"def\": \"Gæstens ankomst og registrering på opholdet, i receptionen eller online.\", \"syn\": \"Ankomst, online check-in.\", \"ikke\": \"Bekræftelse af starttid (golf).\"}, \"BG-106\": {\"navn\": \"Check-ud\", \"omr\": \"Booking og levering\", \"niv\": 2, \"type\": \"Hændelse\", \"def\": \"Gæstens afrejse, hvor regningen gennemgås og afregnes.\", \"syn\": \"Afrejse, udtjekning.\", \"ikke\": \"Afregning af firmaets faktura.\"}, \"BG-107\": {\"navn\": \"Bordreservation\", \"omr\": \"Booking og levering\", \"niv\": 1, \"type\": \"Ting eller aftale\", \"def\": \"En bookinglinje på et bord i en restaurant med antal kuverter, tidspunkt, særlige ønsker og evt. menu.\", \"syn\": \"Bordbestilling, konferencemiddag, reservation.\", \"ikke\": \"Bord og Seating.\"}, \"BG-108\": {\"navn\": \"Spatid\", \"omr\": \"Booking og levering\", \"niv\": 2, \"type\": \"Ting eller aftale\", \"def\": \"En bookinglinje på spa-entré eller en behandling på et bestemt tidspunkt.\", \"syn\": \"Spatid, behandlingstid.\", \"ikke\": \"Spa-entré (produktet).\"}, \"BG-109\": {\"navn\": \"Starttid\", \"omr\": \"Booking og levering\", \"niv\": 1, \"type\": \"Ting eller aftale\", \"def\": \"En bookinglinje på en golfbane med tidspunkt og antal spillere.\", \"syn\": \"Teetime, golftid, '10-tid'.\", \"ikke\": \"Greenfee (prisen).\"}, \"BG-110\": {\"navn\": \"Særligt ønske\", \"omr\": \"Booking og levering\", \"niv\": 1, \"type\": \"Ting eller aftale\", \"def\": \"En oplysning om en gæsts eller deltagers behov, der skal følge bookingen ud i driften, fx allergi, kost, anledning eller flag på bordet.\", \"syn\": \"Særønske, præference, notat.\", \"ikke\": \"Tilkøb (koster penge).\"}, \"BG-111\": {\"navn\": \"Allergi\", \"omr\": \"Booking og levering\", \"niv\": 2, \"type\": \"Egenskab\", \"def\": \"Et særligt ønske, der er en helbredsoplysning og derfor følsomme persondata.\", \"syn\": \"Allergen, kostbehov.\", \"ikke\": \"Kostønske (fx vegetar).\"}, \"BG-112\": {\"navn\": \"Ønsket tidspunkt\", \"omr\": \"Booking og levering\", \"niv\": 2, \"type\": \"Egenskab\", \"def\": \"Gæstens ønske til tidspunkt for et pakkeelement, fx spa eller middag, før tiden er reserveret.\", \"syn\": \"Ønsket tid.\", \"ikke\": \"Pladsholdertid.\"}, \"BG-113\": {\"navn\": \"Pladsholdertid\", \"omr\": \"Booking og levering\", \"niv\": 3, \"type\": \"Egenskab\", \"def\": \"Et fiktivt tidspunkt, der sættes på et pakkeelement, fordi systemet kræver en tid, fx 14:59 for spa og 06:30 for morgenmad.\", \"syn\": \"Fiktiv tid.\", \"ikke\": \"Ønsket tidspunkt.\"}, \"BG-114\": {\"navn\": \"Bekræftelse\", \"omr\": \"Booking og levering\", \"niv\": 1, \"type\": \"Hændelse\", \"def\": \"HimmerLands besked til kunden om, hvad der er booket, sendt ved booking og ved ændringer.\", \"syn\": \"Bookingbekræftelse.\", \"ikke\": \"Accept og Bekræftelse af starttid.\"}, \"BG-115\": {\"navn\": \"Ændring\", \"omr\": \"Booking og levering\", \"niv\": 2, \"type\": \"Hændelse\", \"def\": \"En rettelse af en booking, fx af tidspunkt, antal eller indhold.\", \"syn\": \"Rettelse, flytning.\", \"ikke\": \"Annullering.\"}, \"BG-116\": {\"navn\": \"Annullering\", \"omr\": \"Booking og levering\", \"niv\": 2, \"type\": \"Hændelse\", \"def\": \"En aflysning af en booking eller en bookinglinje.\", \"syn\": \"Afbestilling, afmelding.\", \"ikke\": \"Udeblivelse.\"}, \"BG-117\": {\"navn\": \"Udeblivelse\", \"omr\": \"Booking og levering\", \"niv\": 2, \"type\": \"Hændelse\", \"def\": \"At en gæst ikke møder op til en booket tid eller et bord.\", \"syn\": \"No-show.\", \"ikke\": \"Annullering.\"}, \"BG-118\": {\"navn\": \"Fristdato\", \"omr\": \"Booking og levering\", \"niv\": 2, \"type\": \"Egenskab\", \"def\": \"En dato, hvor noget skal være på plads på en booking, fx betaling, valg af aktiviteter, deltagerliste eller menu.\", \"syn\": \"Frist, deadline, betalingsfrist.\", \"ikke\": \"Opfølgning.\"}, \"BG-119\": {\"navn\": \"Deltagerliste\", \"omr\": \"Booking og levering\", \"niv\": 2, \"type\": \"Ting eller aftale\", \"def\": \"Listen over deltagere i en booking med værelsesfordeling, menuvalg og allergier.\",

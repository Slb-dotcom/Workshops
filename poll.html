<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kvadrant Poll</title>
<style>
:root{--bg:#F3EFE9;--ink:#3C2C1C;--ink2:#5D4B3D;--tan:#8A6A4C;--line:#E3DBD0;--red:#BF574E;--green:#4F9461;--gold:#E6B840}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,"Segoe UI",sans-serif;display:flex;flex-direction:column;min-height:100vh}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;font-size:14px;color:var(--ink2);border-bottom:1px solid var(--line);background:#fff}
.top b{color:var(--ink)}
.link{border:0;background:none;color:var(--tan);font:600 14px system-ui;cursor:pointer;text-decoration:underline;padding:4px}
main{flex:1;width:100%;max-width:560px;margin:0 auto;padding:22px 16px 30px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 8px 30px rgba(60,44,28,.10)}
h1{font-size:24px;margin:0 0 6px}
h2{font-size:24px;line-height:1.25;margin:6px 0 18px}
p{margin:0 0 12px;color:var(--ink2)}
.prog{font-size:13px;font-weight:600;color:var(--tan);letter-spacing:.04em;text-transform:uppercase}
input[type=text],textarea{width:100%;padding:13px 14px;border:1px solid #CFC4B6;border-radius:10px;font:17px system-ui;background:#fff;color:var(--ink)}
textarea{min-height:110px;resize:vertical}
.btn{display:block;width:100%;border:0;border-radius:10px;background:var(--tan);color:#fff;font:600 17px system-ui;padding:14px 16px;cursor:pointer;margin-top:12px}
.btn:disabled{opacity:.5;cursor:default}
.opt{display:block;width:100%;text-align:left;border:2px solid #D8CDBF;border-radius:12px;background:#fff;color:var(--ink);font:600 18px system-ui;padding:16px;margin-top:10px;cursor:pointer;transition:transform .08s,border-color .15s,background .15s}
.opt:active{transform:scale(.985)}
.opt.sel{border-color:var(--tan);background:#EFE4D7}
.opt:disabled{cursor:default;opacity:.7}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:6px}
.scale .opt{text-align:center;margin:0;padding:18px 0;font-size:22px}
.ends{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin-top:8px}
.note{margin-top:14px;font-size:14px;color:var(--green);min-height:20px}
.note.err{color:var(--red)}
.hint{font-size:14px;background:#FBF8F4;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:12px;color:var(--ink2)}
.wait{text-align:center;padding:38px 10px}
.dots{display:flex;gap:8px;justify-content:center;margin-top:18px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--tan);animation:p 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes p{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.banner{background:#F6E3E0;color:var(--red);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600;margin-bottom:14px}
.foot{text-align:center;font-size:12px;color:#8C847A;padding:10px}
.conn{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--green);margin-right:6px}
.conn.off{background:var(--red)}
</style>
</head>
<body>
<div id="app"></div>
<div class="foot">Kvadrant Poll v1</div>
<script>
const CONFIG = {
  url: 'https://hdffpdighiblwabimelg.supabase.co',
  key: 'sb_publishable_vbwoHt0dhHIFhwSM0d_R-A_LfZC52pS'
};
const H = { 'Content-Type': 'application/json', apikey: CONFIG.key };
const rpc = (fn, b) => fetch(CONFIG.url + '/rest/v1/rpc/' + fn, { method: 'POST', headers: H, body: JSON.stringify(b) })
  .then(async r => { if (!r.ok) { let m = 'HTTP ' + r.status; try { m = (await r.json()).message || m; } catch (e) {} throw new Error(m); } return r.json(); });
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ls = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} return null; };
const ss = (k, v) => { try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) {} return null; };

const qs = new URLSearchParams(location.search);
let room = (qs.get('r') || '').trim().toLowerCase();
let me = null, mine = {}, cur = null, online = true, note = '', noteErr = false, sig = '', draft = {};

const app = $('#app');
const topbar = () => me ? `<div class="top"><span><span class="conn ${online ? '' : 'off'}"></span>Du er logget ind som <b>${me.name ? esc(me.name) : 'Anonym'}</b></span><button class="link" id="chg">Skift</button></div>` : '';

function drawRoom() {
  app.innerHTML = `<main><div class="card"><h1>Kvadrant Poll</h1><p>Skriv rumkoden, du har fået af oplægsholderen.</p>
  <input type="text" id="rc" placeholder="Rumkode" autocapitalize="off" autocomplete="off"><button class="btn" id="rg">Fortsæt</button></div></main>`;
  $('#rg').onclick = () => { const v = $('#rc').value.trim().toLowerCase(); if (v) location.search = '?r=' + encodeURIComponent(v); };
}

function drawLogin() {
  const saved = ls('kvp_name_' + room) || '';
  app.innerHTML = `<main><div class="card"><h1>Velkommen</h1><p>Skriv dit navn, hvis du vil. Så kan du lukke siden og komme tilbage til dine svar.</p>
  <input type="text" id="nm" placeholder="Dit navn (valgfrit)" value="${esc(saved)}" autocomplete="off">
  <div class="hint" id="hint"></div>
  <button class="btn" id="go">Deltag</button></div></main>`;
  const hint = () => { const v = $('#nm').value.trim();
    $('#hint').textContent = v ? 'Du logger ind som ' + v + '. Dine svar gemmes, og du kan hente dem igen, hvis du bruger samme navn.'
      : 'Du logger ind som Anonym. Dine svar gemmes hos os, men du kan ikke hente dem igen, hvis du lukker siden.'; };
  $('#nm').oninput = hint; hint();
  $('#nm').onkeydown = e => { if (e.key === 'Enter') join($('#nm').value); };
  $('#go').onclick = () => join($('#nm').value);
}

function join(name) {
  name = (name || '').trim().slice(0, 40);
  if (name) { me = { name, voter: 'n:' + name.toLowerCase() }; ls('kvp_name_' + room, name); ss('kvp_anon_on_' + room, null); }
  else {
    let id = ss('kvp_anon_' + room);
    if (!id) { id = Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-3); ss('kvp_anon_' + room, id); }
    me = { name: '', voter: 'a:' + id }; ls('kvp_name_' + room, null); ss('kvp_anon_on_' + room, '1');
  }
  mine = {}; draft = {}; sig = ''; note = '';
  if (name) rpc('poll_mine', { p_room: room, p_voter: me.voter }).then(m => { mine = m || {}; sig = ''; draw(); }).catch(() => {});
  draw(); tick();
}

function leave() { me = null; ls('kvp_name_' + room, null); ss('kvp_anon_on_' + room, null); sig = ''; draw(); }

function frame(inner) { app.innerHTML = topbar() + '<main>' + inner + '</main>'; const c = $('#chg'); if (c) c.onclick = leave; }

function draw() {
  if (!room) return drawRoom();
  if (!me) { if (sig !== 'login') { sig = 'login'; drawLogin(); } return; }
  const g = cur || { exists: false };
  const q = g.question, qid = q ? q.id : '';
  const s = JSON.stringify([g.exists, g.active, g.open, g.count, qid, me.voter, mine[qid], note, noteErr, online]);
  if (s === sig) return; sig = s;
  const conn = document.querySelector('.conn'); if (conn) conn.className = 'conn' + (online ? '' : ' off');

  if (!g.exists) return frame('<div class="card wait"><h1>Venter på oplægsholderen</h1><p>Siden skifter af sig selv, når der er noget at svare på.</p><div class="dots"><i></i><i></i><i></i></div></div>');
  if (g.active < 0) return frame('<div class="card wait"><h1>Snart i gang</h1><p>Spørgsmålet dukker op her, så snart oplægsholderen åbner det.</p><div class="dots"><i></i><i></i><i></i></div></div>');
  if (!q) return frame('<div class="card wait"><h1>Tak for din deltagelse</h1><p>Afstemningen er slut.</p></div>');

  const val = mine[qid] ? mine[qid].v : undefined, closed = !g.open;
  let body = '';
  if (q.type === 'choice') {
    const multi = !!q.multi;
    if (multi && draft[qid] === undefined) draft[qid] = Array.isArray(val) ? val.slice() : [];
    const chosen = multi ? draft[qid] : [val];
    body = q.options.map((o, i) => `<button class="opt ${chosen.includes(o) ? 'sel' : ''}" data-i="${i}" ${closed ? 'disabled' : ''}>${esc(o)}</button>`).join('');
    if (multi) body += `<p style="margin-top:10px;font-size:14px">Du kan vælge flere.</p><button class="btn" id="sendm" ${closed ? 'disabled' : ''}>${val ? 'Opdater svar' : 'Send svar'}</button>`;
  } else if (q.type === 'scale') {
    body = '<div class="scale">' + [1, 2, 3, 4, 5].map(n => `<button class="opt ${val === n ? 'sel' : ''}" data-n="${n}" ${closed ? 'disabled' : ''}>${n}</button>`).join('') + '</div>' +
      `<div class="ends"><span>${esc(q.min || '')}</span><span>${esc(q.max || '')}</span></div>`;
  } else {
    const t = draft[qid] !== undefined ? draft[qid] : (val || '');
    body = `<textarea id="tx" maxlength="280" placeholder="Skriv dit svar her" ${closed ? 'disabled' : ''}>${esc(t)}</textarea><button class="btn" id="sendt" ${closed ? 'disabled' : ''}>${val ? 'Opdater svar' : 'Send svar'}</button>`;
  }
  frame(`<div class="card">${closed ? '<div class="banner">Der er lukket for svar</div>' : ''}<div class="prog">Spørgsmål ${g.active + 1} af ${g.count}</div><h2>${esc(q.text)}</h2>${body}<div class="note ${noteErr ? 'err' : ''}">${esc(note)}</div></div>`);

  document.querySelectorAll('.opt[data-i]').forEach(b => b.onclick = () => {
    const o = q.options[+b.dataset.i];
    if (q.multi) { const a = draft[qid]; const k = a.indexOf(o); if (k >= 0) a.splice(k, 1); else a.push(o); note = ''; sig = ''; draw(); }
    else send(q, o);
  });
  document.querySelectorAll('.opt[data-n]').forEach(b => b.onclick = () => send(q, +b.dataset.n));
  const sm = $('#sendm'); if (sm) sm.onclick = () => { if (!draft[qid].length) { note = 'Vælg mindst ét svar'; noteErr = true; sig = ''; return draw(); } send(q, draft[qid].slice()); };
  const st = $('#sendt'), tx = $('#tx');
  if (tx) tx.oninput = () => { draft[qid] = tx.value; };
  if (st) st.onclick = () => { const v = tx.value.trim(); if (!v) { note = 'Skriv noget først'; noteErr = true; sig = ''; return draw(); } send(q, v); };
}

async function send(q, v) {
  try {
    await rpc('poll_vote', { p_room: room, p_qid: q.id, p_voter: me.voter, p_name: me.name || null, p_value: { v } });
    mine[q.id] = { v }; if (q.type === 'text') draft[q.id] = v; if (q.multi) draft[q.id] = v.slice();
    note = 'Dit svar er sendt. Du kan ændre det, så længe der er åbent.'; noteErr = false;
  } catch (e) {
    note = /lukket/.test(e.message) ? 'Der er lukket for svar.' : 'Kunne ikke sende. Prøv igen.'; noteErr = true;
  }
  sig = ''; draw();
}

let lastQ = '';
async function tick() {
  if (!room || !me) return;
  try { const g = await rpc('poll_get', { p_room: room }); online = true;
    const id = g.question ? g.question.id : '';
    if (id !== lastQ) { lastQ = id; note = ''; noteErr = false; }
    cur = g;
  } catch (e) { online = false; }
  draw();
}
setInterval(tick, 2000);

if (room) {
  const sn = ls('kvp_name_' + room);
  if (sn) join(sn); else if (ss('kvp_anon_on_' + room)) join(''); else draw();
} else draw();
</script>
</body>
</html>
